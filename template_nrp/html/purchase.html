<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Package Purchase - AI BTC BOT</title>
    <script src="js/language.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #000;
            color: #fff;
            overflow-x: auto;
            position: relative;
        }

        /* 신경망 배경 */
        .neural-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: radial-gradient(ellipse at center, #0a0a1f 0%, #000000 100%);
        }

        .neural-grid {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(0, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridPulse 4s ease-in-out infinite;
        }

        @keyframes gridPulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }

        /* 펄스 노드들 */
        .pulse-node {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #00ffff;
            box-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff;
            animation: nodePulse 2s ease-in-out infinite;
        }

        @keyframes nodePulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(2);
                opacity: 0.5;
            }
        }

        .neural-connections {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* 컨테이너 */
        .container {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            padding: 0;
            display: flex;
            flex-direction: column;
        }

        /* 플로팅 네비게이션 */
        .floating-nav {
            position: fixed;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .back-button {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            color: #00ffff;
        }

        .back-button:hover {
            background: rgba(0, 255, 255, 0.2);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
            transform: translateY(-2px) scale(1.05);
        }

        .page-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 28px;
            font-weight: 300;
            letter-spacing: 6px;
            background: linear-gradient(45deg, #00ffff, #ff00ff, #ffff00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        

        /* 홈 버튼 */
        .home-button {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s;
        }

        .home-button:hover {
            background: rgba(0, 255, 255, 0.2);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
        }

        .mini-pulse {
            position: relative;
            width: 30px;
            height: 30px;
        }

        .mini-ring {
            position: absolute;
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 50%;
            animation: miniRingRotate 3s linear infinite;
        }

        .mini-ring:nth-child(1) {
            width: 100%;
            height: 100%;
            border-top-color: #00ffff;
            animation-duration: 2s;
        }

        .mini-ring:nth-child(2) {
            width: 70%;
            height: 70%;
            top: 15%;
            left: 15%;
            border-right-color: #ff00ff;
            animation-duration: 3s;
            animation-direction: reverse;
        }

        .mini-core {
            position: absolute;
            width: 10px;
            height: 10px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, #00ffff 0%, transparent 70%);
            border-radius: 50%;
            animation: miniCorePulse 1.5s ease-in-out infinite;
        }

        @keyframes miniRingRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes miniCorePulse {
            0%, 100% { box-shadow: 0 0 10px #00ffff; }
            50% { box-shadow: 0 0 20px #00ffff, 0 0 30px #00ffff; }
        }

        /* 메인 콘텐츠 */
        .content-section {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 120px 20px 60px;
            min-height: 100vh;
        }

        .purchase-container {
            max-width: 900px;
            width: 100%;
        }

        .section-title {
            font-size: 28px;
            font-weight: 300;
            letter-spacing: 4px;
            margin-bottom: 30px;
            text-align: center;
            background: linear-gradient(45deg, #00ffff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 패키지 카드 */
        .packages-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .package-card {
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.05), rgba(255, 0, 255, 0.05));
            backdrop-filter: blur(20px);
            border: 2px solid rgba(0, 255, 255, 0.3);
            border-radius: 20px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.4s;
            position: relative;
            overflow: hidden;
        }

        .package-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(0, 255, 255, 0.1), transparent);
            transform: rotate(45deg);
            transition: all 0.6s;
        }

        .package-card:hover::before {
            left: 100%;
        }

        .package-card:hover {
            border-color: #00ffff;
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.3);
            transform: translateY(-5px);
        }

        .package-card.selected {
            border-color: #00ffff;
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.15), rgba(255, 0, 255, 0.15));
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.5);
        }

        .package-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .package-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00ffff, #0099ff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }

        .package-card.gold .package-icon {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        .package-card[data-avatar] .package-icon {
            background: linear-gradient(135deg, #00ffff, #00cccc);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
            font-size: 20px;
        }

        .package-card.gold[data-avatar] .package-icon {
            background: linear-gradient(135deg, #00ffff, #0099ff);
            box-shadow: 0 0 20px rgba(0, 153, 255, 0.5);
            font-size: 20px;
        }

        .double-avatar-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .package-icon.small-icon {
            width: 40px;
            height: 40px;
            font-size: 20px;
        }

        .package-check {
            width: 30px;
            height: 30px;
            border: 2px solid rgba(0, 255, 255, 0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .package-card.selected .package-check {
            background: #00ffff;
            border-color: #00ffff;
        }

        .package-check::after {
            content: '✓';
            color: #000;
            font-size: 18px;
            font-weight: bold;
            opacity: 0;
            transition: all 0.3s;
        }

        .package-card.selected .package-check::after {
            opacity: 1;
        }

        .package-name {
            font-size: 20px;
            font-weight: 600;
            color: #00ffff;
            margin-bottom: 8px;
        }

        .package-card.gold .package-name {
            color: #ffd700;
        }

        .package-card[data-avatar] .package-name {
            color: #00dddd;
        }

        .package-card.gold[data-avatar] .package-name {
            color: #00aaff;
        }

        .package-price {
            font-size: 32px;
            font-weight: 300;
            margin-bottom: 12px;
        }

        .package-price span {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.6);
        }

        .package-features {
            list-style: none;
            margin-bottom: 0;
        }

        .package-features li {
            padding: 6px 0;
            color: rgba(255, 255, 255, 0.8);
            font-size: 13px;
            position: relative;
            padding-left: 20px;
        }

        .package-features li::before {
            content: '✓';
            position: absolute;
            left: 0;
            color: #00ffff;
            font-weight: bold;
        }

        /* 결제 정보 */
        .payment-section {
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.05), rgba(255, 0, 255, 0.05));
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-label {
            display: block;
            margin-bottom: 10px;
            color: #00ffff;
            font-size: 14px;
            letter-spacing: 1px;
        }

        .form-input {
            width: 100%;
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            transition: all 0.3s;
        }

        .form-input:focus {
            outline: none;
            border-color: #00ffff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
        }

        .form-select {
            width: 100%;
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .form-select:focus {
            outline: none;
            border-color: #00ffff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
        }

        .form-select option {
            background: #1a1a2e;
            color: #fff;
        }

        /* 구매 요약 */
        .purchase-summary {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
        }

        .summary-total {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-top: 1px solid rgba(0, 255, 255, 0.2);
            margin-top: 10px;
            font-size: 20px;
            font-weight: 600;
            color: #00ffff;
        }

        /* 구매 버튼 */
        .purchase-button {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #00ffff, #0099ff);
            border: none;
            border-radius: 15px;
            color: #000;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.4s;
            box-shadow: 0 5px 30px rgba(0, 255, 255, 0.4);
            position: relative;
            overflow: hidden;
        }

        .purchase-button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .purchase-button:hover::before {
            width: 300px;
            height: 300px;
        }

        .purchase-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 40px rgba(0, 255, 255, 0.6);
        }

        .purchase-button:active {
            transform: translateY(-1px);
        }

        .purchase-button:disabled {
            background: rgba(100, 100, 100, 0.5);
            cursor: not-allowed;
            box-shadow: none;
        }

        .button-text {
            position: relative;
            z-index: 1;
        }

        /* 메시지 */
        .message {
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 14px;
            display: none;
        }

        .message.success {
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid rgba(0, 255, 0, 0.3);
            color: #00ff00;
        }

        .message.error {
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid rgba(255, 0, 0, 0.3);
            color: #ff4444;
        }

        /* 반응형 */
        @media (max-width: 768px) {
            .page-title {
                font-size: 20px;
                letter-spacing: 3px;
            }

            .packages-grid {
                grid-template-columns: 1fr;
            }

            .section-title {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <!-- 신경망 배경 -->
    <div class="neural-background">
        <div class="neural-grid"></div>
    </div>

    <!-- 펄스 노드들 -->
    <div class="neural-connections" id="neuralConnections"></div>

    <!-- 플로팅 네비게이션 -->
    <nav class="floating-nav">
        <a href="javascript:history.back()" class="back-button">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
        </a>

        <div class="page-title" data-lang="purchase.pageTitle">PURCHASE</div>

        <!-- 우측 버튼 그룹 -->
        <div style="display: flex; align-items: center;">
            <!-- 홈 버튼 (미니 펄스 로고) -->
            <div class="home-button" id="homeButton">
                <div class="mini-pulse">
                    <div class="mini-ring"></div>
                    <div class="mini-ring"></div>
                    <div class="mini-core"></div>
                </div>
            </div>
        </div>
    </nav>

    
    <!-- 메인 컨테이너 -->
    <div class="container">
        <section class="content-section">
            <div class="purchase-container">
                <h1 class="section-title" data-lang="purchase.selectPackage">패키지 선택</h1>

                <!-- 메시지 영역 -->
                <div id="message" class="message"></div>

                <!-- 패키지 선택 -->
                <div class="packages-grid">
                    <!-- 패키지 100 (프리미엄) -->
                    <div class="package-card gold" data-package="PKG_100" data-price="100">
                        <div class="package-header">
                            <div class="package-icon">💎</div>
                            <div class="package-check"></div>
                        </div>
                        <h3 class="package-name" data-lang="purchase.premiumPackage">프리미엄 패키지</h3>
                        <div class="package-price">$100<span> USDT</span></div>
                        <!-- 특징 (주석처리)
                        <ul class="package-features">
                            <li data-lang="purchase.premiumFeature1">레벨 1~5: $9 보너스 (2.25배)</li>
                            <li data-lang="purchase.premiumFeature2">$300 배수마다 아바타 2개</li>
                            <li data-lang="purchase.premiumFeature3">더 빠른 조직 확장</li>
                        </ul>
                        -->
                    </div>

                    <!-- 패키지 50 (스타터) -->
                    <div class="package-card" data-package="PKG_50" data-price="50">
                        <div class="package-header">
                            <div class="package-icon">🚀</div>
                            <div class="package-check"></div>
                        </div>
                        <h3 class="package-name" data-lang="purchase.starterPackage">스타터 패키지</h3>
                        <div class="package-price">$50<span> USDT</span></div>
                        <!-- 특징 (주석처리)
                        <ul class="package-features">
                            <li data-lang="purchase.starterFeature1">레벨 1~5: $4 보너스</li>
                            <li data-lang="purchase.starterFeature2">$150 배수마다 아바타 1개</li>
                            <li data-lang="purchase.starterFeature3">$50 추가구매로 $100 전환</li>
                        </ul>
                        -->
                    </div>
                </div>

                <!-- 결제 정보 -->
                <div class="payment-section">
                    <h3 class="section-title" style="font-size: 20px; margin-bottom: 25px;" data-lang="purchase.paymentInfo">결제 정보</h3>

                    <!-- 입금 방법 표시 -->
                    <div class="form-group">
                        <label class="form-label" data-lang="purchase.paymentMethod">입금 방법</label>
                        <div style="background: rgba(0, 255, 255, 0.1); border: 2px solid #00ffff; border-radius: 10px; padding: 15px;">
                            <div style="display: flex; align-items: center; gap: 10px;">
                                <span style="font-size: 24px;">💰</span>
                                <span style="font-size: 16px; font-weight: 600; color: #00ffff;">USDT (TRC20)</span>
                            </div>
                        </div>
                    </div>

                    <!-- USDT 입금 주소 표시 영역 -->
                    <div id="usdtDepositSection" class="form-group" style="display: block;">
                        <label class="form-label" data-lang="purchase.depositAddress">USDT (TRC20) 입금 주소</label>
                        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
                            <input type="text" id="depositAddress" class="form-input" value="TSMZdowTbRC7wMKKkEjSL3LXss9coZW16Q" readonly style="flex: 1; margin: 0; font-family: monospace; font-size: 14px; color: #00ffff; background: rgba(0, 0, 0, 0.7);">
                            <button type="button" onclick="copyDepositAddress()" style="padding: 12px 20px; background: #00ffff; color: #000; border: none; border-radius: 10px; cursor: pointer; font-weight: 600; white-space: nowrap;" data-lang="purchase.copyButton">복사</button>
                        </div>
                        <p style="color: rgba(255, 255, 255, 0.6); font-size: 12px; margin-top: 8px;" data-lang="purchase.depositWarning">
                            ⚠️ 반드시 TRC20 네트워크를 사용하여 USDT를 입금해주세요.<br>
                            다른 네트워크로 입금 시 자산을 잃을 수 있습니다.
                        </p>
                    </div>

                    <div class="form-group">
                        <label class="form-label">결제 금액 (USDT)</label>
                        <input type="number" id="paymentAmount" class="form-input" step="0.01" placeholder="금액 입력 또는 패키지 선택" style="font-size: 18px; font-weight: 600; text-align: center;">
                        <p style="color: rgba(255, 255, 255, 0.6); font-size: 12px; margin-top: 8px;">
                            패키지 선택 시 자동 입력, 수동 입력도 가능
                        </p>
                    </div>

                    <div class="form-group">
                        <label class="form-label" data-lang="purchase.transactionId">트랜잭션 TXID</label>
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <input type="text" id="transactionId" class="form-input" data-lang-placeholder="purchase.transactionPlaceholder" placeholder="USDT 트랜잭션 해시 입력 (또는 'demo' 입력)" style="flex: 1; margin: 0;">
                            <button type="button" onclick="verifyTxid()" style="padding: 12px 20px; background: #00ffff; color: #000; border: none; border-radius: 10px; cursor: pointer; font-weight: 600; white-space: nowrap;">검증</button>
                        </div>
                        <div id="txidResult" style="display: none; margin-top: 15px; padding: 15px; border-radius: 10px;"></div>
                    </div>

                    <!-- 메모 -->
                    <div class="form-group">
                        <label class="form-label" data-lang="purchase.note">메모 (선택사항)</label>
                        <input type="text" id="note" class="form-input" data-lang-placeholder="purchase.notePlaceholder" placeholder="추가 메모">
                    </div>

                    <!-- 구매 요약 (주석처리)
                    <div class="purchase-summary">
                        <div class="summary-item">
                            <span data-lang="purchase.selectedPackage">선택한 패키지:</span>
                            <span id="selectedPackageName" data-lang="purchase.notSelected">선택 안 함</span>
                        </div>
                        <div class="summary-item">
                            <span data-lang="purchase.quantity">수량:</span>
                            <span data-lang="purchase.quantityValue">1개</span>
                        </div>
                        <div class="summary-total">
                            <span data-lang="purchase.totalAmount">총 금액:</span>
                            <span id="totalAmount">$0 USDT</span>
                        </div>
                    </div>
                    -->

                    <!-- 구매 버튼 -->
                    <button id="purchaseButton" class="purchase-button" disabled>
                        <span class="button-text" data-lang="purchase.selectPackagePrompt">패키지를 선택해주세요</span>
                    </button>
                </div>
            </div>
        </section>
    </div>

    <script>
        // 신경망 노드 생성
        function createNeuralNodes() {
            const container = document.getElementById('neuralConnections');
            const nodeCount = 20;

            for (let i = 0; i < nodeCount; i++) {
                const node = document.createElement('div');
                node.className = 'pulse-node';
                node.style.left = Math.random() * 100 + '%';
                node.style.top = Math.random() * 100 + '%';
                node.style.animationDelay = Math.random() * 2 + 's';
                container.appendChild(node);
            }
        }

        // 전역 변수
        let selectedPackage = null;
        let selectedPrice = 0;
        let isTxidVerified = false;
        let verifiedTxid = null;

        // 번역 헬퍼 함수
        function getLangText(section, key) {
            if (window.langManager && window.langManager.translate) {
                return window.langManager.translate(section, key);
            }
            return '';
        }

        // 구매 버튼 상태 업데이트
        function updatePurchaseButton() {
            const button = document.getElementById('purchaseButton');
            const buttonText = button.querySelector('.button-text');

            if (selectedPackage && isTxidVerified) {
                button.disabled = false;
                buttonText.textContent = '구매하기';
            } else if (!selectedPackage) {
                button.disabled = true;
                buttonText.textContent = '패키지를 선택해주세요';
            } else if (!isTxidVerified) {
                button.disabled = true;
                buttonText.textContent = 'TXID 검증이 필요합니다';
            } else {
                button.disabled = true;
                buttonText.textContent = '패키지를 선택해주세요';
            }
        }

        // 입금 주소 복사 기능
        function copyDepositAddress() {
            const address = document.getElementById('depositAddress').value;
            navigator.clipboard.writeText(address).then(() => {
                // 복사 버튼 텍스트 임시 변경
                const button = event.target;
                const originalText = button.textContent;
                button.textContent = getLangText('purchase', 'addressCopied');
                button.style.background = '#00ff00';

                setTimeout(() => {
                    button.textContent = originalText;
                    button.style.background = '#00ffff';
                }, 2000);
            }).catch(err => {
                console.error('복사 실패:', err);
                alert(getLangText('purchase', 'copyFailed'));
            });
        }

        // 패키지 선택
        document.querySelectorAll('.package-card').forEach(card => {
            card.addEventListener('click', function() {
                // 모든 카드에서 selected 제거
                document.querySelectorAll('.package-card').forEach(c => c.classList.remove('selected'));

                // 현재 카드 선택
                this.classList.add('selected');

                selectedPackage = this.dataset.package;
                selectedPrice = parseFloat(this.dataset.price);

                // UI 업데이트
                const packageName = this.querySelector('.package-name').textContent;
                // document.getElementById('selectedPackageName').textContent = packageName;
                // document.getElementById('totalAmount').textContent = `$${selectedPrice} USDT`;

                // 결제 금액 입력란 업데이트
                document.getElementById('paymentAmount').value = selectedPrice;

                // 버튼 상태 업데이트
                updatePurchaseButton();
            });
        });

        // 구매 버튼 클릭
        document.getElementById('purchaseButton').addEventListener('click', async function() {
            if (!selectedPackage) {
                showMessage('패키지를 선택해주세요', 'error');
                return;
            }

            if (!isTxidVerified) {
                showMessage('TXID 검증이 필요합니다', 'error');
                return;
            }

            // 세션 토큰 가져오기 (일반 사용자 또는 관리자)
            let sessionToken = localStorage.getItem('neural_token');
            if (!sessionToken) {
                sessionToken = localStorage.getItem('admin_token');
            }

            if (!sessionToken) {
                showMessage('로그인이 필요합니다', 'error');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1500);
                return;
            }

            // URL 파라미터에서 user_id 읽기
            const urlParams = new URLSearchParams(window.location.search);
            let targetUserId = urlParams.get('user_id'); // 구매자의 로그인 ID (예: cryptotsar)

            // user_id가 없으면 본인 구매 (target_user_id를 null로 전송하여 API에서 세션 사용자로 처리)
            // user_id가 있으면 타인 구매 (관리자가 회원 대신 구매)

            const transactionId = verifiedTxid; // 검증된 TXID 사용
            const note = document.getElementById('note').value;

            // 버튼 비활성화
            this.disabled = true;
            this.querySelector('.button-text').textContent = getLangText('purchase', 'processing');

            try {
                // 요청 데이터 구성
                const requestData = {
                    session_token: sessionToken,
                    product_code: selectedPackage,
                    quantity: 1,
                    payment_method: 'usdt',
                    transaction_id: transactionId,
                    note: note
                };

                // target_user_id가 있으면 추가 (타인 구매)
                if (targetUserId) {
                    requestData.target_user_id = targetUserId;
                }

                const response = await fetch('api/sales/purchase.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestData)
                });

                const result = await response.json();

                if (result.success) {
                    // 성공 메시지 표시
                    const buyerName = targetUserId || '본인';
                    const successMsg = targetUserId
                        ? '✅ "' + targetUserId + '" 회원의 패키지 구매가 완료되었습니다!'
                        : '✅ 패키지 구매가 완료되었습니다!';
                    showMessage(successMsg, 'success');

                    // 즉시 Alert 표시
                    alert(successMsg);

                    // 새 탭에서 열렸는지 확인
                    const isNewTab = window.opener !== null;

                    setTimeout(() => {
                        if (isNewTab) {
                            // 새 탭에서 열림: 조직도 새로고침 후 탭 닫기
                            if (window.opener && !window.opener.closed) {
                                window.opener.location.reload();
                            }
                            window.close();

                            // window.close()가 실패할 경우 (브라우저 제한)
                            setTimeout(() => {
                                if (!window.closed) {
                                    alert('탭을 수동으로 닫아주세요.');
                                }
                            }, 500);
                        } else {
                            // 일반 모드: 대시보드로 이동
                            window.location.href = 'dashboard.html';
                        }
                    }, 3000);
                } else {
                    showMessage(result.message || getLangText('purchase', 'purchaseError'), 'error');
                    this.disabled = false;
                    this.querySelector('.button-text').textContent = getLangText('purchase', 'purchaseButton');
                }
            } catch (error) {
                console.error('Purchase error:', error);
                showMessage(getLangText('purchase', 'networkError'), 'error');
                this.disabled = false;
                this.querySelector('.button-text').textContent = getLangText('purchase', 'purchaseButton');
            }
        });

        // TXID 검증
        async function verifyTxid() {
            const txid = document.getElementById('transactionId').value.trim();
            const resultDiv = document.getElementById('txidResult');
            const button = event.target;

            if (!txid) {
                resultDiv.style.display = 'block';
                resultDiv.style.background = 'rgba(255, 0, 0, 0.1)';
                resultDiv.style.border = '1px solid #ff4444';
                resultDiv.style.color = '#ff4444';
                resultDiv.innerHTML = '❌ TXID를 입력하세요';
                return;
            }

            // 결제 금액 입력란에서 가져오기
            const amountInput = document.getElementById('paymentAmount');
            const amount = parseFloat(amountInput.value);

            if (!amount || amount <= 0) {
                resultDiv.style.display = 'block';
                resultDiv.style.background = 'rgba(255, 0, 0, 0.1)';
                resultDiv.style.border = '1px solid #ff4444';
                resultDiv.style.color = '#ff4444';
                resultDiv.innerHTML = '❌ 패키지를 선택하거나 금액을 입력하세요';
                return;
            }

            // 버튼 비활성화
            button.disabled = true;
            button.textContent = '검증 중...';

            try {
                const response = await fetch('api/payment/auto-verify.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        sale_id: 0,
                        txid: txid,
                        expected_amount: amount
                    })
                });

                const data = await response.json();

                resultDiv.style.display = 'block';

                if (data.success) {
                    // TXID 검증 성공 - 전역 변수 설정
                    isTxidVerified = true;
                    verifiedTxid = data.data.txid;

                    // 구매 버튼 활성화
                    updatePurchaseButton();

                    resultDiv.style.background = 'rgba(0, 255, 0, 0.1)';
                    resultDiv.style.border = '2px solid #00ff00';
                    resultDiv.style.color = '#fff';
                    resultDiv.innerHTML = `
                        <div style="font-size: 18px; font-weight: 600; color: #00ff00; margin-bottom: 10px;">
                            ✅ 검증 성공!
                        </div>
                        <div style="font-size: 14px; line-height: 1.8;">
                            <p><strong style="color: #00ffff;">TXID:</strong> ${data.data.txid}</p>
                            <p><strong style="color: #00ffff;">금액:</strong> $${data.data.amount} USDT</p>
                            <p><strong style="color: #00ffff;">상태:</strong> 승인됨</p>
                            <p style="margin-top: 10px;">
                                <a href="${data.data.tronscan_url}" target="_blank" style="color: #00ffff; text-decoration: none;">
                                    🔗 Tronscan에서 확인
                                </a>
                            </p>
                        </div>
                    `;
                } else {
                    // 검증 실패 - 초기화
                    isTxidVerified = false;
                    verifiedTxid = null;
                    updatePurchaseButton();
                    resultDiv.style.background = 'rgba(255, 0, 0, 0.1)';
                    resultDiv.style.border = '2px solid #ff4444';
                    resultDiv.style.color = '#ff4444';
                    resultDiv.innerHTML = `
                        <div style="font-size: 18px; font-weight: 600; margin-bottom: 10px;">
                            ❌ 검증 실패
                        </div>
                        <div style="font-size: 14px;">
                            ${data.message}
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.style.display = 'block';
                resultDiv.style.background = 'rgba(255, 0, 0, 0.1)';
                resultDiv.style.border = '1px solid #ff4444';
                resultDiv.style.color = '#ff4444';
                resultDiv.innerHTML = `❌ 오류: ${error.message}`;
            } finally {
                button.disabled = false;
                button.textContent = '검증';
            }
        }

        // 메시지 표시
        function showMessage(text, type) {
            const messageEl = document.getElementById('message');
            messageEl.textContent = text;
            messageEl.className = `message ${type}`;
            messageEl.style.display = 'block';

            setTimeout(() => {
                messageEl.style.display = 'none';
            }, 5000);
        }

        // TXID 입력 시 자동 포맷팅 (demo/test 허용)
        document.getElementById('transactionId').addEventListener('input', (e) => {
            const value = e.target.value.toLowerCase();

            // demo 또는 test는 허용
            if (value === 'demo' || value === 'test' ||
                'demo'.startsWith(value) || 'test'.startsWith(value)) {
                e.target.value = value;
            } else {
                // hex 문자만 허용 (0-9, a-f)
                e.target.value = value.replace(/[^a-f0-9]/g, '');
            }
        });

        // 초기화
        window.addEventListener('DOMContentLoaded', () => {
            createNeuralNodes();

            // URL 파라미터에서 memo 읽어서 메모란에 자동 입력
            const urlParams = new URLSearchParams(window.location.search);
            const memo = urlParams.get('memo');
            if (memo) {
                const noteInput = document.getElementById('note');
                if (noteInput) {
                    noteInput.value = memo;
                }
            }
        });
    </script>

    <!-- 팝업 메뉴 -->
    <script src="popup-menu.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const homeButton = document.getElementById('homeButton');
            if (homeButton && typeof NeuralPopupMenu !== 'undefined') {
                NeuralPopupMenu.init(homeButton);
            }
        });

    </script>
    <script src="api-client.js"></script>
</body>
</html>
