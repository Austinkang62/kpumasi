<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard - AI BTC BOT</title>
    <script src="js/language.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #000;
            color: #fff;
            overflow-x: hidden;
            position: relative;
        }

        /* 신경망 배경 애니메이션 */
        .neural-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: radial-gradient(ellipse at center, #0a0a1f 0%, #000000 100%);
        }

        .neural-grid {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(0, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridPulse 4s ease-in-out infinite;
        }

        @keyframes gridPulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }

        /* 펄스 노드들 */
        .pulse-node {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #00ffff;
            box-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff;
            animation: nodePulse 2s ease-in-out infinite;
        }

        @keyframes nodePulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(2);
                opacity: 0.5;
            }
        }

        /* 신경망 연결선 */
        .neural-connections {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .connection-line {
            position: absolute;
            height: 1px;
            background: linear-gradient(90deg, transparent, #00ffff, transparent);
            animation: lineFlow 3s linear infinite;
            opacity: 0.3;
        }

        @keyframes lineFlow {
            0% { transform: scaleX(0); opacity: 0; }
            50% { opacity: 0.5; }
            100% { transform: scaleX(1); opacity: 0; }
        }

        /* 컨테이너 */
        .container {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            padding: 0;
            display: flex;
            flex-direction: column;
        }

        /* 헤더 - 플로팅 네비게이션 */
        .floating-nav {
            position: fixed;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        /* 페이지 타이틀 */
        .page-header-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            pointer-events: none;
            text-align: center;
        }

        .page-title-main {
            display: block;
            font-size: 36px;
            font-weight: 300;
            letter-spacing: 8px;
            background: linear-gradient(45deg, #00ffff, #ff00ff, #ffff00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: titleGlow 3s ease-in-out infinite;
            position: relative;
        }

        .page-title-main::after {
            content: attr(data-text);
            position: absolute;
            left: 2px;
            top: 2px;
            background: linear-gradient(45deg, #00ffff, #ff00ff, #ffff00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0.5;
            mix-blend-mode: screen;
            animation: glitch 3s infinite;
            z-index: -1;
        }

        @keyframes titleGlow {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }

        @keyframes glitch {
            0%, 100% { transform: translate(0); }
            20% { transform: translate(-1px, 1px); }
            40% { transform: translate(1px, -1px); }
            60% { transform: translate(-1px, -1px); }
            80% { transform: translate(1px, 1px); }
        }

        /* 백 버튼 */
        .back-button {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            color: #00ffff;
            animation: floatButton 3s ease-in-out infinite;
        }

        .back-button:hover {
            background: rgba(0, 255, 255, 0.2);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
            transform: translateY(-2px) scale(1.05);
            border-color: #00ffff;
        }

        @keyframes floatButton {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }


        /* 홈 버튼 */
        .home-button {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            color: #00ffff;
            position: relative;
            animation: floatButton 3s ease-in-out infinite 0.5s;
        }

        .home-button:hover {
            background: rgba(0, 255, 255, 0.2);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
            transform: translateY(-2px) scale(1.05);
            border-color: #00ffff;
        }

        .home-button:active {
            transform: translateY(0) scale(0.98);
        }

        /* 미니 펄스 로고 */
        .mini-pulse {
            position: relative;
            width: 30px;
            height: 30px;
        }

        .mini-ring {
            position: absolute;
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 50%;
            animation: miniRingRotate 3s linear infinite;
        }

        .mini-ring:nth-child(1) {
            width: 100%;
            height: 100%;
            border-top-color: #00ffff;
            animation-duration: 2s;
        }

        .mini-ring:nth-child(2) {
            width: 70%;
            height: 70%;
            top: 15%;
            left: 15%;
            border-right-color: #ff00ff;
            animation-duration: 3s;
            animation-direction: reverse;
        }

        .mini-core {
            position: absolute;
            width: 10px;
            height: 10px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, #00ffff 0%, transparent 70%);
            border-radius: 50%;
            animation: miniCorePulse 1.5s ease-in-out infinite;
        }

        @keyframes miniRingRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes miniCorePulse {
            0%, 100% {
                box-shadow: 0 0 10px #00ffff;
            }
            50% {
                box-shadow: 0 0 20px #00ffff, 0 0 30px #00ffff;
            }
        }

        

        /* 메뉴 타이틀 */
        

        

        

        /* 서브메뉴 */
        

        

        

        

        /* 콘텐츠 영역 */
        .content-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 100px 20px 100px;
            min-height: 100vh;
        }

        .content {
            max-width: 1200px;
            width: 100%;
        }

        .content-title {
            font-size: 48px;
            font-weight: 300;
            letter-spacing: 8px;
            margin-bottom: 40px;
            background: linear-gradient(45deg, #00ffff, #ff00ff, #ffff00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            animation: titleGlow 3s ease-in-out infinite;
        }

        /* 대시보드 그리드 */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .dashboard-card {
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.05), rgba(255, 0, 255, 0.05));
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 30px;
            padding: 30px;
            transition: all 0.4s;
            position: relative;
            overflow: hidden;
        }

        .dashboard-card:hover {
            border-color: rgba(0, 255, 255, 0.5);
            box-shadow: 0 20px 60px rgba(0, 255, 255, 0.2);
            transform: translateY(-5px);
        }

        .card-icon {
            width: 60px;
            height: 60px;
            border-radius: 15px;
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.2), rgba(255, 0, 255, 0.2));
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            font-size: 28px;
        }

        .card-value {
            font-size: 36px;
            font-weight: 700;
            background: linear-gradient(45deg, #00ffff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .card-label {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .card-change {
            font-size: 12px;
            padding: 5px 12px;
            border-radius: 20px;
            display: inline-block;
        }

        .card-change.positive {
            background: rgba(0, 255, 0, 0.1);
            color: #00ff00;
        }

        .card-change.negative {
            background: rgba(255, 0, 0, 0.1);
            color: #ff0000;
        }

        /* 하단 영역 */
        .footer-section {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px;
            background: linear-gradient(180deg, transparent, rgba(0, 10, 31, 0.9));
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(0, 255, 255, 0.1);
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .footer-content {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .pulse-indicator {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #00ffff;
            box-shadow: 0 0 10px #00ffff;
            animation: pulseIndicator 2s ease-in-out infinite;
        }

        @keyframes pulseIndicator {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.5);
                opacity: 0.5;
            }
        }

        .footer-text {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 2px;
            font-weight: 300;
        }

        /* 반응형 */
        @media (max-width: 768px) {
            .content-title {
                font-size: 32px;
                letter-spacing: 4px;
            }

            .page-title-main {
                font-size: 28px;
                letter-spacing: 6px;
            }

            .dashboard-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .dashboard-card {
                padding: 25px;
            }
        }

        @media (max-width: 480px) {
            .page-title-main {
                font-size: 22px;
                letter-spacing: 4px;
            }
        }
    </style>
</head>
<body>
    <!-- 신경망 배경 -->
    <div class="neural-background">
        <div class="neural-grid"></div>
    </div>

    <!-- 펄스 노드들 -->
    <div class="neural-connections" id="neuralConnections"></div>

    <!-- 플로팅 네비게이션 -->
    <nav class="floating-nav">
        <!-- 백 버튼 -->
        <a href="javascript:history.back()" class="back-button">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
        </a>

        <!-- 페이지 타이틀 (중앙) -->
        <div class="page-header-title">
            <span class="page-title-main" data-text="DASHBOARD">DASHBOARD</span>
        </div>

        <!-- 우측 버튼 그룹 -->
        <div style="display: flex; align-items: center;">
            <!-- 홈 버튼 (미니 펄스 로고) -->
            <div class="home-button" id="homeButton">
                <div class="mini-pulse">
                    <div class="mini-ring"></div>
                    <div class="mini-ring"></div>
                    <div class="mini-core"></div>
                </div>
            </div>
        </div>
    </nav>

    <!-- 네비게이션 팝업 메뉴 (popup-menu.js에서 동적으로 로드됨) -->

    <!-- 메인 컨테이너 -->
    <div class="container">
        <!-- 콘텐츠 섹션 -->
        <section class="content-section">
            <div class="content">
                <h1 class="content-title" data-lang="dashboard.title">Real-time Analytics</h1>

                <div class="dashboard-grid">
                    <div class="dashboard-card">
                        <div class="card-icon">📦</div>
                        <div class="card-value" id="myPackageValue">-</div>
                        <div class="card-label"><span data-lang="dashboard.myPackage">내 패키지</span> (<span id="userIdValue">-</span>)</div>
                        <span class="card-change" id="myPackageChange"></span>
                    </div>

                    <div class="dashboard-card">
                        <div class="card-icon">👥</div>
                        <div class="card-value" id="directReferralsValue">0</div>
                        <div class="card-label" data-lang="dashboard.referrals">추천수</div>
                        <span class="card-change" id="directReferralsChange"></span>
                    </div>

                    <div class="dashboard-card">
                        <div class="card-icon">💵</div>
                        <div class="card-value" id="directSalesValue">$0</div>
                        <div class="card-label" data-lang="dashboard.directSales">직추천 매출</div>
                        <span class="card-change" id="directSalesChange"></span>
                    </div>

                    <div class="dashboard-card">
                        <div class="card-icon">💰</div>
                        <div class="card-value" id="myTotalValue">$0</div>
                        <div class="card-label" data-lang="dashboard.allowanceTotal">수당합계</div>
                        <span class="card-change" id="myTotalChange"></span>
                    </div>

                    <div class="dashboard-card">
                        <div class="card-icon">🌐</div>
                        <div class="card-value" id="teamMembersValue">0</div>
                        <div class="card-label" data-lang="dashboard.teamMembers">팀원수</div>
                        <span class="card-change" id="teamMembersChange"></span>
                    </div>

                    <div class="dashboard-card">
                        <div class="card-icon">📊</div>
                        <div class="card-value" id="teamSalesValue">$0</div>
                        <div class="card-label" data-lang="dashboard.teamSales">팀원 매출합</div>
                        <span class="card-change" id="teamSalesChange"></span>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <!-- 하단 영역 -->
    <footer class="footer-section">
        <div class="footer-content">
            <div class="pulse-indicator"></div>
            <span class="footer-text">NEURAL PULSE NETWORK</span>
        </div>
    </footer>

    <script>
        // 신경망 노드 생성
        function createNeuralNodes() {
            const container = document.getElementById('neuralConnections');
            const nodeCount = 20;

            for (let i = 0; i < nodeCount; i++) {
                const node = document.createElement('div');
                node.className = 'pulse-node';
                node.style.left = Math.random() * 100 + '%';
                node.style.top = Math.random() * 100 + '%';
                node.style.animationDelay = Math.random() * 2 + 's';
                container.appendChild(node);

                // 연결선 생성
                if (i % 3 === 0) {
                    const line = document.createElement('div');
                    line.className = 'connection-line';
                    line.style.left = Math.random() * 100 + '%';
                    line.style.top = Math.random() * 100 + '%';
                    line.style.width = Math.random() * 200 + 100 + 'px';
                    line.style.transform = `rotate(${Math.random() * 360}deg)`;
                    line.style.animationDelay = Math.random() * 3 + 's';
                    container.appendChild(line);
                }
            }
        }

        // 초기화
        window.addEventListener('DOMContentLoaded', () => {
            createNeuralNodes();
            // setupNavigation();  // popup-menu.js로 대체
        });
    </script>

    <!-- 팝업 메뉴 -->
    <script src="popup-menu.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const homeButton = document.getElementById('homeButton');
            if (homeButton && typeof NeuralPopupMenu !== 'undefined') {
                NeuralPopupMenu.init(homeButton);
            }

            // 대시보드 통계 로드
            loadDashboardStats();
        });

        // 전역 변수로 패키지명 저장
        let currentPackageName = null;

        async function loadDashboardStats() {
            try {
                // 세션 토큰 가져오기
                const sessionToken = localStorage.getItem('neural_token');

                if (!sessionToken) {
                    console.error('세션 토큰이 없습니다.');
                    return;
                }

                // API 호출
                const response = await fetch(`api/dashboard/get-stats.php?session_token=${sessionToken}`);
                const result = await response.json();

                if (result.success) {
                    const data = result.data;

                    // 사용자 ID 표시
                    document.getElementById('userIdValue').textContent = data.user_id || '-';

                    // 1. 내 패키지
                    const packageValue = document.getElementById('myPackageValue');
                    const packageChange = document.getElementById('myPackageChange');
                    if (data.packages && data.packages.length > 0) {
                        // 가장 최근 패키지 표시 (번역 처리)
                        const productName = data.packages[0].product_name;
                        currentPackageName = productName;  // 전역 변수에 저장
                        packageValue.textContent = translatePackageName(productName);
                        if (data.package_count > 1) {
                            packageChange.textContent = `+${data.package_count - 1} more`;
                            packageChange.className = 'card-change positive';
                        }
                    } else {
                        currentPackageName = null;  // 전역 변수에 저장
                        packageValue.textContent = translatePackageName(null);
                    }

                    // 2. 직추천수
                    document.getElementById('directReferralsValue').textContent = data.direct_referrals_count.toLocaleString();

                    // 3. 팀원수
                    document.getElementById('teamMembersValue').textContent = data.team_members_count.toLocaleString();

                    // 4. 직추천 매출합
                    document.getElementById('directSalesValue').textContent = '$' + data.direct_sales_total.toLocaleString('en-US', {
                        minimumFractionDigits: 0,
                        maximumFractionDigits: 0
                    });

                    // 5. 팀원 매출합
                    document.getElementById('teamSalesValue').textContent = '$' + data.team_sales_total.toLocaleString('en-US', {
                        minimumFractionDigits: 0,
                        maximumFractionDigits: 0
                    });

                    // 6. 수당합계 (0으로 고정)
                    document.getElementById('myTotalValue').textContent = '$0';

                } else {
                    console.error('통계 조회 실패:', result.message);
                }

            } catch (error) {
                console.error('대시보드 통계 로드 오류:', error);
            }
        }

        // 패키지 이름 번역 함수
        function translatePackageName(productName) {
            if (!productName) {
                // 패키지 없음
                return window.langManager ? window.langManager.get('dashboard', 'noPackage') : '없음';
            }

            // 숫자 추출 (50, 100 등)
            const match = productName.match(/(\d+)/);
            if (match) {
                const amount = match[1];
                const key = `package${amount}`;

                // 번역 키가 있으면 번역된 텍스트 반환
                if (window.langManager) {
                    return window.langManager.get('dashboard', key);
                }
            }

            // 번역 실패 시 원본 반환
            return productName;
        }

        // 언어 변경 이벤트 리스너
        document.addEventListener('languageChanged', () => {
            // 패키지명 재번역
            const packageValue = document.getElementById('myPackageValue');
            if (packageValue && currentPackageName !== undefined) {
                packageValue.textContent = translatePackageName(currentPackageName);
            }
        });
    </script>
    <script src="api-client.js"></script>
</body>
</html>
