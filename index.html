<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>K-Pumasi - Premium Network Platform</title>
    <link rel="stylesheet" href="css/k-pumasi-modern.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* 페이지 특화 스타일 */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            position: relative;
            z-index: 1;
        }

        .hero-section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 80px 24px;
            position: relative;
        }

        .hero-content {
            max-width: 900px;
        }

        .hero-badge {
            display: inline-block;
            padding: 10px 28px;
            background: rgba(212, 175, 55, 0.1);
            border: 1.5px solid var(--we1-gold);
            border-radius: 100px;
            color: var(--we1-gold);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 2px;
            margin-bottom: 30px;
            font-family: 'Inter', sans-serif;
            text-transform: uppercase;
        }

        .hero-title {
            font-size: 84px;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 30px;
            background: var(--we1-gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: goldShine 3s ease-in-out infinite;
            font-family: 'Playfair Display', serif;
        }

        @keyframes goldShine {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.2); }
        }

        .hero-subtitle {
            font-size: 22px;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 50px;
            line-height: 1.8;
            font-family: 'Inter', sans-serif;
            font-weight: 300;
        }

        .hero-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 50px;
        }

        /* 버튼 컴팩트 스타일 */
        .btn-compact {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 12px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-compact::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.6s ease;
        }

        .btn-compact:hover::before {
            left: 100%;
        }

        .btn-compact:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.4);
        }

        .btn-icon {
            font-size: 18px;
            display: inline-flex;
            align-items: center;
        }

        .btn-text {
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.3px;
        }

        .btn-arrow {
            font-size: 18px;
            transition: transform 0.3s ease;
        }

        .btn-compact:hover .btn-arrow {
            transform: translateX(5px);
        }

        /* 버튼 대형 스타일 (CTA용) */
        .btn-large {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 18px 36px;
            font-size: 17px;
            font-weight: 600;
            border-radius: 16px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-large::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.6s ease;
        }

        .btn-large:hover::before {
            left: 100%;
        }

        .btn-large:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(212, 175, 55, 0.5);
        }

        .btn-large .btn-icon {
            font-size: 22px;
        }

        .btn-large .btn-arrow {
            font-size: 20px;
        }

        .btn-large:hover .btn-arrow {
            transform: translateX(5px);
        }

        /* 버튼 색상 변형 */
        .btn-navy {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: var(--we1-gold);
            border: 2px solid rgba(212, 175, 55, 0.4);
        }

        .btn-navy:hover {
            border-color: var(--we1-gold);
            box-shadow: 0 12px 40px rgba(212, 175, 55, 0.4);
        }

        /* 섹션 */
        .section {
            padding: 120px 0;
            position: relative;
        }

        .section-title {
            font-size: 54px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 20px;
            color: var(--we1-white);
            font-family: 'Playfair Display', serif;
        }

        .section-subtitle {
            font-size: 19px;
            color: rgba(255, 255, 255, 0.7);
            text-align: center;
            max-width: 700px;
            margin: 0 auto 80px;
            line-height: 1.8;
            font-family: 'Inter', sans-serif;
            font-weight: 300;
        }

        /* 통계 그리드 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            margin-top: 80px;
        }

        .stat-number {
            font-size: 64px;
            font-weight: 800;
            background: var(--we1-gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 16px;
            font-family: 'Playfair Display', serif;
        }

        .stat-label {
            font-size: 17px;
            color: var(--we1-text-secondary);
            font-weight: 500;
            font-family: 'Inter', sans-serif;
        }

        /* 기능 그리드 */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 40px;
            margin-top: 80px;
        }

        .feature-icon {
            width: 70px;
            height: 70px;
            background: var(--we1-gradient-subtle);
            border: 2px solid rgba(212, 175, 55, 0.3);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin-bottom: 28px;
        }

        .feature-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--we1-text-primary);
            margin-bottom: 14px;
            font-family: 'Playfair Display', serif;
        }

        .feature-desc {
            font-size: 16px;
            color: var(--we1-text-secondary);
            line-height: 1.8;
            margin-bottom: 24px;
            font-family: 'Inter', sans-serif;
        }

        .feature-list {
            list-style: none;
            padding: 0;
        }

        .feature-list li {
            padding: 10px 0;
            padding-left: 30px;
            position: relative;
            color: var(--we1-text-secondary);
            font-size: 15px;
            font-family: 'Inter', sans-serif;
        }

        .feature-list li::before {
            content: '✓';
            position: absolute;
            left: 0;
            color: var(--we1-gold);
            font-weight: bold;
            font-size: 18px;
        }

        /* CTA 섹션 */
        .cta-section {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 100px 80px;
            text-align: center;
            border: 2px solid rgba(212, 175, 55, 0.3);
            box-shadow: var(--we1-shadow-gold);
            position: relative;
            overflow: hidden;
        }

        .cta-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--we1-gradient-primary);
        }

        .cta-title {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 24px;
            color: var(--we1-white);
            font-family: 'Playfair Display', serif;
        }

        .cta-subtitle {
            font-size: 20px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 50px;
            font-family: 'Inter', sans-serif;
            font-weight: 300;
            line-height: 1.8;
        }

        .cta-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* 푸터 */
        .footer {
            padding: 80px 0 50px;
            text-align: center;
            border-top: 1px solid rgba(212, 175, 55, 0.2);
        }

        .footer-text {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            margin-top: 12px;
            font-family: 'Inter', sans-serif;
        }

        .footer-brand {
            color: var(--we1-white);
            font-size: 18px;
            font-weight: 600;
            margin-top: 24px;
            font-family: 'Playfair Display', serif;
        }

        /* 스크롤 인디케이터 */
        .scroll-indicator {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            animation: bounce 2.5s ease-in-out infinite;
        }

        .scroll-indicator svg {
            width: 36px;
            height: 36px;
            stroke: var(--we1-gold);
            stroke-width: 2.5;
            opacity: 0.7;
        }

        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-20px); }
        }

        /* 골드 라인 데코레이션 */
        .gold-line {
            width: 80px;
            height: 3px;
            background: var(--we1-gradient-primary);
            margin: 0 auto 30px;
            border-radius: 10px;
        }

        /* 반응형 */
        @media (max-width: 768px) {
            .hero-title {
                font-size: 52px;
            }

            .hero-subtitle {
                font-size: 18px;
            }

            .section-title {
                font-size: 38px;
            }

            .section-subtitle {
                font-size: 16px;
            }

            .cta-section {
                padding: 70px 40px;
            }

            .cta-title {
                font-size: 34px;
            }

            .features-grid {
                grid-template-columns: 1fr;
            }

            .hero-buttons {
                gap: 12px;
            }

            .btn-compact {
                padding: 10px 20px;
                font-size: 14px;
            }

            .btn-large {
                width: 100%;
                justify-content: center;
                padding: 16px 28px;
                font-size: 16px;
            }

            .cta-buttons {
                flex-direction: column;
                gap: 15px;
                width: 100%;
                max-width: 400px;
                margin: 0 auto;
            }
        }

        /* 배경 장식 요소 */
        .decoration-line {
            position: absolute;
            width: 1px;
            height: 100px;
            background: linear-gradient(to bottom, transparent, var(--we1-gold), transparent);
            opacity: 0.2;
        }

        .decoration-line-1 {
            top: 20%;
            left: 15%;
            animation: decorationFloat 8s ease-in-out infinite;
        }

        .decoration-line-2 {
            top: 60%;
            right: 20%;
            animation: decorationFloat 10s ease-in-out infinite;
            animation-delay: 2s;
        }

        @keyframes decorationFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-30px); }
        }
    </style>
</head>
<body>
    <!-- 배경 -->
    <div class="kpumasi-background">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div id="particles"></div>
    </div>

    <!-- 히어로 섹션 -->
    <section class="hero-section">
        <div class="decoration-line decoration-line-1"></div>
        <div class="decoration-line decoration-line-2"></div>

        <div class="hero-content fade-in-up">
            <div class="kpumasi-logo floating">
                <div class="logo-circle logo-circle-1"></div>
                <div class="logo-circle logo-circle-2"></div>
                <div class="logo-center">W1</div>
            </div>

            <div class="hero-badge">Premium Network Platform</div>

            <h1 class="hero-title">K-Pumasi</h1>
            <div class="gold-line"></div>
            <p class="hero-subtitle">
                We are One, 진정한 프리미엄 네트워크<br>
                함께 성장하고, 하나로 연결되는 특별한 커뮤니티
            </p>

            <div class="hero-buttons">
                <a href="signup/" class="btn-kpumasi btn-primary btn-compact">
                    <span class="btn-icon">🚀</span>
                    <span class="btn-text">시작</span>
                </a>
                <a href="html/login.html" class="btn-kpumasi btn-secondary btn-compact">
                    <span class="btn-icon">🔑</span>
                    <span class="btn-text">로그인</span>
                </a>
            </div>
        </div>

        <div class="scroll-indicator">
            <svg viewBox="0 0 24 24" fill="none">
                <path d="M12 5v14M19 12l-7 7-7-7"/>
            </svg>
        </div>
    </section>

    <!-- 푸터 -->
    <footer class="footer">
        <div class="container">
            <div class="kpumasi-logo" style="width: 90px; height: 90px;">
                <div class="logo-circle logo-circle-1"></div>
                <div class="logo-circle logo-circle-2"></div>
                <div class="logo-center" style="width: 45px; height: 45px; font-size: 18px;">W1</div>
            </div>
            <p class="footer-brand">
                K-Pumasi - Premium Network Platform
            </p>
            <div class="gold-line" style="margin: 25px auto;"></div>
            <p class="footer-text">
                © 2025 K-Pumasi. All Rights Reserved.
            </p>
        </div>
    </footer>

    <script>
        // 파티클 생성
        function createParticles() {
            const container = document.getElementById('particles');
            const particleCount = 40;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 20 + 's';
                particle.style.animationDuration = (15 + Math.random() * 15) + 's';
                container.appendChild(particle);
            }
        }

        // 스크롤 애니메이션
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -80px 0px'
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.opacity = '0';
                    entry.target.style.transform = 'translateY(40px)';

                    setTimeout(() => {
                        entry.target.style.transition = 'opacity 0.8s ease, transform 0.8s ease';
                        entry.target.style.opacity = '1';
                        entry.target.style.transform = 'translateY(0)';
                    }, 100);

                    observer.unobserve(entry.target);
                }
            });
        }, observerOptions);

        // 페이지 로드
        window.addEventListener('DOMContentLoaded', () => {
            createParticles();

            // 애니메이션 관찰
            document.querySelectorAll('.feature-card-modern, .stat-card-modern').forEach(el => {
                observer.observe(el);
            });
        });

        // 스크롤 인디케이터 숨기기
        window.addEventListener('scroll', () => {
            const indicator = document.querySelector('.scroll-indicator');
            if (indicator) {
                if (window.scrollY > 100) {
                    indicator.style.opacity = '0';
                    indicator.style.pointerEvents = 'none';
                } else {
                    indicator.style.opacity = '1';
                    indicator.style.pointerEvents = 'auto';
                }
            }
        });
    </script>
</body>
</html>
