<div class="dashboard-header">
    <h1>📊 Admin</h1>
    <div class="header-nav">
        <a href="/admin/index.html">Dashboard</a>
        <a href="/admin/users-manage.html">Users</a>
        <a href="/admin/pages/sales.html">Sales</a>
        <a href="/admin/pages/withdrawals.html">Withdrawals</a>
        <a href="/admin/pages/payments.html">Payments</a>
        <a href="/html/organization.html">Organization</a>
        <a href="/admin/pages/notices.html">Notices</a>
        <a href="/admin/pages/settings.html" class="settings-icon" title="Settings">⚙️</a>
        <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
</div>

<style>
    .dashboard-header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
        padding: 8px 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 2px 12px rgba(0,0,0,0.5);
        border-bottom: 1px solid rgba(148, 163, 184, 0.1);
        z-index: 1000;
        height: 50px;
    }

    .dashboard-header h1 {
        color: #f8fafc;
        font-size: 1em;
        font-weight: 700;
    }

    .header-nav {
        display: flex;
        gap: 8px;
        align-items: center;
    }

    .header-nav a {
        padding: 6px 14px;
        background: rgba(59, 130, 246, 0.1);
        color: #60a5fa;
        text-decoration: none;
        border-radius: 5px;
        font-size: 0.8em;
        font-weight: 500;
        transition: all 0.2s;
        border: 1px solid rgba(59, 130, 246, 0.2);
    }

    .header-nav a:hover {
        background: rgba(59, 130, 246, 0.2);
        color: #93c5fd;
    }

    .btn-logout {
        padding: 6px 14px;
        background: linear-gradient(135deg, #ef4444, #dc2626);
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 0.8em;
        font-weight: 600;
        transition: all 0.2s;
    }

    .btn-logout:hover {
        background: linear-gradient(135deg, #dc2626, #b91c1c);
    }

    body {
        padding-top: 50px;
    }
</style>

<script>
    async function logout() {
        await fetch('../api/auth.php?action=logout', { method: 'POST' });
        window.location.href = '/admin/index.html';
    }
</script>
