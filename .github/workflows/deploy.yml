name: Deploy to Cafe24

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install lftp
      run: sudo apt-get update && sudo apt-get install -y lftp

    - name: Deploy via LFTP
      env:
        FTP_SERVER: ${{ secrets.FTP_SERVER }}
        FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        FTP_PORT: ${{ secrets.FTP_PORT }}
        FTP_PATH: ${{ secrets.FTP_PATH }}
      run: |
        echo "Connecting to $FTP_SERVER:$FTP_PORT as $FTP_USERNAME"
        lftp -c "
        set ftp:ssl-allow no;
        set net:timeout 30;
        set net:max-retries 5;
        set ftp:passive-mode on;
        open -u $FTP_USERNAME,$FTP_PASSWORD -p $FTP_PORT $FTP_SERVER || exit 1;
        pwd;
        ls -la;
        mirror --reverse --delete --verbose --parallel=2 --exclude-glob .git/ --exclude-glob .github/ --exclude-glob node_modules/ --exclude-glob .gitignore --exclude-glob config/database.php --exclude-glob '*.log' ./ /www/;
        " || exit 1
