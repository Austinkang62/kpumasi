<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원 완전 삭제 - K-Pumasi Admin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1f35 0%, #2c3e50 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #d4af37 0%, #f4e5a1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 30px;
            font-size: 14px;
        }

        .warning-box {
            background: rgba(244, 67, 54, 0.1);
            border: 2px solid #f44336;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .warning-box h3 {
            color: #f44336;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .warning-box ul {
            margin-left: 20px;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.8;
        }

        .input-section {
            margin-bottom: 30px;
        }

        .input-section label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #d4af37;
        }

        .input-section textarea {
            width: 100%;
            min-height: 150px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            font-family: monospace;
            resize: vertical;
        }

        .input-section textarea::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .preview-section {
            margin-bottom: 30px;
        }

        .preview-section h3 {
            color: #d4af37;
            margin-bottom: 15px;
        }

        .user-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }

        .user-tag {
            background: rgba(212, 175, 55, 0.2);
            border: 1px solid #d4af37;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }

        .btn-group {
            display: flex;
            gap: 15px;
        }

        .btn {
            flex: 1;
            padding: 15px 30px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-danger {
            background: linear-gradient(135deg, #f44336, #d32f2f);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(244, 67, 54, 0.5);
        }

        .btn-danger:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .result-box {
            display: none;
            margin-top: 20px;
            padding: 20px;
            border-radius: 12px;
            border: 2px solid;
        }

        .result-box.success {
            background: rgba(76, 175, 80, 0.1);
            border-color: #4caf50;
            color: #4caf50;
        }

        .result-box.error {
            background: rgba(244, 67, 54, 0.1);
            border-color: #f44336;
            color: #f44336;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #d4af37;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #d4af37;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← 관리자 메인으로</a>

        <h1>⚠️ 회원 완전 삭제</h1>
        <p class="subtitle">데이터베이스에서 회원 데이터를 영구적으로 삭제합니다</p>

        <div class="warning-box">
            <h3>⚠️ 경고</h3>
            <ul>
                <li>이 작업은 <strong>되돌릴 수 없습니다</strong></li>
                <li>삭제되는 데이터: 회원정보, 세션, 거래내역, 보너스, 출금내역, 조직도, 아바타 등</li>
                <li>실행 전 반드시 데이터베이스 백업을 권장합니다</li>
                <li>삭제 후 관련 회원들의 보너스 체계가 영향을 받을 수 있습니다</li>
            </ul>
        </div>

        <div class="input-section">
            <label for="userIds">삭제할 회원 ID 입력 (한 줄에 하나씩)</label>
            <textarea
                id="userIds"
                placeholder="예:&#10;BYDY7570&#10;WRGP3948&#10;JNRT1315&#10;LMVK8706"
            ></textarea>
        </div>

        <div class="preview-section">
            <h3>삭제 대상 회원</h3>
            <div class="user-list" id="userList">
                <span style="color: rgba(255,255,255,0.5);">위에 회원 ID를 입력하면 여기에 표시됩니다</span>
            </div>
            <div style="color: rgba(255,255,255,0.6); font-size: 14px;">
                총 <span id="userCount">0</span>명
            </div>
        </div>

        <div class="btn-group">
            <button class="btn btn-secondary" onclick="location.href='index.html'">취소</button>
            <button class="btn btn-danger" id="deleteBtn" onclick="confirmDelete()" disabled>
                🗑️ 완전 삭제 실행
            </button>
        </div>

        <div class="loading" id="loading">
            ⏳ 삭제 중...
        </div>

        <div class="result-box" id="resultBox"></div>
    </div>

    <script>
        let userIdsArray = [];

        // 입력 감지
        document.getElementById('userIds').addEventListener('input', function(e) {
            const text = e.target.value.trim();
            userIdsArray = text.split('\n')
                .map(id => id.trim())
                .filter(id => id.length > 0);

            updatePreview();
        });

        // 미리보기 업데이트
        function updatePreview() {
            const userList = document.getElementById('userList');
            const userCount = document.getElementById('userCount');
            const deleteBtn = document.getElementById('deleteBtn');

            if (userIdsArray.length === 0) {
                userList.innerHTML = '<span style="color: rgba(255,255,255,0.5);">위에 회원 ID를 입력하면 여기에 표시됩니다</span>';
                deleteBtn.disabled = true;
            } else {
                userList.innerHTML = userIdsArray.map(id =>
                    `<div class="user-tag">${id}</div>`
                ).join('');
                deleteBtn.disabled = false;
            }

            userCount.textContent = userIdsArray.length;
        }

        // 삭제 확인
        function confirmDelete() {
            if (userIdsArray.length === 0) {
                alert('삭제할 회원 ID를 입력해주세요.');
                return;
            }

            const message = `정말로 ${userIdsArray.length}명의 회원을 완전히 삭제하시겠습니까?\n\n` +
                `삭제 대상:\n${userIdsArray.join('\n')}\n\n` +
                `⚠️ 이 작업은 되돌릴 수 없습니다!`;

            if (!confirm(message)) {
                return;
            }

            // 재확인
            const confirm2 = prompt('정말로 삭제하시려면 "DELETE"를 입력하세요:');
            if (confirm2 !== 'DELETE') {
                alert('삭제가 취소되었습니다.');
                return;
            }

            executeDelete();
        }

        // 삭제 실행
        async function executeDelete() {
            const loading = document.getElementById('loading');
            const resultBox = document.getElementById('resultBox');
            const deleteBtn = document.getElementById('deleteBtn');

            console.log('Executing delete with userIdsArray:', userIdsArray);

            loading.style.display = 'block';
            resultBox.style.display = 'none';
            deleteBtn.disabled = true;

            const requestData = {
                user_ids: userIdsArray
            };

            console.log('Request data:', requestData);
            console.log('Request JSON:', JSON.stringify(requestData));

            try {
                const response = await fetch('delete-user-complete.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestData)
                });

                console.log('Response status:', response.status);
                const responseText = await response.text();
                console.log('Response text:', responseText);

                const result = JSON.parse(responseText);

                loading.style.display = 'none';
                resultBox.style.display = 'block';

                if (result.success) {
                    resultBox.className = 'result-box success';
                    resultBox.innerHTML = `
                        <h3>✅ 삭제 완료</h3>
                        <p>${result.message}</p>
                        <p style="margin-top: 10px;">삭제된 회원: ${result.user_ids.join(', ')}</p>
                    `;

                    // 입력 필드 초기화
                    document.getElementById('userIds').value = '';
                    userIdsArray = [];
                    updatePreview();
                } else {
                    resultBox.className = 'result-box error';
                    resultBox.innerHTML = `
                        <h3>❌ 삭제 실패</h3>
                        <p>${result.message}</p>
                        ${result.error_detail ? `<pre style="margin-top: 10px; font-size: 12px; overflow: auto;">${result.error_detail}</pre>` : ''}
                    `;
                    deleteBtn.disabled = false;
                }
            } catch (error) {
                loading.style.display = 'none';
                resultBox.style.display = 'block';
                resultBox.className = 'result-box error';
                resultBox.innerHTML = `
                    <h3>❌ 오류 발생</h3>
                    <p>서버 연결 오류: ${error.message}</p>
                `;
                deleteBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
