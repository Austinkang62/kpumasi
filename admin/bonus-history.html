<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>보너스 히스토리 - K-Pumasi Admin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
        }

        .content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 80px 30px 30px;
        }

        .page-header {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .page-title {
            color: #f8fafc;
            font-size: 1.8em;
            font-weight: 700;
            margin: 0;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
            justify-content: flex-end;
        }

        .search-box {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .search-box input {
            padding: 8px 12px;
            width: 200px;
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 8px;
            color: #f8fafc;
            font-size: 0.9em;
        }

        .search-box input:focus {
            outline: none;
            border-color: #3b82f6;
            background: rgba(30, 41, 59, 0.8);
        }

        .search-box button {
            padding: 8px 16px;
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s;
        }

        .search-box button:hover {
            background: rgba(59, 130, 246, 0.3);
        }

        .mini-stats {
            display: flex;
            gap: 12px;
        }

        .mini-card {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.6), rgba(15, 23, 42, 0.6));
            padding: 10px 16px;
            border-radius: 10px;
            border: 1px solid rgba(148, 163, 184, 0.15);
            min-width: 120px;
        }

        .mini-label {
            color: #94a3b8;
            font-size: 0.7em;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .mini-value {
            color: #f8fafc;
            font-size: 1.1em;
            font-weight: 700;
        }

        .stats-grid {
            display: none;
        }

        .sales-table {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(148, 163, 184, 0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: rgba(15, 23, 42, 0.8);
        }

        th {
            padding: 16px;
            text-align: left;
            font-weight: 600;
            color: #94a3b8;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 16px;
            border-top: 1px solid rgba(148, 163, 184, 0.1);
        }

        tbody tr {
            transition: all 0.2s;
            cursor: pointer;
        }

        tbody tr:hover {
            background: rgba(59, 130, 246, 0.1);
        }

        tbody tr.expanded {
            background: rgba(59, 130, 246, 0.15);
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75em;
            font-weight: 600;
        }

        .badge-avatar {
            background: rgba(251, 191, 36, 0.2);
            color: #fbbf24;
        }

        .badge-user {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
        }

        .badge-completed {
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
        }

        .amount {
            font-weight: 700;
            color: #10b981;
            font-size: 1.1em;
        }

        .bonus-detail {
            display: none;
            background: rgba(15, 23, 42, 0.6);
            padding: 20px;
        }

        .bonus-detail.show {
            display: block;
        }

        .bonus-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 15px;
        }

        .bonus-section {
            background: rgba(30, 41, 59, 0.8);
            padding: 15px;
            border-radius: 8px;
            border-left: 3px solid;
        }

        .bonus-section.referral { border-left-color: #3b82f6; }
        .bonus-section.edge { border-left-color: #8b5cf6; }
        .bonus-section.matching { border-left-color: #ec4899; }
        .bonus-section.rollup { border-left-color: #10b981; }

        .bonus-section h4 {
            color: #f8fafc;
            margin-bottom: 10px;
            font-size: 0.9em;
            text-transform: uppercase;
        }

        .bonus-item {
            padding: 8px 0;
            border-bottom: 1px solid rgba(148, 163, 184, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85em;
        }

        .bonus-item:last-child {
            border-bottom: none;
        }

        .receiver-info {
            color: #94a3b8;
        }

        .bonus-amount {
            color: #10b981;
            font-weight: 600;
        }

        .level-badge {
            background: rgba(148, 163, 184, 0.2);
            color: #cbd5e1;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75em;
            margin-left: 5px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 30px;
        }

        .pagination button {
            padding: 10px 20px;
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .pagination button:hover {
            background: rgba(59, 130, 246, 0.3);
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .avatar-info {
            background: rgba(251, 191, 36, 0.1);
            border: 1px solid rgba(251, 191, 36, 0.3);
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }

        .avatar-info h4 {
            color: #fbbf24;
            margin-bottom: 10px;
        }

        .expand-icon {
            display: inline-block;
            transition: transform 0.3s;
            margin-right: 8px;
            color: #60a5fa;
        }

        .expanded .expand-icon {
            transform: rotate(90deg);
        }

        .delete-btn {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85em;
            transition: all 0.3s;
        }

        .delete-btn:hover {
            background: rgba(239, 68, 68, 0.3);
            border-color: rgba(239, 68, 68, 0.5);
        }

        /* 커스텀 모달 */
        .custom-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 10000;
            justify-content: center;
            align-items: center;
        }

        .custom-modal.show {
            display: flex;
        }

        .modal-box {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 16px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .modal-title {
            color: #f8fafc;
            font-size: 1.3em;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .modal-message {
            color: #e2e8f0;
            line-height: 1.6;
            margin-bottom: 25px;
            padding: 15px;
            background: rgba(15, 23, 42, 0.5);
            border-radius: 8px;
            border-left: 4px solid #ef4444;
            user-select: text;
            cursor: text;
            white-space: pre-wrap;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .modal-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .modal-btn-cancel {
            background: rgba(148, 163, 184, 0.2);
            color: #cbd5e1;
        }

        .modal-btn-cancel:hover {
            background: rgba(148, 163, 184, 0.3);
        }

        .modal-btn-confirm {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
        }

        .modal-btn-confirm:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(239, 68, 68, 0.3);
        }

        .modal-btn-ok {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
        }

        .modal-btn-ok:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3);
        }

        .copy-hint {
            font-size: 0.8em;
            color: #94a3b8;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="admin-header"></div>

    <div class="content">
        <div class="page-header">
            <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                <h1 class="page-title">📊 보너스 히스토리</h1>
                <a href="user-bonus-received.php" style="padding: 10px 20px; background: rgba(16, 185, 129, 0.2); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3); border-radius: 8px; text-decoration: none; font-weight: 500; transition: all 0.3s;" onmouseover="this.style.background='rgba(16, 185, 129, 0.3)'" onmouseout="this.style.background='rgba(16, 185, 129, 0.2)'">✅ 보너스 검증</a>
            </div>

            <div class="header-right">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="회원 ID 검색..." onkeypress="if(event.key==='Enter') searchUser()">
                    <button onclick="searchUser()">🔍 검색</button>
                    <button onclick="clearSearch()" style="background: rgba(239, 68, 68, 0.2); color: #ef4444; border-color: rgba(239, 68, 68, 0.3);">✕</button>
                </div>

                <div class="mini-stats">
                    <div class="mini-card">
                        <div class="mini-label">매출 건수</div>
                        <div class="mini-value" id="totalSales">-</div>
                    </div>
                    <div class="mini-card">
                        <div class="mini-label">매출 금액</div>
                        <div class="mini-value" id="totalAmount">$0</div>
                    </div>
                    <div class="mini-card">
                        <div class="mini-label">보너스</div>
                        <div class="mini-value" id="totalBonus">$0</div>
                    </div>
                    <div class="mini-card">
                        <div class="mini-label">아바타</div>
                        <div class="mini-value" id="totalAvatars">0</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="sales-table">
            <table>
                <thead>
                    <tr>
                        <th style="width: 50px;"></th>
                        <th>매출 ID</th>
                        <th>회원 ID</th>
                        <th>회원명</th>
                        <th>금액</th>
                        <th>보너스 지급</th>
                        <th>아바타</th>
                        <th>일시</th>
                        <th style="width: 100px;">작업</th>
                    </tr>
                </thead>
                <tbody id="salesList">
                    <tr>
                        <td colspan="9" class="loading">로딩 중...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="pagination" id="pagination"></div>
    </div>

    <!-- 커스텀 확인 모달 -->
    <div class="custom-modal" id="confirmModal">
        <div class="modal-box">
            <div class="modal-title" id="confirmTitle">확인</div>
            <div class="modal-message" id="confirmMessage"></div>
            <div class="copy-hint">💡 텍스트를 드래그하여 복사할 수 있습니다</div>
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-cancel" onclick="closeConfirmModal(false)">취소</button>
                <button class="modal-btn modal-btn-confirm" onclick="closeConfirmModal(true)">삭제</button>
            </div>
        </div>
    </div>

    <!-- 커스텀 알림 모달 -->
    <div class="custom-modal" id="alertModal">
        <div class="modal-box">
            <div class="modal-title" id="alertTitle">알림</div>
            <div class="modal-message" id="alertMessage"></div>
            <div class="copy-hint">💡 텍스트를 드래그하여 복사할 수 있습니다</div>
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-ok" onclick="closeAlertModal()">확인</button>
            </div>
        </div>
    </div>

    <script src="includes/header-loader.js"></script>
    <script>
        const API_BASE = 'api';
        let currentPage = 1;
        let totalPages = 1;
        let confirmCallback = null;
        let currentSearchUser = null;

        // 페이지 로드시 데이터 불러오기
        window.onload = () => {
            loadSales(1);
        };

        // 회원 검색
        function searchUser() {
            const searchInput = document.getElementById('searchInput');
            const userId = searchInput.value.trim();

            if (!userId) {
                alert('검색할 회원 ID를 입력하세요.');
                return;
            }

            currentSearchUser = userId;
            loadSales(1);
        }

        // 검색 초기화
        function clearSearch() {
            document.getElementById('searchInput').value = '';
            currentSearchUser = null;
            loadSales(1);
        }

        // 커스텀 확인 모달
        function showConfirm(message, title = '확인') {
            return new Promise((resolve) => {
                document.getElementById('confirmTitle').textContent = title;
                document.getElementById('confirmMessage').textContent = message;
                document.getElementById('confirmModal').classList.add('show');
                confirmCallback = resolve;
            });
        }

        function closeConfirmModal(result) {
            document.getElementById('confirmModal').classList.remove('show');
            if (confirmCallback) {
                confirmCallback(result);
                confirmCallback = null;
            }
        }

        // 커스텀 알림 모달
        function showAlert(message, title = '알림') {
            return new Promise((resolve) => {
                document.getElementById('alertTitle').textContent = title;
                document.getElementById('alertMessage').textContent = message;
                document.getElementById('alertModal').classList.add('show');
                window.alertCallback = resolve;
            });
        }

        function closeAlertModal() {
            document.getElementById('alertModal').classList.remove('show');
            if (window.alertCallback) {
                window.alertCallback();
                window.alertCallback = null;
            }
        }

        // 매출 목록 불러오기
        async function loadSales(page = 1) {
            currentPage = page;

            try {
                let url = `${API_BASE}/bonus-history.php?action=list&page=${page}&limit=20`;
                if (currentSearchUser) {
                    url += `&user_id=${encodeURIComponent(currentSearchUser)}`;
                }

                const response = await fetch(url);
                const data = await response.json();

                if (data.success) {
                    renderSales(data.sales);
                    updateStats(data.stats);
                    renderPagination(data.total, data.page, data.limit);
                } else {
                    document.getElementById('salesList').innerHTML = `
                        <tr><td colspan="9" style="text-align: center; color: #ef4444;">${data.message}</td></tr>
                    `;
                }
            } catch (error) {
                console.error('Load error:', error);
                document.getElementById('salesList').innerHTML = `
                    <tr><td colspan="9" style="text-align: center; color: #ef4444;">데이터 로드 오류</td></tr>
                `;
            }
        }

        // 매출 목록 렌더링
        function renderSales(sales) {
            const tbody = document.getElementById('salesList');

            if (sales.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" style="text-align: center;">매출 내역이 없습니다.</td></tr>';
                return;
            }

            let html = '';
            sales.forEach(sale => {
                const isAvatar = sale.is_avatar === 1;
                const bonusTotal = sale.bonus_summary.total_amount;
                const bonusCount = sale.bonus_summary.total_count;

                html += `
                    <tr id="row-${sale.id}">
                        <td onclick="toggleDetail(${sale.id})"><span class="expand-icon">▶</span></td>
                        <td onclick="toggleDetail(${sale.id})">#${sale.id}</td>
                        <td onclick="toggleDetail(${sale.id})">
                            ${sale.user_id}
                            ${isAvatar ? '<span class="badge badge-avatar">아바타</span>' : '<span class="badge badge-user">회원</span>'}
                        </td>
                        <td onclick="toggleDetail(${sale.id})">${sale.name || '-'}</td>
                        <td onclick="toggleDetail(${sale.id})" class="amount">$${parseFloat(sale.amount).toFixed(2)}</td>
                        <td onclick="toggleDetail(${sale.id})">
                            <strong style="color: #10b981;">$${bonusTotal.toFixed(2)}</strong>
                            <span style="color: #94a3b8; font-size: 0.85em;">(${bonusCount}건)</span>
                        </td>
                        <td onclick="toggleDetail(${sale.id})">${sale.avatars_created > 0 ? `<span class="badge badge-avatar">${sale.avatars_created}개</span>` : '-'}</td>
                        <td onclick="toggleDetail(${sale.id})">${formatDateTime(sale.created_at)}</td>
                        <td>
                            <button class="delete-btn" onclick="deleteSale(event, ${sale.id})">삭제</button>
                        </td>
                    </tr>
                    <tr id="detail-${sale.id}" class="bonus-detail">
                        <td colspan="9">
                            <div id="detail-content-${sale.id}" class="loading">로딩 중...</div>
                        </td>
                    </tr>
                `;
            });

            tbody.innerHTML = html;
        }

        // 상세 내역 토글
        async function toggleDetail(saleId) {
            const row = document.getElementById(`row-${saleId}`);
            const detail = document.getElementById(`detail-${saleId}`);
            const content = document.getElementById(`detail-content-${saleId}`);

            if (detail.classList.contains('show')) {
                detail.classList.remove('show');
                row.classList.remove('expanded');
                return;
            }

            // 모든 다른 상세 내역 닫기
            document.querySelectorAll('.bonus-detail').forEach(d => d.classList.remove('show'));
            document.querySelectorAll('tbody tr').forEach(r => r.classList.remove('expanded'));

            detail.classList.add('show');
            row.classList.add('expanded');

            // 상세 내역 로드
            try {
                const response = await fetch(`${API_BASE}/bonus-history.php?action=detail&sale_id=${saleId}`);
                const data = await response.json();

                if (data.success) {
                    renderDetail(content, data);
                } else {
                    content.innerHTML = `<p style="color: #ef4444;">${data.message}</p>`;
                }
            } catch (error) {
                content.innerHTML = `<p style="color: #ef4444;">상세 내역 로드 오류</p>`;
            }
        }

        // 상세 내역 렌더링
        function renderDetail(container, data) {
            const { sale, bonus_by_type, avatars } = data;

            let html = '<div class="bonus-grid">';

            // Referral Bonus
            if (bonus_by_type.referral.length > 0) {
                html += renderBonusSection('referral', 'Referral Bonus (추천 보너스)', bonus_by_type.referral);
            }

            // Rollup Bonus
            if (bonus_by_type.rollup.length > 0) {
                html += renderBonusSection('rollup', 'Rollup Bonus (롤업 보너스)', bonus_by_type.rollup);
            }

            // Edge Bonus
            if (bonus_by_type.edge.length > 0) {
                html += renderBonusSection('edge', 'Edge Bonus (엣지 보너스)', bonus_by_type.edge);
            }

            // Matching Bonus
            if (bonus_by_type.matching.length > 0) {
                html += renderBonusSection('matching', 'Matching Bonus (매칭 보너스)', bonus_by_type.matching);
            }

            html += '</div>';

            // 아바타 생성 정보
            if (avatars.length > 0) {
                html += '<div class="avatar-info">';
                html += '<h4>🤖 생성된 아바타</h4>';
                avatars.forEach(avatar => {
                    html += `<p>• ${avatar.parent_user_id} → <strong>${avatar.avatar_user_id}</strong> (Package: $${avatar.trigger_amount})</p>`;
                });
                html += '</div>';
            }

            container.innerHTML = html;
        }

        // 보너스 섹션 렌더링
        function renderBonusSection(type, title, bonuses) {
            let html = `<div class="bonus-section ${type}">`;
            html += `<h4>${title}</h4>`;

            bonuses.forEach(bonus => {
                const receiverLabel = bonus.receiver_is_avatar ? '🤖' : '👤';
                html += `
                    <div class="bonus-item">
                        <span class="receiver-info">
                            ${receiverLabel} ${bonus.receiver_user_id}
                            ${bonus.level ? `<span class="level-badge">L${bonus.level}</span>` : ''}
                        </span>
                        <span class="bonus-amount">$${parseFloat(bonus.amount).toFixed(2)}</span>
                    </div>
                `;
            });

            html += '</div>';
            return html;
        }

        // 통계 업데이트 (전체 통계 표시)
        function updateStats(stats) {
            document.getElementById('totalSales').textContent = stats.total_sales;
            document.getElementById('totalAmount').textContent = '$' + stats.total_amount.toFixed(2);
            document.getElementById('totalBonus').textContent = '$' + stats.total_bonus.toFixed(2);
            document.getElementById('totalAvatars').textContent = stats.total_avatars;
        }

        // 페이지네이션 렌더링
        function renderPagination(total, page, limit) {
            totalPages = Math.ceil(total / limit);
            const pagination = document.getElementById('pagination');

            let html = `
                <button onclick="loadSales(${page - 1})" ${page <= 1 ? 'disabled' : ''}>◀ 이전</button>
                <span style="color: #94a3b8; padding: 0 20px;">Page ${page} / ${totalPages}</span>
                <button onclick="loadSales(${page + 1})" ${page >= totalPages ? 'disabled' : ''}>다음 ▶</button>
            `;

            pagination.innerHTML = html;
        }

        // 날짜 포맷팅
        function formatDateTime(dateString) {
            const date = new Date(dateString);
            return date.toLocaleString('ko-KR', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // 매출 삭제
        async function deleteSale(event, saleId) {
            event.stopPropagation(); // 행 클릭 이벤트 방지

            const confirmMessage = `이 매출과 관련된 모든 보너스가 삭제되고 사용자 잔액이 롤백됩니다.

정말 삭제하시겠습니까?

매출 ID: #${saleId}`;

            const confirmed = await showConfirm(confirmMessage, '⚠️ 매출 삭제 확인');

            if (!confirmed) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/sales-delete.php`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ sale_id: saleId })
                });

                const data = await response.json();
                console.log('Delete response:', data); // 디버깅용

                if (data.success) {
                    const successMessage = `✅ 매출이 삭제되었습니다.

- 매출 ID: #${saleId}
- 매출 금액: $${data.data.sale_amount}
- 삭제된 보너스: ${data.data.bonuses_deleted}건`;

                    await showAlert(successMessage, '삭제 완료');
                    loadSales(currentPage); // 목록 새로고침
                } else {
                    console.error('Delete failed:', data);
                    let errorMsg = `❌ 삭제 실패

메시지: ${data.message}`;

                    if (data.error) {
                        errorMsg += `\n\n에러 상세:
${data.error}`;
                        if (data.file && data.line) {
                            errorMsg += `\n\n발생 위치:
${data.file}:${data.line}`;
                        }
                    }
                    await showAlert(errorMsg, '삭제 실패');
                }
            } catch (error) {
                console.error('Delete error:', error);
                const errorMessage = `❌ 삭제 중 오류가 발생했습니다.

오류 내용:
${error.message}`;
                await showAlert(errorMessage, '오류 발생');
            }
        }
    </script>
</body>
</html>
