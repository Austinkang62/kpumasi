<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아바타 관리 - K-Pumasi Admin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif;
            background: #0f172a;
            min-height: 100vh;
        }

        .dashboard-content {
            max-width: 1600px;
            margin: 0 auto;
            padding: 80px 30px 30px 30px;
        }

        .page-header {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px -8px rgba(0,0,0,0.3);
            border: 1px solid rgba(148, 163, 184, 0.1);
            margin-bottom: 30px;
        }

        .page-header h1 {
            color: #f8fafc;
            font-size: 1.8em;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .page-header p {
            color: #94a3b8;
            font-size: 0.95em;
        }

        /* 통계 카드 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            padding: 28px;
            border-radius: 16px;
            box-shadow: 0 8px 32px -8px rgba(0,0,0,0.3);
            border: 1px solid rgba(148, 163, 184, 0.1);
            transition: all 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px -8px rgba(0,0,0,0.4);
            border-color: rgba(139, 92, 246, 0.3);
        }

        .stat-card h3 {
            color: #94a3b8;
            font-size: 0.85em;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .stat-card .value {
            font-size: 2.5em;
            font-weight: 700;
            background: linear-gradient(135deg, #a78bfa, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .stat-card .change {
            color: #34d399;
            font-size: 0.9em;
            font-weight: 500;
        }

        /* 검색 영역 */
        .search-box {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            padding: 20px 30px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 16px -4px rgba(0,0,0,0.3);
            border: 1px solid rgba(148, 163, 184, 0.1);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .search-box input {
            flex: 1;
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 8px;
            color: #f8fafc;
            font-size: 0.95em;
            transition: all 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #8b5cf6;
            background: rgba(15, 23, 42, 0.8);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
        }

        .btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95em;
            font-weight: 600;
            transition: all 0.3s;
            box-shadow: 0 4px 12px -4px rgba(139, 92, 246, 0.4);
        }

        .btn:hover {
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px -4px rgba(139, 92, 246, 0.5);
        }

        /* 아바타 리스트 */
        .content-section {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px -8px rgba(0,0,0,0.3);
            border: 1px solid rgba(148, 163, 184, 0.1);
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: rgba(15, 23, 42, 0.5);
            padding: 14px;
            text-align: left;
            font-weight: 600;
            color: #94a3b8;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.1);
        }

        td {
            padding: 14px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.1);
            color: #e2e8f0;
        }

        tr:hover {
            background: rgba(139, 92, 246, 0.05);
        }

        .badge {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8em;
            font-weight: 600;
            display: inline-block;
        }

        .badge.active {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .badge.inactive {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .btn-detail {
            padding: 6px 14px;
            background: rgba(139, 92, 246, 0.2);
            color: #a78bfa;
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-detail:hover {
            background: rgba(139, 92, 246, 0.3);
            color: #c4b5fd;
        }

        /* 페이지네이션 */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .pagination button {
            padding: 8px 14px;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(148, 163, 184, 0.2);
            color: #e2e8f0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.2s;
        }

        .pagination button:hover:not(:disabled) {
            background: rgba(139, 92, 246, 0.2);
            border-color: rgba(139, 92, 246, 0.4);
            color: #a78bfa;
        }

        .pagination button.active {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            border-color: #8b5cf6;
            color: white;
        }

        .pagination button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* 모달 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 10000;
            backdrop-filter: blur(5px);
            padding: 20px;
            overflow-y: auto;
        }

        .modal-content {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border-radius: 20px;
            max-width: 1200px;
            margin: 40px auto;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.2);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 2px solid rgba(148, 163, 184, 0.2);
            padding-bottom: 20px;
        }

        .modal-header h2 {
            color: #f8fafc;
            font-size: 1.8em;
            font-weight: 700;
        }

        .close-modal {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.95em;
            font-weight: 600;
            transition: all 0.3s;
        }

        .close-modal:hover {
            background: rgba(239, 68, 68, 0.3);
            transform: translateY(-2px);
        }

        /* 아바타 상세 정보 */
        .avatar-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(15, 23, 42, 0.3);
            border-radius: 12px;
        }

        .info-item {
            color: #e2e8f0;
        }

        .info-item label {
            display: block;
            color: #94a3b8;
            font-size: 0.85em;
            margin-bottom: 5px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-item .value {
            color: #f8fafc;
            font-size: 1em;
            font-weight: 600;
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: #94a3b8;
            font-size: 1.1em;
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
        }

        .section-title {
            color: #f8fafc;
            font-size: 1.2em;
            font-weight: 700;
            margin: 25px 0 15px 0;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(139, 92, 246, 0.3);
        }

        /* 가계도 스타일 */
        .family-tree {
            background: rgba(15, 23, 42, 0.3);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .ancestor-chain {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .ancestor-item {
            background: rgba(139, 92, 246, 0.2);
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid rgba(139, 92, 246, 0.3);
            color: #a78bfa;
            font-size: 0.9em;
            font-weight: 600;
        }

        .arrow {
            color: #64748b;
            font-size: 1.2em;
        }

        .current-avatar {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1em;
        }
    </style>
</head>
<body>
    <div id="admin-header"></div>

    <div class="dashboard-content">
        <div class="page-header">
            <h1>👤 아바타 관리</h1>
            <p>메인 계정(아바타)과 하위 계정들을 관리합니다</p>
        </div>

        <!-- 통계 카드 -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <h3>전체 아바타</h3>
                <div class="value" id="totalAvatars">-</div>
                <div class="change">총 아바타 수</div>
            </div>
            <div class="stat-card">
                <h3>활성 아바타</h3>
                <div class="value" id="activeAvatars">-</div>
                <div class="change">활성 상태의 아바타</div>
            </div>
            <div class="stat-card">
                <h3>루트 아바타</h3>
                <div class="value" id="rootAvatars">-</div>
                <div class="change">최초 생성 아바타</div>
            </div>
            <div class="stat-card">
                <h3>생산 아바타</h3>
                <div class="value" id="parentAvatars">-</div>
                <div class="change">자식을 생산한 아바타</div>
            </div>
        </div>

        <!-- 검색 -->
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="아바타 ID, 이메일, 이름 검색..." />
            <button class="btn" onclick="searchAvatars()">🔍 검색</button>
        </div>

        <!-- 아바타 리스트 -->
        <div class="content-section">
            <div id="avatarsList">
                <div class="loading">아바타 목록을 불러오는 중...</div>
            </div>
            <div class="pagination" id="pagination"></div>
        </div>
    </div>

    <!-- 아바타 상세 모달 -->
    <div id="avatarModal" class="modal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h2 id="modalTitle">아바타 상세 정보</h2>
                <button class="close-modal" onclick="closeModal()">✕ 닫기</button>
            </div>

            <div id="modalContent">
                <div class="loading">로딩 중...</div>
            </div>
        </div>
    </div>

    <script src="../includes/header-loader.js"></script>
    <script>
        const API_BASE = '../api';
        let currentPage = 1;
        let currentSearch = '';

        // 페이지 로드
        window.onload = () => {
            checkAuth();
            loadStats();
            loadAvatars(1);
        };

        // 인증 확인
        async function checkAuth() {
            try {
                const response = await fetch(`${API_BASE}/auth.php?action=check`);
                const data = await response.json();
                if (!data.logged_in) {
                    window.location.href = '/admin/index.html';
                }
            } catch (error) {
                console.error('Auth check error:', error);
            }
        }

        // 통계 로드
        async function loadStats() {
            try {
                const response = await fetch(`${API_BASE}/avatars.php?action=stats&_=${Date.now()}`);
                const data = await response.json();

                if (data.success) {
                    const stats = data.stats;
                    document.getElementById('totalAvatars').textContent = stats.total_avatars.toLocaleString();
                    document.getElementById('activeAvatars').textContent = stats.active_avatars.toLocaleString();
                    document.getElementById('rootAvatars').textContent = (stats.root_avatars || 0).toLocaleString();
                    document.getElementById('parentAvatars').textContent = (stats.parent_avatars || 0).toLocaleString();
                } else {
                    console.error('Stats load failed:', data.message);
                }
            } catch (error) {
                console.error('Stats error:', error);
            }
        }

        // 아바타 리스트 로드
        async function loadAvatars(page = 1) {
            currentPage = page;

            try {
                const url = `${API_BASE}/avatars.php?action=list&page=${page}&limit=20&search=${currentSearch}&_=${Date.now()}`;
                const response = await fetch(url);
                const data = await response.json();

                if (!data.success) {
                    alert('아바타 목록을 불러오지 못했습니다: ' + data.message);
                    return;
                }

                renderAvatarsList(data.avatars);
                renderPagination(data.pagination);

            } catch (error) {
                console.error('Load avatars error:', error);
                alert('아바타 목록 로드 오류: ' + error.message);
            }
        }

        // 아바타 리스트 렌더링
        function renderAvatarsList(avatars) {
            const listDiv = document.getElementById('avatarsList');

            if (avatars.length === 0) {
                listDiv.innerHTML = '<div class="no-data">검색 결과가 없습니다.</div>';
                return;
            }

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>아바타 ID</th>
                            <th>이름</th>
                            <th>세대</th>
                            <th>부모 아바타</th>
                            <th>자식 수</th>
                            <th>총 매출</th>
                            <th>보너스</th>
                            <th>패키지</th>
                            <th>상태</th>
                            <th>생성일</th>
                            <th>관리</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            avatars.forEach(avatar => {
                const totalSales = parseFloat(avatar.total_sales || 0).toLocaleString('en-US', {minimumFractionDigits: 2});
                const totalBonus = parseFloat(avatar.total_bonus || 0).toLocaleString('en-US', {minimumFractionDigits: 2});
                const statusClass = avatar.status === 'active' ? 'active' : 'inactive';
                const packageInfo = avatar.package_id ? `#${avatar.package_id}` : '-';
                const parentInfo = avatar.parent_account_id || '-';
                const childCount = avatar.child_avatar_count || 0;
                const generation = avatar.generation || 1;

                // 세대 표시 색상
                let genColor = '#3b82f6';
                if (generation === 1) genColor = '#fbbf24'; // 1세대는 금색
                else if (generation === 2) genColor = '#c0c0c0'; // 2세대는 은색
                else if (generation === 3) genColor = '#cd7f32'; // 3세대는 동색

                html += `
                    <tr>
                        <td><strong>${avatar.user_id}</strong></td>
                        <td>${avatar.name || '-'}</td>
                        <td style="color: ${genColor}; font-weight: 700;">${generation}G</td>
                        <td>${parentInfo}</td>
                        <td>${childCount}개</td>
                        <td style="color: #10b981; font-weight: 600;">$${totalSales}</td>
                        <td style="color: #fbbf24; font-weight: 600;">$${totalBonus}</td>
                        <td>${packageInfo}</td>
                        <td><span class="badge ${statusClass}">${avatar.status}</span></td>
                        <td>${formatDate(avatar.created_at)}</td>
                        <td><button class="btn-detail" onclick="showAvatarDetail('${avatar.user_id}')">🔍 상세</button></td>
                    </tr>
                `;
            });

            html += `</tbody></table>`;
            listDiv.innerHTML = html;
        }

        // 페이지네이션 렌더링
        function renderPagination(pagination) {
            const paginationDiv = document.getElementById('pagination');
            let html = '';

            if (pagination.page > 1) {
                html += `<button onclick="loadAvatars(${pagination.page - 1})">« 이전</button>`;
            } else {
                html += `<button disabled>« 이전</button>`;
            }

            for (let i = 1; i <= pagination.total_pages; i++) {
                if (i === pagination.page) {
                    html += `<button class="active">${i}</button>`;
                } else if (Math.abs(i - pagination.page) <= 2 || i === 1 || i === pagination.total_pages) {
                    html += `<button onclick="loadAvatars(${i})">${i}</button>`;
                } else if (Math.abs(i - pagination.page) === 3) {
                    html += `<button disabled>...</button>`;
                }
            }

            if (pagination.page < pagination.total_pages) {
                html += `<button onclick="loadAvatars(${pagination.page + 1})">다음 »</button>`;
            } else {
                html += `<button disabled>다음 »</button>`;
            }

            paginationDiv.innerHTML = html;
        }

        // 검색
        function searchAvatars() {
            currentSearch = document.getElementById('searchInput').value.trim();
            loadAvatars(1);
        }

        // Enter 키로 검색
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchAvatars();
            }
        });

        // 아바타 상세 모달
        async function showAvatarDetail(avatarId) {
            document.getElementById('avatarModal').style.display = 'block';
            document.getElementById('modalTitle').textContent = `아바타: ${avatarId}`;
            document.getElementById('modalContent').innerHTML = '<div class="loading">로딩 중...</div>';

            try {
                const response = await fetch(`${API_BASE}/avatars.php?action=detail&avatar_id=${avatarId}&_=${Date.now()}`);
                const data = await response.json();

                if (data.success) {
                    renderAvatarDetail(data);
                } else {
                    document.getElementById('modalContent').innerHTML = `<div class="no-data">${data.message}</div>`;
                }
            } catch (error) {
                console.error('Avatar detail error:', error);
                document.getElementById('modalContent').innerHTML = '<div class="no-data">데이터 로드 실패</div>';
            }
        }

        // 아바타 상세 렌더링
        function renderAvatarDetail(data) {
            const avatar = data.avatar;
            const parentAvatar = data.parent_avatar;
            const ancestors = data.ancestors || [];
            const childAvatars = data.child_avatars || [];
            const sales = data.sales;
            const bonusStats = data.bonus_stats;

            let html = `
                <!-- 아바타 가계도 -->
                <div class="family-tree">
                    <div class="section-title" style="margin-top: 0;">🌳 아바타 가계도</div>
                    <div class="ancestor-chain">
            `;

            // 조상들을 역순으로 표시 (최상위부터)
            if (ancestors.length > 0) {
                for (let i = ancestors.length - 1; i >= 0; i--) {
                    const ancestor = ancestors[i];
                    html += `
                        <div class="ancestor-item" onclick="showAvatarDetail('${ancestor.user_id}')" style="cursor: pointer;">
                            ${ancestor.name || ancestor.user_id}
                        </div>
                        <div class="arrow">→</div>
                    `;
                }
            }

            // 현재 아바타 (세대 표시)
            const generation = avatar.generation || 1;
            let genBadge = '';
            if (generation === 1) genBadge = '🥇 1G';
            else if (generation === 2) genBadge = '🥈 2G';
            else if (generation === 3) genBadge = '🥉 3G';
            else genBadge = `${generation}G`;

            html += `
                        <div class="current-avatar">
                            ${avatar.name || avatar.user_id} (${genBadge})
                        </div>
                    </div>
            `;

            // 부모 아바타 정보
            if (parentAvatar) {
                html += `
                    <div style="margin-top: 15px; padding: 12px; background: rgba(139, 92, 246, 0.1); border-radius: 8px; border-left: 3px solid #8b5cf6;">
                        <strong style="color: #a78bfa;">부모 아바타:</strong>
                        <span style="color: #e2e8f0;">${parentAvatar.name || parentAvatar.user_id}</span>
                        <span style="color: #94a3b8; margin-left: 10px;">| 매출: $${parseFloat(parentAvatar.total_sales || 0).toLocaleString('en-US', {minimumFractionDigits: 2})}</span>
                    </div>
                `;
            } else {
                html += `
                    <div style="margin-top: 15px; padding: 12px; background: rgba(251, 191, 36, 0.1); border-radius: 8px; border-left: 3px solid #fbbf24;">
                        <strong style="color: #fbbf24;">🏆 루트 아바타 (최초 생성)</strong>
                    </div>
                `;
            }

            html += `</div>`;

            html += `
                <!-- 기본 정보 -->
                <div class="avatar-info">
                    <div class="info-item">
                        <label>아바타 ID</label>
                        <div class="value">${avatar.user_id}</div>
                    </div>
                    <div class="info-item">
                        <label>이름</label>
                        <div class="value">${avatar.name || '-'}</div>
                    </div>
                    <div class="info-item">
                        <label>세대</label>
                        <div class="value" style="color: ${avatar.generation === 1 ? '#fbbf24' : (avatar.generation === 2 ? '#c0c0c0' : '#cd7f32')};">${avatar.generation || 1}G</div>
                    </div>
                    <div class="info-item">
                        <label>이메일</label>
                        <div class="value">${avatar.email || '-'}</div>
                    </div>
                    <div class="info-item">
                        <label>전화번호</label>
                        <div class="value">${avatar.phone || '-'}</div>
                    </div>
                    <div class="info-item">
                        <label>그룹코드</label>
                        <div class="value">${avatar.account_group || '-'}</div>
                    </div>
                    <div class="info-item">
                        <label>상태</label>
                        <div class="value"><span class="badge ${avatar.status === 'active' ? 'active' : 'inactive'}">${avatar.status}</span></div>
                    </div>
                </div>

                <!-- 매출 및 보너스 통계 -->
                <div class="section-title">📊 매출 및 보너스 통계</div>
                <div class="avatar-info">
                    <div class="info-item">
                        <label>총 매출</label>
                        <div class="value" style="color: #10b981;">$${parseFloat(sales.total_sales || 0).toLocaleString('en-US', {minimumFractionDigits: 2})}</div>
                    </div>
                    <div class="info-item">
                        <label>계정 수</label>
                        <div class="value">${sales.account_count || 0}개</div>
                    </div>
                    <div class="info-item">
                        <label>총 보너스</label>
                        <div class="value" style="color: #fbbf24;">$${parseFloat(avatar.total_bonus || 0).toLocaleString('en-US', {minimumFractionDigits: 2})}</div>
                    </div>
                    <div class="info-item">
                        <label>사용 가능 보너스</label>
                        <div class="value" style="color: #3b82f6;">$${parseFloat(avatar.available_bonus || 0).toLocaleString('en-US', {minimumFractionDigits: 2})}</div>
                    </div>
                </div>

                <!-- 보너스 상세 -->
                <div class="section-title">💰 보너스 상세</div>
                <div class="avatar-info">
                    <div class="info-item">
                        <label>추천 보너스</label>
                        <div class="value" style="color: #10b981;">$${parseFloat(bonusStats.total_referral || 0).toLocaleString('en-US', {minimumFractionDigits: 2})}</div>
                    </div>
                    <div class="info-item">
                        <label>엣지 보너스</label>
                        <div class="value" style="color: #3b82f6;">$${parseFloat(bonusStats.total_edge || 0).toLocaleString('en-US', {minimumFractionDigits: 2})}</div>
                    </div>
                    <div class="info-item">
                        <label>매칭 보너스</label>
                        <div class="value" style="color: #8b5cf6;">$${parseFloat(bonusStats.total_matching || 0).toLocaleString('en-US', {minimumFractionDigits: 2})}</div>
                    </div>
                    <div class="info-item">
                        <label>롤업 보너스</label>
                        <div class="value" style="color: #f59e0b;">$${parseFloat(bonusStats.total_rollup || 0).toLocaleString('en-US', {minimumFractionDigits: 2})}</div>
                    </div>
                </div>

                <!-- 자식 아바타 리스트 -->
                <div class="section-title">👶 생산한 아바타 (${childAvatars.length}개)</div>
            `;

            if (childAvatars.length > 0) {
                html += `
                    <table style="margin-top: 15px;">
                        <thead>
                            <tr>
                                <th>아바타 ID</th>
                                <th>이름</th>
                                <th>자식 수</th>
                                <th>매출</th>
                                <th>총 보너스</th>
                                <th>사용가능</th>
                                <th>패키지</th>
                                <th>상태</th>
                                <th>생성일</th>
                                <th>상세</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                childAvatars.forEach(child => {
                    html += `
                        <tr>
                            <td><strong>${child.user_id}</strong></td>
                            <td>${child.name || '-'}</td>
                            <td>${child.child_count || 0}개</td>
                            <td style="color: #10b981;">$${parseFloat(child.total_sales || 0).toLocaleString('en-US', {minimumFractionDigits: 2})}</td>
                            <td style="color: #fbbf24;">$${parseFloat(child.total_bonus || 0).toLocaleString('en-US', {minimumFractionDigits: 2})}</td>
                            <td style="color: #3b82f6;">$${parseFloat(child.available_bonus || 0).toLocaleString('en-US', {minimumFractionDigits: 2})}</td>
                            <td>${child.package_id ? `#${child.package_id}` : '-'}</td>
                            <td><span class="badge ${child.status === 'active' ? 'active' : 'inactive'}">${child.status}</span></td>
                            <td>${formatDate(child.created_at)}</td>
                            <td><button class="btn-detail" onclick="showAvatarDetail('${child.user_id}')">🔍</button></td>
                        </tr>
                    `;
                });

                html += `</tbody></table>`;
            } else {
                html += `<div class="no-data">생산한 자식 아바타가 없습니다.</div>`;
            }

            document.getElementById('modalContent').innerHTML = html;
        }

        // 모달 닫기
        function closeModal(event) {
            if (!event || event.target.id === 'avatarModal') {
                document.getElementById('avatarModal').style.display = 'none';
            }
        }

        // 날짜 포맷팅
        function formatDate(dateString) {
            if (!dateString) return '-';
            const date = new Date(dateString);
            return date.toLocaleDateString('ko-KR', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            });
        }
    </script>
</body>
</html>
