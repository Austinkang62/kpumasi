<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>후원 조직도 - We One (v2025-11-12)</title>
    <link rel="stylesheet" href="../css/k-pumasi-modern.css">
    <script src="../js/auth-check.js"></script>
    <style>
        body {
            min-height: 100vh;
            overflow: auto;
            padding: 0;
            margin: 0;
        }

        /* 조직도 컨테이너 */
        .org-container {
            position: relative;
            padding: 20px;
            min-height: 100vh;
            background: #0a0e1a;
            overflow: auto;
        }

        .org-chart {
            position: relative;
            margin: 0 auto;
            padding: 40px;
        }

        /* 조직도 카드 */
        .org-card {
            position: absolute;
            width: 90px;  /* 110px → 90px로 축소 */
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.08), rgba(255, 0, 255, 0.08));
            backdrop-filter: blur(20px);
            border: 2px solid rgba(0, 255, 255, 0.4);
            border-radius: 10px;
            padding: 5px;  /* 6px → 5px로 축소 */
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px rgba(0, 255, 255, 0.2);
            font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', '맑은 고딕', 'Apple SD Gothic Neo', sans-serif;
            z-index: 2;
        }

        .org-card:hover {
            transform: translateY(-8px) scale(1.05);
            border-color: var(--we1-gold);
            box-shadow: 0 12px 40px rgba(212, 175, 55, 0.5);
            z-index: 100;
        }

        .org-card.root {
            border: 3px solid var(--we1-gold);
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.15), rgba(255, 215, 0, 0.1));
        }

        .org-card.direct-referral {
            border: 2px solid rgba(212, 175, 55, 0.5);
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.1), rgba(255, 215, 0, 0.08));
        }

        .org-card.direct-referral:hover {
            border-color: rgba(212, 175, 55, 0.8);
            box-shadow: 0 12px 40px rgba(212, 175, 55, 0.4);
        }

        .org-card.right-position {
            border: 2px solid rgba(255, 136, 0, 0.6);
            background: linear-gradient(135deg, rgba(255, 136, 0, 0.1), rgba(255, 85, 0, 0.08));
        }

        .org-card.right-position:hover {
            border-color: rgba(255, 136, 0, 0.9);
            box-shadow: 0 12px 40px rgba(255, 136, 0, 0.4);
        }

        /* 아바타 카드 스타일 - 진한 금색 배경 */
        .org-card.avatar-node {
            border: 2px solid rgba(251, 191, 36, 1);
            background: linear-gradient(135deg,
                rgba(251, 191, 36, 0.85) 0%,
                rgba(245, 158, 11, 0.75) 50%,
                rgba(217, 119, 6, 0.85) 100%
            );
            box-shadow: 0 4px 20px rgba(251, 191, 36, 0.4);
        }

        /* 아바타 카드 hover 효과 */
        .org-card.avatar-node:hover {
            border-color: rgba(251, 191, 36, 1);
            box-shadow: 0 8px 30px rgba(251, 191, 36, 0.6);
        }

        .avatar-owner-btn {
            position: absolute;
            bottom: 3px;
            right: 3px;
            width: 16px;
            height: 16px;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(251, 191, 36, 0.8);
            border-radius: 3px;
            color: rgba(251, 191, 36, 1);
            font-size: 9px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            line-height: 1;
        }

        .avatar-owner-btn:hover {
            background: rgba(15, 23, 42, 0.9);
            border-color: rgba(251, 191, 36, 1);
            transform: scale(1.1);
        }

        /* 아바타 카드 내부 텍스트 스타일 - 어두운 색상 */
        .org-card.avatar-node .card-user-id {
            color: rgba(15, 23, 42, 1);
            font-weight: 800;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.3);
        }

        .org-card.avatar-node .card-stats {
            color: rgba(15, 23, 42, 0.8);
            font-weight: 700;
        }

        .org-card.avatar-node .card-stats span {
            color: rgba(15, 23, 42, 0.95);
            font-weight: 800;
        }

        .card-avatar {
            font-size: 18px;  /* 20px → 18px로 축소 */
            text-align: center;
            margin-bottom: 2px;  /* 3px → 2px */
            line-height: 1;
        }

        .card-user-id {
            font-size: 10px;  /* 11px → 10px로 축소 */
            font-weight: 700;
            color: #00ffff;
            text-align: center;
            margin-bottom: 2px;
            line-height: 1.2;
        }

        .card-position {
            font-size: 9px;  /* 10px → 9px로 축소 */
            text-align: center;
            margin-bottom: 2px;  /* 3px → 2px */
            line-height: 1;
            letter-spacing: -2px;
        }

        .card-position.left {
            background: linear-gradient(90deg, #00ff88, #00cc66);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .card-position.right {
            background: linear-gradient(90deg, #ff8800, #ff5500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .card-stats {
            font-size: 10px;  /* 11px → 10px로 축소 */
            color: rgba(255, 255, 255, 0.6);
            text-align: center;
            line-height: 1.3;
            font-weight: 700;
        }

        .card-stats span {
            color: #00ffff;
            font-size: 10px;  /* 12px → 10px로 축소 */
        }

        .card-badge {
            display: inline-block;
            padding: 1px 5px;
            background: rgba(212, 175, 55, 0.2);
            border-radius: 6px;
            font-size: 7px;
            color: var(--we1-gold);
            margin-top: 2px;
        }

        /* 네비게이션 버튼 */
        .nav-buttons {
            position: absolute;
            top: 4px;
            right: 4px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            z-index: 10;
        }

        .nav-btn {
            width: 18px;
            height: 18px;
            background: rgba(0, 255, 255, 0.2);
            border: 1px solid rgba(0, 255, 255, 0.5);
            border-radius: 4px;
            color: #00ffff;
            font-size: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            line-height: 1;
        }

        .nav-btn:hover {
            background: rgba(212, 175, 55, 0.3);
            border-color: var(--we1-gold);
            color: var(--we1-gold);
            transform: scale(1.1);
        }

        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .nav-btn:disabled:hover {
            background: rgba(0, 255, 255, 0.2);
            border-color: rgba(0, 255, 255, 0.5);
            color: #00ffff;
            transform: scale(1);
        }

        /* SVG 연결선 */
        .org-connections {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 1;
        }

        .connection-line {
            stroke: rgba(0, 255, 255, 0.4);
            stroke-width: 2;
            fill: none;
            transition: all 0.3s;
        }

        .connection-line.avatar-connection {
            stroke: rgba(251, 191, 36, 0.9);
            stroke-width: 3;
            stroke-dasharray: 6, 4;
            filter: drop-shadow(0 0 4px rgba(251, 191, 36, 0.5));
        }

        /* 미니맵 */
        .minimap-container {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 250px;
            height: 180px;
            background: rgba(10, 14, 26, 0.95);
            border: 2px solid rgba(0, 255, 255, 0.3);
            border-radius: 10px;
            padding: 10px;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .minimap-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding-bottom: 5px;
            border-bottom: 1px solid rgba(0, 255, 255, 0.2);
        }

        .minimap-title {
            font-size: 12px;
            font-weight: 700;
            color: #00ffff;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
        }

        .admin-badge {
            display: none;
            position: fixed;
            top: 200px;
            left: 20px;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.2);
            z-index: 1000;
            animation: pulse 2s infinite;
        }

        .admin-badge.show {
            display: block;
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
            }
            50% {
                box-shadow: 0 4px 20px rgba(239, 68, 68, 0.8);
            }
        }

        .minimap-home-btn {
            width: 22px;
            height: 22px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 11px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .minimap-home-btn:hover {
            background: rgba(212, 175, 55, 0.2);
            border-color: rgba(212, 175, 55, 0.5);
            color: var(--we1-gold);
            transform: scale(1.05);
        }

        .minimap-ref-btn {
            width: 20px;
            height: 20px;
            background: transparent;
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 4px;
            color: #00ffff;
            font-size: 9px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .minimap-ref-btn:hover {
            background: rgba(212, 175, 55, 0.2);
            border-color: rgba(212, 175, 55, 0.5);
            color: var(--we1-gold);
            transform: scale(1.05);
        }

        .minimap-toggle {
            width: 20px;
            height: 20px;
            background: transparent;
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 4px;
            color: #00ffff;
            font-size: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .minimap-toggle:hover {
            background: rgba(0, 255, 255, 0.2);
            border-color: rgba(212, 175, 55, 0.5);
            color: var(--we1-gold);
        }

        .minimap-canvas {
            width: 100%;
            height: 140px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 5px;
            position: relative;
            overflow: hidden;
        }

        .minimap-viewport {
            position: absolute;
            border: 2px solid rgba(212, 175, 55, 0.8);
            background: rgba(212, 175, 55, 0.1);
            cursor: move;
            z-index: 10;
        }

        .minimap-node {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(0, 255, 255, 0.6);
            border-radius: 50%;
        }

        .minimap-node.root {
            background: rgba(212, 175, 55, 0.9);
            width: 6px;
            height: 6px;
        }

        .minimap-container.minimized {
            height: auto;
            width: auto;
        }

        .minimap-container.minimized .minimap-canvas {
            display: none;
        }

        /* 검색 박스 */
        .search-container {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 300px;
            background: rgba(10, 14, 26, 0.95);
            border: 2px solid rgba(0, 255, 255, 0.3);
            border-radius: 10px;
            padding: 15px;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .search-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(0, 255, 255, 0.2);
        }

        .search-title {
            font-size: 12px;
            font-weight: 700;
            color: #00ffff;
        }

        .search-input {
            width: 100%;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 6px;
            color: #fff;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--we1-gold);
        }

        .search-results {
            max-height: 300px;
            overflow-y: auto;
        }

        .search-result-item {
            padding: 10px;
            background: rgba(0, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 6px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .search-result-item:hover {
            background: rgba(0, 255, 255, 0.15);
            border-color: var(--we1-gold);
        }

        .search-result-name {
            font-size: 13px;
            font-weight: 700;
            color: #00ffff;
            margin-bottom: 4px;
        }

        .search-result-email {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
        }

        .search-no-results {
            text-align: center;
            padding: 20px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
        }

        /* 줌/팬 컨트롤 */
        .zoom-controls {
            display: none;
        }

        /* 상세정보 모달 */
        .detail-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2000;
            background: var(--we1-bg-card);
            border: 2px solid rgba(0, 255, 255, 0.5);
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .detail-modal.show {
            display: block;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1999;
        }

        .modal-overlay.show {
            display: block;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 28px;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.5);
        }

        .modal-close:hover {
            color: var(--we1-gold);
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .detail-label {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
        }

        .detail-value {
            color: #00ffff;
            font-weight: 600;
            font-size: 14px;
        }

        /* 로딩 */
        .loading {
            text-align: center;
            padding: 100px 20px;
            color: #00ffff;
            font-size: 16px;
            font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', '맑은 고딕', sans-serif;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(0, 255, 255, 0.2);
            border-top: 4px solid #00ffff;
            border-radius: 50%;
            margin: 0 auto 20px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 에러 메시지 */
        .error-message {
            text-align: center;
            padding: 60px 20px;
            color: #ff00ff;
        }

        /* 단계 확장 버튼 */
        .expand-depth-btn {
            position: absolute;
            left: 0;
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.9), rgba(255, 215, 0, 0.8));
            border: 2px solid rgba(212, 175, 55, 1);
            border-left: none;
            border-right: none;
            color: #0a0e1a;
            padding: 16px 24px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.5);
            transition: all 0.3s ease;
            z-index: 500;
            font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', '맑은 고딕', sans-serif;
            text-align: center;
        }

        .expand-depth-btn:hover {
            background: linear-gradient(135deg, rgba(255, 215, 0, 1), rgba(212, 175, 55, 1));
            box-shadow: 0 6px 30px rgba(212, 175, 55, 0.7);
            transform: translateY(-2px);
        }

        .expand-depth-btn:active {
            transform: translateY(0);
            box-shadow: 0 3px 15px rgba(212, 175, 55, 0.5);
        }
    </style>
</head>
<body>
    <!-- 관리자 배지 -->
    <div class="admin-badge" id="adminBadge">
        🔧 ADMIN MODE
    </div>

    <!-- 검색 박스 -->
    <div class="search-container" id="searchContainer" style="display: none;">
        <div class="search-header">
            <span class="search-title">🔍 회원 검색</span>
        </div>
        <input type="text" class="search-input" id="searchInput" placeholder="회원명 또는 회원ID 입력..." autocomplete="off">
        <div class="search-results" id="searchResults"></div>
    </div>

    <!-- 미니맵 -->
    <div class="minimap-container" id="minimapContainer">
        <div class="minimap-header">
            <div class="minimap-title">
                <button class="minimap-home-btn" onclick="goToHome()" title="홈으로">⌂</button>
                <span>후원조직도</span>
            </div>
            <div style="display: flex; gap: 3px;">
                <button class="minimap-ref-btn" onclick="goToReferralOrg()" title="추천조직도로 이동">▶</button>
                <button class="minimap-toggle" id="minimapToggle" onclick="toggleMinimap()">−</button>
            </div>
        </div>
        <div class="minimap-canvas" id="minimapCanvas">
            <div class="minimap-viewport" id="minimapViewport"></div>
        </div>
    </div>

    <!-- 조직도 -->
    <div class="org-container">
        <div id="orgChart" class="org-chart">
            <div class="loading">
                <div class="loading-spinner"></div>
                조직도를 불러오는 중...
            </div>
        </div>
    </div>

    <!-- 상세정보 모달 -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModal()"></div>
    <div class="detail-modal" id="detailModal">
        <span class="modal-close" onclick="closeModal()">&times;</span>
        <div id="modalContent"></div>
    </div>

    <script>
        // 관리자 권한 체크
        let isAdmin = false;

        async function checkAdminAuth() {
            try {
                // 절대 경로로 시도
                const response = await fetch('/admin/api/auth.php?action=check', {
                    credentials: 'include'
                });

                console.log('Auth API 응답 상태:', response.status);

                const data = await response.json();
                isAdmin = data.logged_in || false;

                console.log('관리자 권한 체크 결과:', isAdmin, data);

                if (isAdmin) {
                    console.log('✅ 관리자 권한 확인됨');
                    // 관리자는 모든 단계 표시
                    maxVisibleDepth = 999;
                    // 관리자 배지 표시
                    const adminBadge = document.getElementById('adminBadge');
                    if (adminBadge) {
                        adminBadge.classList.add('show');
                    }
                } else {
                    console.log('⚠️ 관리자 권한 없음');
                }

                // 검색 박스 표시 (관리자/회원 모두)
                const searchContainer = document.getElementById('searchContainer');
                if (searchContainer) {
                    searchContainer.style.display = 'block';
                }
                // 검색 이벤트 리스너 등록
                setupSearch();
            } catch (error) {
                console.log('❌ 관리자 권한 체크 실패:', error);
                isAdmin = false;
            }
        }

        // 파티클 생성
        function createParticles() {
            const container = document.getElementById('particles');
            if (!container) return;

            const particleCount = 30;
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 20 + 's';
                particle.style.animationDuration = (15 + Math.random() * 15) + 's';
                container.appendChild(particle);
            }
        }

        // 조직도 로드
        async function loadOrganizationTree() {
            let apiEndpoint = '../api/organization/get-tree.php';
            let requestBody = {};

            // URL 파라미터에서 user_id 추출
            const urlParams = new URLSearchParams(window.location.search);
            const requestedUserId = urlParams.get('user_id');

            // 관리자 세션 우선 체크
            if (isAdmin) {
                console.log('✅ 관리자 세션으로 조직도 로드');
                // 관리자는 쿠키 기반 세션 사용
                apiEndpoint = '/api/admin/organization/get-tree.php';
                requestBody = {};

                // 관리자가 특정 user_id를 요청한 경우
                if (requestedUserId) {
                    console.log('🎯 특정 회원의 조직도 요청:', requestedUserId);
                    // user_id를 숫자 ID로 변환 필요 - API에서 처리하도록 user_id 전달
                    requestBody.requested_user_id = requestedUserId;
                }
            } else {
                // 일반 회원 세션 체크
                let token = localStorage.getItem('session_token');
                if (!token) {
                    console.log('❌ 토큰 없음, 관리자 아님');
                    alert('로그인이 필요합니다.');
                    window.location.href = 'login.html';
                    return;
                }
                requestBody = { session_token: token };
            }

            try {
                console.log('조직도 API 호출 중... isAdmin:', isAdmin, 'endpoint:', apiEndpoint);

                const response = await fetch(apiEndpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify(requestBody)
                });

                console.log('응답 상태:', response.status, response.statusText);

                // 응답 텍스트 먼저 확인
                const responseText = await response.text();
                console.log('응답 텍스트:', responseText.substring(0, 500));

                // JSON 파싱 시도
                let result;
                try {
                    result = JSON.parse(responseText);
                    console.log('조직도 데이터:', result);
                } catch (parseError) {
                    console.error('JSON 파싱 에러:', parseError);
                    console.error('전체 응답:', responseText);
                    throw new Error('서버 응답이 올바른 JSON 형식이 아닙니다.');
                }

                if (result.success && result.data) {
                    console.log('🤖 아바타 확인:', result.data);
                    // 아바타 노드 확인 (디버깅)
                    const checkAvatars = (node) => {
                        if (node.is_avatar === 1) {
                            console.log('✅ 아바타 발견:', node.user_id, 'is_avatar:', node.is_avatar, 'referral_id:', node.referral_id);
                        }
                        if (node.children) {
                            node.children.forEach(checkAvatars);
                        }
                    };
                    checkAvatars(result.data);

                    renderOrganizationChart(result.data);

                    // 특정 사용자 조직도를 로드한 경우 페이지 타이틀 업데이트
                    if (requestedUserId) {
                        document.title = `${result.data.user_id} 조직도 - WE1`;
                        console.log('📋 페이지 타이틀 업데이트:', result.data.user_id);
                    }

                    // 디버깅용: 전역 노출
                    window.debugOrgData = result.data;
                    window.allNodesMap = allNodesMap;
                    console.log('🔍 디버깅: window.allNodesMap, window.debugOrgData 사용 가능');
                } else {
                    document.getElementById('orgChart').innerHTML =
                        '<div class="error-message">' + (result.message || '조직도를 불러올 수 없습니다.') + '</div>';
                }
            } catch (error) {
                console.error('조직도 로드 오류:', error);
                document.getElementById('orgChart').innerHTML =
                    '<div class="error-message">네트워크 오류가 발생했습니다.</div>';
            }
        }

        // 글로벌 변수
        let currentZoom = 1;
        let currentOffsetX = 0;
        let currentOffsetY = 0;
        let currentRootNode = null; // 현재 루트로 표시되는 노드
        let originalRootNode = null; // 최초 로그인한 사용자의 루트 노드
        let nodeParentMap = new Map(); // 각 노드의 부모 노드 매핑
        let allNodesFlat = []; // 모든 노드를 평면 배열로 저장 (검색용)
        let allNodesMap = new Map(); // 모든 노드를 Map으로 저장 (ID로 빠른 검색용)
        let maxVisibleDepth = 5; // 기본 5단계 표시 (회원용), 관리자는 999로 설정됨
        const depthIncrement = 5; // 확장 버튼 클릭 시 5단계씩 추가
        let actualTreeDepth = 0; // 실제 트리의 전체 깊이

        // 조직도 렌더링
        function renderOrganizationChart(data, rootNode = null) {
            console.log('렌더링 시작:', data);

            const orgChart = document.getElementById('orgChart');
            orgChart.innerHTML = '';

            if (!data) {
                orgChart.innerHTML = '<div class="error-message">데이터가 없습니다.</div>';
                return;
            }

            // 최초 로드 시 원본 데이터 저장
            if (!originalRootNode) {
                originalRootNode = data;
                // 모든 노드를 평면 배열과 Map으로 저장 (검색용)
                allNodesFlat = [];
                allNodesMap.clear();
                flattenNodes(data);
            }

            // children 배열을 left/right 구조로 변환 (바이너리 트리)
            function convertToLeftRight(node) {
                if (!node) return;

                // children 배열이 있고, left/right가 없으면 변환
                if (node.children && node.children.length > 0 && !node.left && !node.right) {
                    node.children.forEach(child => {
                        if (child.sponsor_position === 1) {
                            node.left = child;
                        } else if (child.sponsor_position === 2) {
                            node.right = child;
                        }
                        // 재귀적으로 하위 노드도 변환
                        convertToLeftRight(child);
                    });
                } else if (node.children && node.children.length > 0) {
                    // 이미 left/right가 있으면 children만 재귀 처리
                    node.children.forEach(child => convertToLeftRight(child));
                }

                // left/right도 재귀 처리
                if (node.left) convertToLeftRight(node.left);
                if (node.right) convertToLeftRight(node.right);
            }

            // 데이터 구조 변환
            convertToLeftRight(data);
            console.log('🔄 데이터 구조 변환 완료:', data);

            // 변환 결과 확인
            if (data.left) console.log('  ├─ LEFT:', data.left.user_id);
            if (data.right) console.log('  └─ RIGHT:', data.right.user_id);

            // 현재 루트 설정
            currentRootNode = rootNode || data;

            // 부모 맵 구축
            nodeParentMap.clear();
            buildParentMap(originalRootNode, null);

            // 바이너리 트리 레이아웃 설정
            const nodeWidth = 90;    // 110 → 90으로 축소
            const nodeHeight = 70;   // 80 → 70으로 축소
            const horizontalGap = 30; // 40 → 30으로 축소
            const verticalGap = 170;  // 연결선이 잘 보이도록 간격 증가

            const nodePositions = new Map();
            const connections = [];

            // 트리 깊이 계산 (left/right 구조 지원)
            function getTreeDepth(node, depth = 0) {
                if (!node) return depth;

                // left/right 또는 children 확인
                const leftChild = node.left || null;
                const rightChild = node.right || null;
                const hasChildren = leftChild || rightChild || (node.children && node.children.length > 0);

                if (!hasChildren) {
                    return depth;
                }

                let maxChildDepth = depth;
                if (leftChild) {
                    maxChildDepth = Math.max(maxChildDepth, getTreeDepth(leftChild, depth + 1));
                }
                if (rightChild) {
                    maxChildDepth = Math.max(maxChildDepth, getTreeDepth(rightChild, depth + 1));
                }
                // 하위 호환성
                if (node.children && node.children.length > 0) {
                    node.children.forEach(child => {
                        if (child !== leftChild && child !== rightChild) {
                            maxChildDepth = Math.max(maxChildDepth, getTreeDepth(child, depth + 1));
                        }
                    });
                }
                return maxChildDepth;
            }

            const treeDepth = getTreeDepth(currentRootNode);
            actualTreeDepth = treeDepth; // 실제 트리 깊이 저장

            // 서브트리의 너비 계산 (left/right 구조 지원)
            function getSubtreeWidth(node) {
                if (!node) return 0;

                const leftChild = node.left || null;
                const rightChild = node.right || null;
                const hasChildren = leftChild || rightChild || (node.children && node.children.length > 0);

                if (!hasChildren) {
                    return nodeWidth + horizontalGap;
                }

                let totalWidth = 0;
                if (leftChild) {
                    totalWidth += getSubtreeWidth(leftChild);
                }
                if (rightChild) {
                    totalWidth += getSubtreeWidth(rightChild);
                }
                // 하위 호환성
                if (node.children && node.children.length > 0) {
                    node.children.forEach(child => {
                        if (child !== leftChild && child !== rightChild) {
                            totalWidth += getSubtreeWidth(child);
                        }
                    });
                }

                return Math.max(totalWidth, nodeWidth + horizontalGap);
            }

            // 바이너리 트리 레이아웃 (left/right 구조)
            function calculateOptimalPositions(node, depth = 0, leftBound = 0) {
                if (!node) return { x: leftBound, width: 0 };

                // maxVisibleDepth에 도달하면 더 이상 자식을 렌더링하지 않음
                if (depth >= maxVisibleDepth) {
                    const x = leftBound + nodeWidth / 2;
                    nodePositions.set(node.id, { x, y: depth * verticalGap, node });
                    return { x, width: nodeWidth + horizontalGap };
                }

                const y = depth * verticalGap;

                // 왼쪽 자식 처리
                const leftChild = node.left;
                const rightChild = node.right;
                const hasChildren = leftChild || rightChild;

                // 자식이 없는 경우 (리프 노드)
                if (!hasChildren) {
                    const x = leftBound + nodeWidth / 2;
                    nodePositions.set(node.id, { x, y, node });
                    return { x, width: nodeWidth + horizontalGap };
                }

                let childrenPositions = [];
                let currentLeftBound = leftBound;

                // 왼쪽 자식 먼저 처리
                if (leftChild) {
                    const leftResult = calculateOptimalPositions(leftChild, depth + 1, currentLeftBound);
                    childrenPositions.push({ child: leftChild, x: leftResult.x, position: 1 });
                    currentLeftBound += leftResult.width;
                    connections.push({ parent: node, child: leftChild, position: 1 });
                }

                // 오른쪽 자식 처리
                if (rightChild) {
                    const rightResult = calculateOptimalPositions(rightChild, depth + 1, currentLeftBound);
                    childrenPositions.push({ child: rightChild, x: rightResult.x, position: 2 });
                    currentLeftBound += rightResult.width;
                    connections.push({ parent: node, child: rightChild, position: 2 });
                }

                // 부모 노드는 자식들의 중간에 배치
                let parentX;
                if (childrenPositions.length === 2) {
                    // 양쪽 자식이 모두 있으면 중간점
                    parentX = (childrenPositions[0].x + childrenPositions[1].x) / 2;
                } else if (childrenPositions.length === 1) {
                    // 한쪽만 있으면 그 자식의 위치
                    parentX = childrenPositions[0].x;
                } else {
                    parentX = leftBound + nodeWidth / 2;
                }

                nodePositions.set(node.id, { x: parentX, y, node });

                const totalWidth = currentLeftBound - leftBound;
                return { x: parentX, width: totalWidth };
            }

            // 레이아웃 계산 실행
            const layoutResult = calculateOptimalPositions(currentRootNode, 0, 0);

            // 충돌 감지 및 조정
            function detectAndResolveCollisions() {
                const levels = new Map(); // depth -> nodes[]

                // 레벨별로 노드 그룹화
                nodePositions.forEach((pos, nodeId) => {
                    const depth = Math.round(pos.y / verticalGap);
                    if (!levels.has(depth)) {
                        levels.set(depth, []);
                    }
                    levels.get(depth).push(pos);
                });

                // 각 레벨에서 노드 정렬 후 충돌 체크
                levels.forEach((nodesAtLevel, depth) => {
                    nodesAtLevel.sort((a, b) => a.x - b.x);

                    for (let i = 1; i < nodesAtLevel.length; i++) {
                        const prev = nodesAtLevel[i - 1];
                        const curr = nodesAtLevel[i];
                        const minDistance = nodeWidth + horizontalGap;

                        if (curr.x - prev.x < minDistance) {
                            // 충돌 발생 - 오른쪽 노드를 이동
                            const shift = minDistance - (curr.x - prev.x);
                            shiftSubtree(curr.node, shift, depth);
                        }
                    }
                });
            }

            // 서브트리 전체를 이동
            function shiftSubtree(node, shiftAmount, fromDepth) {
                const pos = Array.from(nodePositions.entries()).find(([id, p]) => p.node === node);
                if (!pos) return;

                const [nodeId, nodePos] = pos;
                nodePos.x += shiftAmount;

                // 자식들도 재귀적으로 이동
                if (node.children && node.children.length > 0) {
                    node.children.forEach(child => {
                        shiftSubtree(child, shiftAmount, fromDepth + 1);
                    });
                }
            }

            // 충돌 해결 실행
            detectAndResolveCollisions();

            // 컨테이너 크기
            const containerWidth = orgChart.parentElement.clientWidth;

            // X 좌표 오프셋 - 중앙 정렬
            const allX = Array.from(nodePositions.values()).map(p => p.x);
            const minX = Math.min(...allX);
            const maxX = Math.max(...allX);
            const treeWidth = maxX - minX + nodeWidth;

            // 여백 추가 (좌우상하 각 80px)
            const edgePadding = 80;

            // offsetX 계산 (중앙 정렬 시도)
            let offsetX = (containerWidth - treeWidth) / 2 - minX;

            // 트리가 컨테이너보다 크면 좌측 여백만 확보
            if (offsetX < 0) {
                offsetX = -minX + edgePadding;
            } else {
                // 트리가 컨테이너보다 작으면 중앙 정렬 + 여백
                offsetX = offsetX + edgePadding;
            }


            // SVG 연결선 먼저 그리기
            if (connections.length > 0) {
                // SVG 크기를 여백 포함하여 계산
                const minXCoord = 0;
                const minYCoord = 0;
                const maxXCoord = Math.max(...allX) + offsetX + nodeWidth + edgePadding;
                const maxYCoord = Math.max(...Array.from(nodePositions.values()).map(p => p.y)) + nodeHeight + edgePadding * 2;

                const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                svg.setAttribute('class', 'org-connections');
                svg.setAttribute('width', maxXCoord);
                svg.setAttribute('height', maxYCoord);
                svg.style.position = 'absolute';
                svg.style.left = '0px';
                svg.style.top = '0px';

                connections.forEach(conn => {
                    const parentPos = nodePositions.get(conn.parent.id);
                    const childPos = nodePositions.get(conn.child.id);

                    const lineGap = 3; // 노드와 연결선 사이 간격
                    const x1 = parentPos.x + offsetX + nodeWidth / 2;
                    const y1 = parentPos.y + edgePadding + nodeHeight + lineGap; // 노드 하단에서 3px 아래
                    const x2 = childPos.x + offsetX + nodeWidth / 2;
                    const y2 = childPos.y + edgePadding - lineGap; // 노드 상단에서 3px 위

                    // 곡선 경로 (베지어 곡선)
                    const midY = (y1 + y2) / 2;
                    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    const d = `M ${x1} ${y1} C ${x1} ${midY}, ${x2} ${midY}, ${x2} ${y2}`;
                    path.setAttribute('d', d);

                    // 아바타 노드로 연결되는 선은 특수 스타일 적용
                    const lineClass = conn.child.is_avatar === 1 ? 'connection-line avatar-connection' : 'connection-line';
                    path.setAttribute('class', lineClass);

                    svg.appendChild(path);
                });

                orgChart.appendChild(svg);
            }

            // 노드 렌더링
            nodePositions.forEach((pos, nodeId) => {
                const node = pos.node;
                const depth = Math.round(pos.y / verticalGap);

                const card = document.createElement('div');

                // 클래스 결정
                let cardClasses = 'org-card';
                if (depth === 0) {
                    cardClasses += ' root';
                }

                // 로그인 사용자가 직접 추천한 노드인지 확인
                // referral_id는 숫자 ID이므로 originalRootNode.id와 비교
                const nodeParentForColor = nodeParentMap.get(node.id);
                if (nodeParentForColor && nodeParentForColor.id === originalRootNode.id) {
                    cardClasses += ' direct-referral';
                }

                // 우측 노드인 경우 주황색 테두리 적용
                if (node.sponsor_position === 2) {
                    cardClasses += ' right-position';
                }

                // 아바타 노드인 경우 특수 스타일 적용
                if (node.is_avatar === 1) {
                    cardClasses += ' avatar-node';
                }

                card.className = cardClasses;
                card.style.left = (pos.x + offsetX) + 'px';
                card.style.top = (pos.y + edgePadding) + 'px';
                card.setAttribute('data-node-id', node.id);

                // 아바타는 🤖, 루트는 👑, 일반 회원은 👤
                const emoji = node.is_avatar === 1 ? '🤖' : (depth === 0 ? '👑' : '👤');
                const packageBadge = node.package_code ? `<div class="card-badge">${node.package_code}</div>` : '';

                // sponsor_position에 따른 방향 표시
                const userId = node.user_id || 'Unknown';
                const sponsorPos = node.sponsor_position || 0;
                let positionIndicator = '';
                if (sponsorPos === 1) {
                    positionIndicator = '<div class="card-position left">◀◀</div>'; // 좌측 삼각형 2개
                } else if (sponsorPos === 2) {
                    positionIndicator = '<div class="card-position right">▶▶</div>'; // 우측 삼각형 2개
                }

                // 네비게이션 버튼 표시 여부
                const nodeParent = nodeParentMap.get(node.id);
                const hasParent = nodeParent !== null && nodeParent !== undefined;
                // left/right 또는 children 확인
                const hasChildren = node.left || node.right || (node.children && node.children.length > 0);
                const canGoUp = hasParent && currentRootNode.id !== originalRootNode.id;
                const canGoDown = hasChildren;

                // 조건에 맞는 버튼만 표시
                let navButtons = '';
                if (canGoUp || canGoDown) {
                    const upButton = canGoUp ? '<button class="nav-btn nav-up" title="상위 노드로">▲</button>' : '';
                    const downButton = canGoDown ? '<button class="nav-btn nav-down" title="이 노드를 루트로">▼</button>' : '';

                    if (upButton || downButton) {
                        navButtons = `
                            <div class="nav-buttons">
                                ${upButton}
                                ${downButton}
                            </div>
                        `;
                    }
                }

                // 아바타인 경우 오너 버튼만 표시 (라벨 제거)
                let ownerButton = '';
                if (node.is_avatar === 1 && node.referral_id) {
                    // referral_id로 오너 찾기 (allNodesMap 사용)
                    const ownerNode = allNodesMap.get(node.referral_id);
                    if (ownerNode) {
                        ownerButton = `<button class="avatar-owner-btn" data-owner-id="${ownerNode.id}" title="${ownerNode.user_id}에게 이동">👤</button>`;
                    }
                }

                card.innerHTML = `
                    ${navButtons}
                    <div class="card-avatar">${emoji}</div>
                    <div class="card-user-id">${userId}</div>
                    ${positionIndicator}
                    <div class="card-stats">
                        <span>${node.direct_referrals_count || 0}</span> / $<span>${(node.total_sales || 0).toFixed(0)}</span>
                    </div>
                    ${packageBadge}
                    ${ownerButton}
                `;

                // 네비게이션 버튼 이벤트
                const upBtn = card.querySelector('.nav-up');
                const downBtn = card.querySelector('.nav-down');
                const ownerBtn = card.querySelector('.avatar-owner-btn');

                if (upBtn) {
                    upBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        navigateUp();
                    });
                }

                if (downBtn) {
                    downBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        navigateToNode(node);
                    });
                }

                if (ownerBtn) {
                    ownerBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const ownerId = parseInt(ownerBtn.getAttribute('data-owner-id'));
                        const ownerNode = allNodesMap.get(ownerId);
                        if (ownerNode) {
                            navigateToNode(ownerNode);
                        }
                    });
                }

                // 카드 클릭 - 상세정보 표시
                card.addEventListener('click', () => showDetail(node));

                orgChart.appendChild(card);
            });

            console.log('렌더링 완료');

            // 확장 버튼 추가 (회원만, 더 깊은 단계가 있을 때만)
            if (!isAdmin && actualTreeDepth > maxVisibleDepth) {
                // 5단계 노드의 Y 좌표 (depth는 0부터 시작하므로 depth=4가 5단계)
                const lastVisibleDepth = maxVisibleDepth - 1;
                const lastVisibleY = lastVisibleDepth * verticalGap;
                const buttonHeight = 60; // 버튼 높이 (padding 16px * 2 + font-size 등 고려)
                const buttonTop = lastVisibleY + edgePadding + nodeHeight + (buttonHeight * 2) + 30; // 5단계 노드 하단 + 버튼높이*2 + 30px 여백

                // 차트 전체 너비 계산
                const chartWidth = Math.max(...allX) + offsetX + nodeWidth + edgePadding;

                const expandBtn = document.createElement('button');
                expandBtn.className = 'expand-depth-btn';
                expandBtn.style.top = buttonTop + 'px';
                expandBtn.style.width = chartWidth + 'px';
                expandBtn.innerHTML = `▼ 5단계 더 보기 (현재: ${maxVisibleDepth}단계 / 전체: ${actualTreeDepth}단계)`;
                expandBtn.onclick = expandDepth;
                orgChart.appendChild(expandBtn);
            }

            // 루트 노드를 화면 중앙 상단에 위치시키기
            setTimeout(() => {
                centerRootNode();
            }, 50);

            // 미니맵 업데이트
            setTimeout(() => {
                updateMinimap();
            }, 100);

        // 단계 확장 함수
        function expandDepth() {
            maxVisibleDepth += depthIncrement;
            console.log('단계 확장:', maxVisibleDepth);
            renderOrganizationChart(originalRootNode, currentRootNode);
        }

        // 루트 노드를 화면 중앙 상단에 위치시키는 함수
        function centerRootNode() {
            const orgContainer = document.querySelector('.org-container');
            const orgChart = document.getElementById('orgChart');

            if (!orgContainer || !orgChart || !currentRootNode) return;

            // 루트 노드 카드 찾기
            const rootCard = orgChart.querySelector(`[data-node-id="${currentRootNode.id}"]`);
            if (!rootCard) {
                console.log('루트 노드 카드를 찾을 수 없음:', currentRootNode.id);
                return;
            }

            const containerWidth = orgContainer.clientWidth;

            // 루트 노드의 중앙 X 위치 계산
            const cardCenterX = rootCard.offsetLeft + (rootCard.offsetWidth / 2);

            // 스크롤 위치 계산: 루트 노드가 화면 중앙에 오도록
            const scrollX = cardCenterX - (containerWidth / 2);

            // 상단 여백 (약간의 여백을 두고 상단에 위치)
            const scrollY = 0;

            orgContainer.scrollTo({
                left: Math.max(0, scrollX),
                top: scrollY,
                behavior: 'smooth'
            });

            console.log('루트 노드 중앙 정렬:', currentRootNode.id, 'scrollX:', scrollX, 'cardCenterX:', cardCenterX);
        }

        // 부모 맵 구축 (left/right 구조 지원)
        function buildParentMap(node, parent) {
            nodeParentMap.set(node.id, parent);
            // left/right 구조 지원
            if (node.left) {
                buildParentMap(node.left, node);
            }
            if (node.right) {
                buildParentMap(node.right, node);
            }
            // 하위 호환성: children 배열도 확인
            if (node.children && node.children.length > 0) {
                node.children.forEach(child => {
                    // left/right에서 이미 처리되지 않은 경우만
                    if (child !== node.left && child !== node.right) {
                        buildParentMap(child, node);
                    }
                });
            }
        }

        // 노드를 평면 배열로 변환 (검색용, left/right 구조 지원)
        function flattenNodes(node) {
            if (!node) return;
            allNodesFlat.push(node);
            allNodesMap.set(node.id, node); // ID로 빠른 검색을 위한 Map 저장
            // left/right 구조 지원
            if (node.left) {
                flattenNodes(node.left);
            }
            if (node.right) {
                flattenNodes(node.right);
            }
            // 하위 호환성: children 배열도 확인
            if (node.children && node.children.length > 0) {
                node.children.forEach(child => {
                    // left/right에서 이미 처리되지 않은 경우만
                    if (child !== node.left && child !== node.right) {
                        flattenNodes(child);
                    }
                });
            }
        }

            renderOrganizationChart(originalRootNode, node);

        // 상위 노드로 네비게이션
        function navigateUp() {

            if (parentNode) {
                renderOrganizationChart(originalRootNode, parentNode);

        // 특정 노드 찾기 (전체 트리에서)
        function findNodeById(tree, nodeId) {
            if (tree.id === nodeId) {
                return tree;
            }
            if (tree.children && tree.children.length > 0) {
                for (let child of tree.children) {
                    const found = findNodeById(child, nodeId);
                    if (found) return found;
                }
            }
            return null;
        }

            // Clipboard API 사용
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(userId).then(() => {
                    // 버튼 찾기 및 상태 변경
                    const btn = event.target;
                    const originalText = btn.textContent;
                    const originalBg = btn.style.background;

                    btn.style.color = 'white';

                    setTimeout(() => {
                        btn.textContent = originalText;
                        btn.style.background = originalBg;
                        btn.style.color = originalColor;
                    }, 2000);
                }).catch(err => {
                    console.error('Clipboard API 실패:', err);
                    fallbackCopy(userId);
                });
            } else {
                // Fallback: 임시 input 생성
                fallbackCopy(userId);
            }
        }

        // Fallback 복사 방법
        function fallbackCopy(userId) {
            const tempInput = document.createElement('input');
            tempInput.value = userId;
            tempInput.style.position = 'fixed';
            tempInput.style.left = '-9999px';
            document.body.appendChild(tempInput);
            tempInput.select();
            tempInput.setSelectionRange(0, 99999); // 모바일 지원

            let success = false;
            try {
                success = document.execCommand('copy');
            } catch (e) {
                console.error('execCommand 실패:', e);
            }

            document.body.removeChild(tempInput);

            if (success) {
                const btn = event.target;

                const originalBg = btn.style.background;
                const originalColor = btn.style.color;

                btn.textContent = '✅ 복사 완료!';

        // 미니맵 업데이트
        function updateMinimap() {
            const minimapCanvas = document.getElementById('minimapCanvas');
            const minimapViewport = document.getElementById('minimapViewport');
            const orgContainer = document.querySelector('.org-container');
            const orgChart = document.getElementById('orgChart');

            if (!minimapCanvas || !minimapViewport || !orgContainer || !orgChart) return;

            // 기존 노드 제거
            const existingNodes = minimapCanvas.querySelectorAll('.minimap-node');
            existingNodes.forEach(node => node.remove());

            // 모든 조직도 카드 가져오기
            const orgCards = document.querySelectorAll('.org-card');
            if (orgCards.length === 0) return;

            // orgChart의 실제 컨텐츠 영역 계산 (패딩 포함)
            const orgChartRect = orgChart.getBoundingClientRect();
            const orgChartPadding = 40; // orgChart의 padding 값

            // 조직도 전체 영역 계산 (실제 카드 위치 기준)
            let minX = Infinity, maxX = -Infinity;
            let minY = Infinity, maxY = -Infinity;

            orgCards.forEach(card => {
                const x = parseFloat(card.style.left) || 0;
                const y = parseFloat(card.style.top) || 0;
                const width = card.offsetWidth || 110;
                const height = card.offsetHeight || 80;

                minX = Math.min(minX, x);
                maxX = Math.max(maxX, x + width);
                minY = Math.min(minY, y);
                maxY = Math.max(maxY, y + height);
            });

            // 실제 컨텐츠 영역 크기
            const orgWidth = maxX - minX;
            const orgHeight = maxY - minY;

            // 미니맵 크기
            const minimapWidth = minimapCanvas.clientWidth;
            const minimapHeight = minimapCanvas.clientHeight;

            // 스케일 계산 (여백 포함)
            const scale = Math.min(
                (minimapWidth - 20) / (orgWidth + 100),
                (minimapHeight - 20) / (orgHeight + 100)
            );

            // 오프셋 (중앙 정렬)
            const scaledWidth = orgWidth * scale;
            const scaledHeight = orgHeight * scale;
            const offsetX = (minimapWidth - scaledWidth) / 2;
            const offsetY = (minimapHeight - scaledHeight) / 2;

            // 각 노드를 미니맵에 표시
            orgCards.forEach(card => {
                const x = parseFloat(card.style.left) || 0;
                const y = parseFloat(card.style.top) || 0;

                const minimapNode = document.createElement('div');
                minimapNode.className = 'minimap-node';
                if (card.classList.contains('root')) {
                    minimapNode.classList.add('root');
                }

                // 카드의 실제 위치를 미니맵 좌표로 변환
                const minimapX = ((x - minX) * scale) + offsetX;
                const minimapY = ((y - minY) * scale) + offsetY;

                minimapNode.style.left = minimapX + 'px';
                minimapNode.style.top = minimapY + 'px';

                minimapCanvas.appendChild(minimapNode);
            });

            // 뷰포트 표시를 위한 글로벌 변수 저장
            minimapScale = scale;
            minimapMinX = minX;
            minimapMinY = minY;
            minimapOffsetX = offsetX;
            minimapOffsetY = offsetY;
            minimapOrgWidth = orgWidth;
            minimapOrgHeight = orgHeight;

            updateMinimapViewport(scale, minX, minY, offsetX, offsetY);
        }

        // 미니맵 뷰포트 업데이트
        function updateMinimapViewport(scale, minX, minY, offsetX, offsetY) {
            const minimapViewport = document.getElementById('minimapViewport');
            const orgContainer = document.querySelector('.org-container');
            const orgChart = document.getElementById('orgChart');

            if (!minimapViewport || !orgContainer || !orgChart) return;

            // 현재 스크롤 위치와 보이는 영역
            const scrollLeft = orgContainer.scrollLeft;
            const scrollTop = orgContainer.scrollTop;
            const viewWidth = orgContainer.clientWidth;
            const viewHeight = orgContainer.clientHeight;

            // 전체 스크롤 가능한 크기
            const scrollWidth = orgContainer.scrollWidth;
            const scrollHeight = orgContainer.scrollHeight;

            // 미니맵 캔버스 크기
            const minimapCanvas = document.getElementById('minimapCanvas');
            const minimapWidth = minimapCanvas.clientWidth;
            const minimapHeight = minimapCanvas.clientHeight;

            // 전체 컨텐츠 대비 현재 스크롤 위치의 비율
            const scrollRatioX = scrollWidth > viewWidth ? scrollLeft / (scrollWidth - viewWidth) : 0;
            const scrollRatioY = scrollHeight > viewHeight ? scrollTop / (scrollHeight - viewHeight) : 0;

            // 미니맵에서 뷰포트가 이동 가능한 범위
            const viewportWidth = viewWidth * scale;
            const viewportHeight = viewHeight * scale;

            // 전체 노드 영역의 크기 (미니맵에서)
            const contentWidth = minimapOrgWidth * scale;
            const contentHeight = minimapOrgHeight * scale;

            // 뷰포트가 이동할 수 있는 최대 범위
            const maxViewportX = contentWidth - viewportWidth;
            const maxViewportY = contentHeight - viewportHeight;

            // 스크롤 비율에 따라 뷰포트 위치 계산
            const viewportX = offsetX + (scrollRatioX * maxViewportX);
            const viewportY = offsetY + (scrollRatioY * maxViewportY);

            minimapViewport.style.left = viewportX + 'px';
            minimapViewport.style.top = viewportY + 'px';
            minimapViewport.style.width = viewportWidth + 'px';
            minimapViewport.style.height = viewportHeight + 'px';
        }

        // 스크롤 이벤트 리스너
        let minimapScale, minimapMinX, minimapMinY, minimapOffsetX, minimapOffsetY, minimapOrgWidth, minimapOrgHeight;

        function setupMinimapListeners() {
            const orgContainer = document.querySelector('.org-container');

            if (orgContainer) {
                orgContainer.addEventListener('scroll', () => {
                    if (minimapScale) {
                        updateMinimapViewport(minimapScale, minimapMinX, minimapMinY, minimapOffsetX, minimapOffsetY);
                    }
                });
            }

            // 미니맵 뷰포트 드래그
            const minimapViewport = document.getElementById('minimapViewport');
            const minimapCanvas = document.getElementById('minimapCanvas');

            if (minimapViewport && minimapCanvas) {
                let isDragging = false;

                minimapViewport.addEventListener('mousedown', (e) => {
                    isDragging = true;
                    e.preventDefault();
                });

                minimapCanvas.addEventListener('click', (e) => {
                    const rect = minimapCanvas.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;

                    // 클릭 위치로 스크롤
                    if (minimapScale && orgContainer) {
                        // 미니맵 좌표를 노드 좌표로 변환
                        const nodeX = ((x - minimapOffsetX) / minimapScale) + minimapMinX;
                        const nodeY = ((y - minimapOffsetY) / minimapScale) + minimapMinY;

                        // 노드 좌표를 스크롤 좌표로 변환
                        // visibleStartX = scrollLeft + minX이므로
                        // nodeX = scrollLeft + minX일 때 화면 왼쪽에 보임
                        // 화면 중앙에 보이려면: nodeX = scrollLeft + minX + viewWidth/2
                        const scrollX = nodeX - minimapMinX - orgContainer.clientWidth / 2;
                        const scrollY = nodeY - minimapMinY - orgContainer.clientHeight / 2;

                        orgContainer.scrollTo({
                            left: scrollX,
                            top: scrollY,
                            behavior: 'smooth'
                        });
                    }
                });

                document.addEventListener('mousemove', (e) => {
                    if (isDragging && minimapScale && orgContainer) {
                        const rect = minimapCanvas.getBoundingClientRect();
                        const x = e.clientX - rect.left;
                        const y = e.clientY - rect.top;

                        // 미니맵 좌표를 노드 좌표로 변환
                        const nodeX = ((x - minimapOffsetX) / minimapScale) + minimapMinX;
                        const nodeY = ((y - minimapOffsetY) / minimapScale) + minimapMinY;

                        // 노드 좌표를 스크롤 좌표로 변환
                        const scrollX = nodeX - minimapMinX - orgContainer.clientWidth / 2;
                        const scrollY = nodeY - minimapMinY - orgContainer.clientHeight / 2;

                        orgContainer.scrollLeft = scrollX;
                        orgContainer.scrollTop = scrollY;
                    }
                });

                document.addEventListener('mouseup', () => {
                    isDragging = false;
                });
            }
        }

        // 검색 기능 설정
        function setupSearch() {
            const searchInput = document.getElementById('searchInput');
            const searchResults = document.getElementById('searchResults');

            if (!searchInput) return;

            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase().trim();

                if (query.length < 2) {
                    searchResults.innerHTML = '';
                    return;
                }

                // 검색 실행
                const results = allNodesFlat.filter(node => {
                    const userId = (node.user_id || '').toLowerCase();
                    const name = (node.name || '').toLowerCase();
                    const email = (node.email || '').toLowerCase();

                    return userId.includes(query) || name.includes(query) || email.includes(query);
                });

                // 결과 표시
                if (results.length === 0) {
                    searchResults.innerHTML = '<div class="search-no-results">검색 결과가 없습니다</div>';
                } else {
                    searchResults.innerHTML = results.slice(0, 10).map(node => `
                        <div class="search-result-item" onclick="jumpToNode(${node.id})">
                            <div class="search-result-name">${node.user_id || 'Unknown'}</div>
                            <div class="search-result-email">${node.name || ''} ${node.email ? '• ' + node.email : ''}</div>
                        </div>
                    `).join('');
                }
            });
        }

        // 노드로 점프
        function jumpToNode(nodeId) {
            const node = allNodesFlat.find(n => n.id === nodeId);
            if (node) {
                console.log('Jumping to node:', node.user_id);
                navigateToNode(node);

                // 검색 입력 클리어
                const searchInput = document.getElementById('searchInput');
                const searchResults = document.getElementById('searchResults');
                if (searchInput) searchInput.value = '';
                if (searchResults) searchResults.innerHTML = '';
            }
        }

        // 초기화
        window.addEventListener('DOMContentLoaded', async () => {
            createParticles();
            await checkAdminAuth();

            // 회원 모드일 때도 검색창 활성화
            const token = localStorage.getItem('session_token');
            if (token && !isAdmin) {
                const searchContainer = document.getElementById('searchContainer');
                if (searchContainer) {
                    searchContainer.style.display = 'block';
                }
                setupSearch();
            }

            // 관리자 체크 후 조직도 로드
            await new Promise(resolve => setTimeout(resolve, 100));
            loadOrganizationTree();
            setupMinimapListeners();
        });
    </script>
</body>
</html>
