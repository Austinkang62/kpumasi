<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 테스트</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
            background: #1a1a1a;
            color: #fff;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        input, button {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            font-size: 16px;
        }
        button {
            background: #d4af37;
            border: none;
            cursor: pointer;
            color: #000;
            font-weight: bold;
        }
        #result {
            margin-top: 20px;
            padding: 20px;
            background: #2a2a2a;
            border-radius: 8px;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>로그인 테스트</h1>

        <input type="text" id="userId" placeholder="회원코드 (예: AAA12001)" value="AAA12001">
        <input type="password" id="password" placeholder="비밀번호">
        <button onclick="testLogin()">로그인 테스트</button>

        <div id="result"></div>
    </div>

    <script>
        async function testLogin() {
            const userId = document.getElementById('userId').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('result');

            resultDiv.textContent = '로그인 중...';

            try {
                const response = await fetch('../api/auth/login.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        user_id: userId,
                        password: password
                    })
                });

                const data = await response.json();

                resultDiv.textContent = '=== 로그인 응답 ===\n\n' +
                    JSON.stringify(data, null, 2) + '\n\n';

                if (data.success && data.token) {
                    // 토큰 저장
                    localStorage.setItem('neural_token', data.token);
                    localStorage.setItem('neural_user', JSON.stringify(data.user));

                    resultDiv.textContent += '\n=== localStorage 저장 ===\n\n';
                    resultDiv.textContent += 'neural_token: ' + localStorage.getItem('neural_token') + '\n';
                    resultDiv.textContent += 'neural_user: ' + localStorage.getItem('neural_user') + '\n\n';
                    resultDiv.textContent += '✅ 로그인 성공!\n';
                    resultDiv.textContent += '\n대시보드로 이동: ';

                    const link = document.createElement('a');
                    link.href = 'dashboard.html';
                    link.textContent = 'dashboard.html';
                    link.style.color = '#d4af37';
                    resultDiv.appendChild(link);
                } else {
                    resultDiv.textContent += '\n❌ 로그인 실패: ' + (data.message || '알 수 없는 오류');
                }

            } catch (error) {
                resultDiv.textContent = '❌ 네트워크 오류:\n\n' + error.message;
            }
        }

        // 현재 저장된 토큰 확인
        window.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('neural_token');
            const user = localStorage.getItem('neural_user');

            if (token) {
                document.getElementById('result').textContent =
                    '=== 현재 저장된 정보 ===\n\n' +
                    'Token: ' + token.substring(0, 30) + '...\n' +
                    'User: ' + user;
            }
        });
    </script>
</body>
</html>
