<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard - K-Pumasi Premium</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif;
            background: #0a0e27;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 배경 그라데이션 애니메이션 */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background:
                radial-gradient(circle at 20% 50%, rgba(212, 175, 55, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(120, 80, 200, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 40% 80%, rgba(55, 150, 200, 0.1) 0%, transparent 50%);
            animation: gradientShift 15s ease infinite;
            z-index: 0;
        }

        @keyframes gradientShift {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(-5%, -5%) rotate(5deg); }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 100%;
            padding: 0;
        }

        /* 헤더 */
        .header {
            background: rgba(15, 20, 40, 0.8);
            backdrop-filter: blur(20px);
            padding: 16px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        .logo {
            font-size: 22px;
            font-weight: 900;
            background: linear-gradient(135deg, #d4af37 0%, #f4e5a1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .menu-btn {
            width: 40px;
            height: 40px;
            border: none;
            background: rgba(212, 175, 55, 0.1);
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 4px;
            transition: all 0.3s ease;
        }

        .menu-btn:active {
            transform: scale(0.95);
        }

        .menu-btn span {
            width: 20px;
            height: 2px;
            background: #d4af37;
            border-radius: 2px;
            transition: all 0.3s ease;
        }

        /* 메인 콘텐츠 */
        .main-content {
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 사용자 웰컴 카드 */
        .welcome-card {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.2) 0%, rgba(212, 175, 55, 0.05) 100%);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 24px;
            position: relative;
            overflow: hidden;
        }

        .welcome-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.2) 0%, transparent 70%);
            border-radius: 50%;
            transform: translate(30%, -30%);
        }

        .welcome-text {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 8px;
        }

        .user-id {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #d4af37 0%, #f4e5a1 50%, #d4af37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        /* 잔액 카드 */
        .balance-card {
            background: linear-gradient(135deg, #1a1f3a 0%, #0f1428 100%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 28px;
            margin-bottom: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
        }

        .balance-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.08) 0%, transparent 50%);
            animation: pulse 8s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }

        .balance-header {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            position: relative;
            z-index: 1;
        }

        .balance-amount {
            font-size: 42px;
            font-weight: 900;
            color: #d4af37;
            margin-bottom: 20px;
            text-shadow: 0 4px 20px rgba(212, 175, 55, 0.3);
            position: relative;
            z-index: 1;
        }

        .balance-split {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            position: relative;
            z-index: 1;
        }

        .balance-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 16px;
            transition: all 0.3s ease;
        }

        .balance-item:active {
            transform: scale(0.98);
            background: rgba(255, 255, 255, 0.05);
        }

        .balance-item-label {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .balance-item-amount {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
        }

        /* 통계 그리드 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: rgba(20, 25, 45, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.1) 0%, transparent 50%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .stat-card:active {
            transform: scale(0.97);
        }

        .stat-card:active::before {
            opacity: 1;
        }

        .stat-icon {
            font-size: 32px;
            margin-bottom: 12px;
            filter: drop-shadow(0 2px 8px rgba(212, 175, 55, 0.3));
        }

        .stat-value {
            font-size: 32px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 6px;
            line-height: 1;
        }

        .stat-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.4;
        }

        /* 보너스 타입 섹션 */
        .section-header {
            font-size: 18px;
            font-weight: 700;
            color: #d4af37;
            margin: 32px 0 16px;
            padding: 0 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .bonus-scroll {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            padding: 4px;
            margin: 0 -20px;
            padding: 4px 20px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .bonus-scroll::-webkit-scrollbar {
            display: none;
        }

        .bonus-card {
            min-width: 280px;
            background: linear-gradient(135deg, rgba(20, 25, 45, 0.8) 0%, rgba(15, 20, 35, 0.9) 100%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 24px;
            position: relative;
            overflow: hidden;
        }

        .bonus-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--bonus-color, #d4af37), transparent);
        }

        .bonus-card.referral { --bonus-color: #10B981; }
        .bonus-card.edge { --bonus-color: #3B82F6; }
        .bonus-card.matching { --bonus-color: #8B5CF6; }
        .bonus-card.rollup { --bonus-color: #F59E0B; }

        .bonus-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .bonus-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--bonus-color, #d4af37), rgba(0, 0, 0, 0.2));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        }

        .bonus-info h3 {
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 4px;
        }

        .bonus-info p {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
        }

        .bonus-amount {
            font-size: 36px;
            font-weight: 900;
            color: var(--bonus-color, #d4af37);
            margin-bottom: 6px;
        }

        .bonus-count {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
        }

        /* 액션 버튼 */
        .action-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin: 24px 0;
        }

        .action-btn {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.15) 0%, rgba(212, 175, 55, 0.05) 100%);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 18px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .action-btn:active {
            transform: scale(0.97);
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.25) 0%, rgba(212, 175, 55, 0.1) 100%);
        }

        .action-icon {
            font-size: 32px;
            filter: drop-shadow(0 2px 8px rgba(212, 175, 55, 0.4));
        }

        .action-label {
            font-size: 13px;
            font-weight: 600;
            color: #fff;
        }

        /* 하단 여백 */
        .bottom-spacer {
            height: 40px;
        }

        /* 태블릿 이상 */
        @media (min-width: 768px) {
            .stats-grid {
                grid-template-columns: repeat(4, 1fr);
            }

            .action-grid {
                grid-template-columns: repeat(4, 1fr);
            }

            .bonus-scroll {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                overflow-x: visible;
            }

            .bonus-card {
                min-width: auto;
            }
        }

        /* 로딩 애니메이션 */
        .skeleton {
            background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.05) 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 헤더 -->
        <header class="header">
            <div class="header-content">
                <div class="logo">K-Pumasi</div>
                <button class="menu-btn" onclick="alert('메뉴 열기')">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </header>

        <!-- 메인 콘텐츠 -->
        <main class="main-content">
            <!-- 웰컴 카드 -->
            <div class="welcome-card">
                <div class="welcome-text">환영합니다 👋</div>
                <div class="user-id">USER12345</div>
            </div>

            <!-- 잔액 카드 -->
            <div class="balance-card">
                <div class="balance-header">💰 현재 수익</div>
                <div class="balance-amount">$1,234.56</div>
                <div class="balance-split">
                    <div class="balance-item">
                        <div class="balance-item-label">
                            💵 캐시
                        </div>
                        <div class="balance-item-amount">$800.40</div>
                    </div>
                    <div class="balance-item">
                        <div class="balance-item-label">
                            🤖 포인트
                        </div>
                        <div class="balance-item-amount">$434.16</div>
                    </div>
                </div>
            </div>

            <!-- 통계 그리드 -->
            <div class="stats-grid">
                <div class="stat-card" onclick="alert('추천인 리스트')">
                    <div class="stat-icon">👥</div>
                    <div class="stat-value">12</div>
                    <div class="stat-label">추천인 수</div>
                </div>

                <div class="stat-card" onclick="alert('조직도')">
                    <div class="stat-icon">🌳</div>
                    <div class="stat-value">48</div>
                    <div class="stat-label">산하 회원<br>최대 5단계</div>
                </div>

                <div class="stat-card" onclick="alert('아바타 리스트')">
                    <div class="stat-icon">🤖</div>
                    <div class="stat-value">3</div>
                    <div class="stat-label">아바타 수</div>
                </div>

                <div class="stat-card" onclick="alert('총 수익')">
                    <div class="stat-icon">💎</div>
                    <div class="stat-value">$5.2K</div>
                    <div class="stat-label">총 수익</div>
                </div>
            </div>

            <!-- 보너스 타입 -->
            <div class="section-header">
                💎 보너스 타입별
            </div>
            <div class="bonus-scroll">
                <div class="bonus-card referral">
                    <div class="bonus-header">
                        <div class="bonus-icon">👥</div>
                        <div class="bonus-info">
                            <h3>추천 보너스</h3>
                            <p>직접 추천 25%</p>
                        </div>
                    </div>
                    <div class="bonus-amount">$425</div>
                    <div class="bonus-count">12건</div>
                </div>

                <div class="bonus-card edge">
                    <div class="bonus-header">
                        <div class="bonus-icon">⚡</div>
                        <div class="bonus-info">
                            <h3>엣지 보너스</h3>
                            <p>전환점 25%</p>
                        </div>
                    </div>
                    <div class="bonus-amount">$380</div>
                    <div class="bonus-count">8건</div>
                </div>

                <div class="bonus-card matching">
                    <div class="bonus-header">
                        <div class="bonus-icon">🤝</div>
                        <div class="bonus-info">
                            <h3>매칭 보너스</h3>
                            <p>엣지 매칭 25%</p>
                        </div>
                    </div>
                    <div class="bonus-amount">$215</div>
                    <div class="bonus-count">5건</div>
                </div>

                <div class="bonus-card rollup">
                    <div class="bonus-header">
                        <div class="bonus-icon">📊</div>
                        <div class="bonus-info">
                            <h3>롤업 보너스</h3>
                            <p>레벨당 $1</p>
                        </div>
                    </div>
                    <div class="bonus-amount">$180</div>
                    <div class="bonus-count">25건</div>
                </div>
            </div>

            <!-- 액션 버튼 -->
            <div class="section-header">
                🚀 빠른 액션
            </div>
            <div class="action-grid">
                <div class="action-btn" onclick="alert('출금 신청')">
                    <div class="action-icon">💸</div>
                    <div class="action-label">출금 신청</div>
                </div>

                <div class="action-btn" onclick="alert('추천 링크')">
                    <div class="action-icon">🔗</div>
                    <div class="action-label">추천 링크</div>
                </div>

                <div class="action-btn" onclick="alert('조직도')">
                    <div class="action-icon">🌳</div>
                    <div class="action-label">조직도</div>
                </div>

                <div class="action-btn" onclick="alert('패키지 구매')">
                    <div class="action-icon">🛒</div>
                    <div class="action-label">패키지</div>
                </div>
            </div>

            <div class="bottom-spacer"></div>
        </main>
    </div>

    <script>
        // 실제 데이터 로드 예시
        console.log('Premium Dashboard Sample Loaded');

        // 스크롤 스냅 효과 (선택사항)
        const bonusScroll = document.querySelector('.bonus-scroll');
        if (bonusScroll && window.innerWidth < 768) {
            bonusScroll.style.scrollSnapType = 'x mandatory';
            bonusScroll.querySelectorAll('.bonus-card').forEach(card => {
                card.style.scrollSnapAlign = 'start';
            });
        }
    </script>
</body>
</html>
