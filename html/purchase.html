<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>패키지 구매 - We One</title>
    <link rel="stylesheet" href="../css/k-pumasi-modern.css">
    <script src="../js/auth-check.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        /* 고정 헤더 */
        .dashboard-header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: var(--we1-bg-card);
            backdrop-filter: blur(20px);
            padding: 20px 40px;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.3);
            border-bottom: 2px solid rgba(212, 175, 55, 0.3);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-small {
            width: 50px;
            height: 50px;
            position: relative;
        }

        .logo-small .logo-circle {
            position: absolute;
            border-radius: 50%;
            border: 2px solid transparent;
        }

        .logo-small .logo-circle-1 {
            width: 100%;
            height: 100%;
            border: 2px solid rgba(212, 175, 55, 0.5);
            animation: rotate 8s linear infinite;
        }

        .logo-small .logo-circle-2 {
            width: 70%;
            height: 70%;
            top: 15%;
            left: 15%;
            border: 2px solid rgba(240, 215, 140, 0.5);
            animation: rotate 6s linear infinite reverse;
        }

        .logo-small .logo-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 25px;
            height: 25px;
            background: var(--we1-gradient-primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            color: var(--we1-navy-deep);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.6);
        }

        .brand-text {
            color: var(--we1-text-primary);
            font-size: 24px;
            font-weight: 800;
            font-family: 'Playfair Display', serif;
        }

        .nav-menu {
            display: flex;
            gap: 10px;
        }

        .nav-link {
            padding: 10px 24px;
            background: transparent;
            border-radius: 100px;
            color: var(--we1-text-secondary);
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: var(--we1-transition);
            border: 2px solid transparent;
        }

        .nav-link:hover {
            color: var(--we1-gold);
            border-color: rgba(212, 175, 55, 0.3);
            transform: translateY(-2px);
        }

        .nav-link.active {
            background: var(--we1-gradient-primary);
            color: var(--we1-navy-deep);
            border-color: transparent;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }

        /* 메인 컨테이너 */
        .main-container {
            position: relative;
            z-index: 10;
            max-width: 1000px;
            margin: 0 auto;
            padding: 60px 40px;
        }

        .page-title {
            font-size: 36px;
            font-weight: 800;
            font-family: 'Playfair Display', serif;
            text-align: center;
            margin-bottom: 15px;
            background: var(--we1-gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .page-subtitle {
            text-align: center;
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            color: var(--we1-text-secondary);
            margin-bottom: 50px;
        }

        /* 알림 메시지 */
        .alert {
            padding: 16px 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            display: none;
            text-align: center;
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #6EE7B7;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #FCA5A5;
        }

        /* 패키지 카드 */
        .packages-grid {
            display: flex;
            justify-content: center;
            margin-bottom: 50px;
        }

        .package-card {
            background: var(--we1-bg-card);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(212, 175, 55, 0.3);
            border-radius: 24px;
            padding: 40px;
            cursor: pointer;
            transition: var(--we1-transition);
            position: relative;
            overflow: hidden;
            max-width: 450px;
            width: 100%;
        }

        .package-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--we1-gradient-primary);
            z-index: 0;
        }

        .package-card::after {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200px;
            height: 200px;
            background: var(--we1-gradient-subtle);
            border-radius: 50%;
            z-index: 0;
            transition: var(--we1-transition);
        }

        .package-card:hover::after {
            top: -25%;
            right: -25%;
        }

        .package-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 60px rgba(212, 175, 55, 0.3);
            border-color: var(--we1-gold);
        }

        .package-card.selected {
            border-color: var(--we1-gold);
            box-shadow: 0 20px 60px rgba(212, 175, 55, 0.35);
            background: var(--we1-bg-card-alt);
        }

        .package-card > * {
            position: relative;
            z-index: 1;
        }

        .package-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .package-icon {
            width: 70px;
            height: 70px;
            background: var(--we1-gradient-primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.4);
        }

        .package-card.premium .package-icon {
            background: var(--we1-gradient-gold-shine);
        }

        .package-check {
            width: 32px;
            height: 32px;
            border: 2px solid rgba(212, 175, 55, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--we1-transition);
        }

        .package-card.selected .package-check {
            background: var(--we1-gold);
            border-color: var(--we1-gold);
        }

        .package-check::after {
            content: '✓';
            color: var(--we1-navy-deep);
            font-size: 18px;
            font-weight: bold;
            opacity: 0;
            transition: var(--we1-transition);
        }

        .package-card.selected .package-check::after {
            opacity: 1;
        }

        .package-name {
            font-size: 24px;
            font-weight: 700;
            font-family: 'Playfair Display', serif;
            color: var(--we1-text-primary);
            margin-bottom: 8px;
        }

        .package-price {
            font-size: 40px;
            font-weight: 800;
            font-family: 'Playfair Display', serif;
            background: var(--we1-gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .package-price span {
            font-size: 20px;
        }

        .package-desc {
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            color: var(--we1-text-secondary);
        }

        /* 결제 섹션 */
        .payment-section {
            background: var(--we1-bg-card);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px;
            box-shadow: var(--we1-shadow-md);
            border: 2px solid rgba(212, 175, 55, 0.3);
            position: relative;
            overflow: hidden;
        }

        .payment-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--we1-gradient-primary);
        }

        .section-title {
            font-size: 24px;
            font-weight: 700;
            font-family: 'Playfair Display', serif;
            color: var(--we1-text-primary);
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            color: var(--we1-text-primary);
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid rgba(212, 175, 55, 0.3);
            border-radius: 12px;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            transition: var(--we1-transition);
            background: rgba(255, 255, 255, 0.05);
            color: var(--we1-text-primary);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--we1-gold);
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.15);
            background: rgba(255, 255, 255, 0.08);
        }

        .form-input:read-only {
            background: rgba(0, 0, 0, 0.2);
            font-family: monospace;
            color: var(--we1-gold);
        }

        /* 입금 주소 영역 */
        .deposit-address-box {
            background: rgba(212, 175, 55, 0.1);
            border: 2px solid rgba(212, 175, 55, 0.4);
            border-radius: 16px;
            padding: 20px;
        }

        .payment-method-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 20px;
            background: var(--we1-gradient-primary);
            border-radius: 100px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            color: var(--we1-navy-deep);
            margin-bottom: 16px;
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
        }

        .payment-method-badge span:first-child {
            font-size: 24px;
        }

        .address-input-group {
            display: flex;
            gap: 10px;
        }

        .copy-button {
            padding: 14px 24px;
            background: var(--we1-gradient-primary);
            color: var(--we1-navy-deep);
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: var(--we1-transition);
            white-space: nowrap;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }

        .copy-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
        }

        .copy-button.success {
            background: #10B981;
            color: white;
        }

        .warning-text {
            color: var(--we1-text-secondary);
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            margin-top: 12px;
        }

        /* 네트워크 선택 버튼 */
        .network-button {
            flex: 1;
            padding: 14px 20px;
            background: transparent;
            color: var(--we1-text-secondary);
            border: 2px solid rgba(212, 175, 55, 0.3);
            border-radius: 12px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: var(--we1-transition);
            font-size: 14px;
        }

        .network-button:hover {
            border-color: var(--we1-gold);
            color: var(--we1-gold);
            transform: translateY(-2px);
        }

        .network-button.active {
            background: var(--we1-gradient-primary);
            color: var(--we1-navy-deep);
            border-color: transparent;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }

        /* 검증 버튼 */
        .verify-button {
            padding: 14px 24px;
            background: transparent;
            color: var(--we1-gold);
            border: 2px solid var(--we1-gold);
            border-radius: 12px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: var(--we1-transition);
            white-space: nowrap;
        }

        .verify-button:hover {
            background: var(--we1-gold);
            color: var(--we1-navy-deep);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
        }

        .verify-button:disabled {
            background: #4A4A4A;
            color: #8E8E93;
            border-color: #4A4A4A;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* 검증 결과 */
        .txid-result {
            display: none;
            margin-top: 16px;
            padding: 20px;
            border-radius: 12px;
        }

        .txid-result.success {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .txid-result.error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .result-title {
            font-size: 18px;
            font-weight: 700;
            font-family: 'Playfair Display', serif;
            margin-bottom: 12px;
        }

        .result-title.success {
            color: #6EE7B7;
        }

        .result-title.error {
            color: #FCA5A5;
        }

        .result-details {
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            line-height: 1.8;
            color: var(--we1-text-primary);
        }

        .result-details p {
            margin: 6px 0;
        }

        .result-details strong {
            color: var(--we1-gold);
        }

        .result-details a {
            color: var(--we1-gold);
            text-decoration: none;
            font-weight: 600;
        }

        .result-details a:hover {
            text-decoration: underline;
        }

        /* 구매 버튼 */
        .purchase-button {
            width: 100%;
            padding: 18px;
            background: var(--we1-gradient-primary);
            color: var(--we1-navy-deep);
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: var(--we1-transition);
            box-shadow: 0 6px 25px rgba(212, 175, 55, 0.4);
            margin-top: 30px;
            position: relative;
            overflow: hidden;
        }

        .purchase-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.6s;
        }

        .purchase-button:hover:not(:disabled)::before {
            left: 100%;
        }

        .purchase-button:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 10px 35px rgba(212, 175, 55, 0.5);
        }

        .purchase-button:active:not(:disabled) {
            transform: translateY(-1px);
        }

        .purchase-button:disabled {
            background: #4A4A4A;
            color: #8E8E93;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* 반응형 */
        @media (max-width: 768px) {
            .dashboard-header {
                padding: 15px 20px;
            }

            .nav-menu {
                display: none;
            }

            .main-container {
                padding: 40px 20px;
            }

            .packages-grid {
                grid-template-columns: 1fr;
            }

            .payment-section {
                padding: 30px 20px;
            }

            .address-input-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <!-- 배경 -->
    <div class="kpumasi-background">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div id="particles"></div>
    </div>

    <!-- 헤더 -->
    <header class="dashboard-header">
        <div class="header-content">
            <div class="logo-section">
                <div class="logo-small">
                    <div class="logo-circle logo-circle-1"></div>
                    <div class="logo-circle logo-circle-2"></div>
                    <div class="logo-center">W1</div>
                </div>
                <div class="brand-text">We One</div>
            </div>

            <nav class="nav-menu">
                <a href="dashboard.html" class="nav-link">대시보드</a>
                <a href="organization.html" class="nav-link">조직도</a>
                <a href="purchase.html" class="nav-link active">패키지</a>
                <a href="withdrawal.html" class="nav-link">출금</a>
                <a href="#" class="nav-link" onclick="logout()">로그아웃</a>
            </nav>
        </div>
    </header>

    <!-- 메인 컨테이너 -->
    <div class="main-container fade-in-up">
        <h1 class="page-title">패키지 구매</h1>
        <p class="page-subtitle">원하는 패키지를 선택하고 USDT로 결제하세요</p>

        <!-- 알림 메시지 -->
        <div id="message" class="alert"></div>

        <!-- 패키지 선택 -->
        <div class="packages-grid">
            <!-- 스탠다드 패키지 -->
            <div class="package-card premium selected" data-package="PKG_100" data-price="100">
                <div class="package-header">
                    <div class="package-icon">💎</div>
                    <div class="package-check"></div>
                </div>
                <h3 class="package-name">스탠다드 패키지</h3>
                <div class="package-price">$100<span> USDT</span></div>
                <p class="package-desc">K-Pumasi 표준 패키지</p>
            </div>
        </div>

        <!-- 결제 정보 -->
        <div class="payment-section">
            <h2 class="section-title">결제 정보</h2>

            <!-- 입금 주소 -->
            <div class="form-group">
                <label class="form-label">입금 방법</label>

                <!-- 네트워크 선택 -->
                <div style="display: flex; gap: 12px; margin-bottom: 16px;">
                    <button type="button" class="network-button active" data-network="trc20" onclick="selectNetwork('trc20')">
                        USDT (TRC20)
                    </button>
                    <button type="button" class="network-button" data-network="bsc" onclick="selectNetwork('bsc')">
                        USDT (BNB Smart Chain)
                    </button>
                </div>

                <div class="deposit-address-box">
                    <div class="payment-method-badge" id="paymentMethodBadge">
                        <span>💰</span>
                        <span id="networkName">USDT (TRC20)</span>
                    </div>

                    <label class="form-label">입금 주소</label>
                    <div class="address-input-group">
                        <input type="text" id="depositAddress" class="form-input" value="" placeholder="주소 로딩 중..." readonly>
                        <button type="button" class="copy-button" onclick="copyDepositAddress()">복사</button>
                    </div>

                    <p class="warning-text" id="warningText">
                        ⚠️ 반드시 TRC20 네트워크를 사용하여 USDT를 입금해주세요.<br>
                        다른 네트워크로 입금 시 자산을 잃을 수 있습니다.
                    </p>
                </div>
            </div>

            <!-- 결제 금액 -->
            <div class="form-group">
                <label class="form-label" id="paymentAmountLabel">결제 금액 (USDT)</label>
                <input type="number" id="paymentAmount" class="form-input" step="0.01" placeholder="패키지 선택 시 자동 입력">
                <p class="warning-text" id="paymentAmountHint">패키지 선택 시 자동 입력됩니다</p>
            </div>

            <!-- 트랜잭션 TXID -->
            <div class="form-group">
                <label class="form-label" id="txidLabel">트랜잭션 TXID</label>
                <div class="address-input-group">
                    <input type="text" id="transactionId" class="form-input" placeholder="USDT 트랜잭션 해시 입력" id="txidInput">
                    <button type="button" class="verify-button" onclick="verifyTxid()">검증</button>
                </div>
                <p class="warning-text" id="txidHint" style="margin-top: 8px; margin-bottom: 0;"></p>
                <div id="txidResult" class="txid-result"></div>
            </div>

            <!-- 메모 -->
            <div class="form-group">
                <label class="form-label">메모 (선택사항)</label>
                <input type="text" id="note" class="form-input" placeholder="추가 메모를 입력하세요">
            </div>

            <!-- 구매 버튼 -->
            <button id="purchaseButton" class="purchase-button" disabled>
                패키지를 선택해주세요
            </button>
        </div>
    </div>

    <script>
        // 파티클 생성
        function createParticles() {
            const container = document.getElementById('particles');
            if (!container) return;

            const particleCount = 20;
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (10 + Math.random() * 10) + 's';
                container.appendChild(particle);
            }
        }

        // 전역 변수
        let selectedPackage = 'PKG_100';
        let selectedPrice = 100;
        let isTxidVerified = false;
        let verifiedTxid = null;

        // 구매 버튼 상태 업데이트
        function updatePurchaseButton() {
            const button = document.getElementById('purchaseButton');

            if (selectedPackage && isTxidVerified) {
                button.disabled = false;
                button.textContent = '구매하기';
            } else if (!selectedPackage) {
                button.disabled = true;
                button.textContent = '패키지를 선택해주세요';
            } else if (!isTxidVerified) {
                button.disabled = true;
                button.textContent = 'TXID 검증이 필요합니다';
            }
        }

        // 입금 주소 복사
        function copyDepositAddress() {
            const address = document.getElementById('depositAddress').value;
            const button = event.target;

            navigator.clipboard.writeText(address).then(() => {
                const originalText = button.textContent;
                button.textContent = '✓ 복사됨';
                button.classList.add('success');

                setTimeout(() => {
                    button.textContent = originalText;
                    button.classList.remove('success');
                }, 2000);
            }).catch(err => {
                console.error('복사 실패:', err);
                showMessage('주소 복사에 실패했습니다', 'error');
            });
        }

        // 패키지 선택
        document.querySelectorAll('.package-card').forEach(card => {
            card.addEventListener('click', function() {
                // 모든 카드에서 selected 제거
                document.querySelectorAll('.package-card').forEach(c => c.classList.remove('selected'));

                // 현재 카드 선택
                this.classList.add('selected');

                selectedPackage = this.dataset.package;
                selectedPrice = parseFloat(this.dataset.price);

                // 결제 금액 입력란 업데이트
                document.getElementById('paymentAmount').value = selectedPrice;

                // 버튼 상태 업데이트
                updatePurchaseButton();
            });
        });

        // TXID 검증
        async function verifyTxid() {
            const txid = document.getElementById('transactionId').value.trim();
            const resultDiv = document.getElementById('txidResult');
            const button = event.target;
            const amountInput = document.getElementById('paymentAmount');
            const amount = parseFloat(amountInput.value);

            if (!txid) {
                resultDiv.style.display = 'block';
                resultDiv.className = 'txid-result error';
                resultDiv.innerHTML = '<div class="result-title error">❌ 검증 실패</div><div class="result-details">TXID를 입력하세요</div>';
                return;
            }

            if (!amount || amount <= 0) {
                resultDiv.style.display = 'block';
                resultDiv.className = 'txid-result error';
                resultDiv.innerHTML = '<div class="result-title error">❌ 검증 실패</div><div class="result-details">패키지를 선택하거나 금액을 입력하세요</div>';
                return;
            }

            // 버튼 비활성화
            button.disabled = true;
            button.textContent = '검증 중...';

            try {
                const response = await fetch('../api/payment/auto-verify.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        sale_id: 0,
                        txid: txid,
                        expected_amount: amount
                    })
                });

                const data = await response.json();
                resultDiv.style.display = 'block';

                if (data.success) {
                    // TXID 검증 성공
                    isTxidVerified = true;
                    verifiedTxid = data.data.txid;
                    updatePurchaseButton();

                    resultDiv.className = 'txid-result success';
                    resultDiv.innerHTML = `
                        <div class="result-title success">✅ 검증 성공!</div>
                        <div class="result-details">
                            <p><strong>TXID:</strong> ${data.data.txid}</p>
                            <p><strong>금액:</strong> $${data.data.amount} USDT</p>
                            <p><strong>상태:</strong> 승인됨</p>
                            <p style="margin-top: 10px;">
                                <a href="${data.data.tronscan_url}" target="_blank">
                                    🔗 Tronscan에서 확인
                                </a>
                            </p>
                        </div>
                    `;
                } else {
                    // 검증 실패
                    isTxidVerified = false;
                    verifiedTxid = null;
                    updatePurchaseButton();

                    resultDiv.className = 'txid-result error';
                    resultDiv.innerHTML = `
                        <div class="result-title error">❌ 검증 실패</div>
                        <div class="result-details">${data.message}</div>
                    `;
                }
            } catch (error) {
                resultDiv.style.display = 'block';
                resultDiv.className = 'txid-result error';
                resultDiv.innerHTML = `
                    <div class="result-title error">❌ 오류</div>
                    <div class="result-details">${error.message}</div>
                `;
            } finally {
                button.disabled = false;
                button.textContent = '검증';
            }
        }

        // 구매 버튼 클릭
        document.getElementById('purchaseButton').addEventListener('click', async function() {
            if (!selectedPackage) {
                showMessage('패키지를 선택해주세요', 'error');
                return;
            }

            if (!isTxidVerified) {
                showMessage('TXID 검증이 필요합니다', 'error');
                return;
            }

            // 토큰 확인
            const token = localStorage.getItem('authToken') || sessionStorage.getItem('authToken');
            if (!token) {
                showMessage('로그인이 필요합니다', 'error');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1500);
                return;
            }

            // URL 파라미터에서 user_id 읽기
            const urlParams = new URLSearchParams(window.location.search);
            const targetUserId = urlParams.get('user_id');
            const transactionId = verifiedTxid;
            const note = document.getElementById('note').value;

            // 버튼 비활성화
            this.disabled = true;
            this.textContent = '처리 중...';

            try {
                const requestData = {
                    product_code: selectedPackage,
                    quantity: 1,
                    payment_method: 'usdt',
                    transaction_id: transactionId,
                    note: note
                };

                if (targetUserId) {
                    requestData.target_user_id = targetUserId;
                }

                const response = await fetch('../api/sales/purchase.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify(requestData)
                });

                const result = await response.json();

                if (result.success) {
                    const successMsg = targetUserId
                        ? `✅ "${targetUserId}" 회원의 패키지 구매가 완료되었습니다!`
                        : '✅ 패키지 구매가 완료되었습니다!';

                    showMessage(successMsg, 'success');
                    alert(successMsg);

                    setTimeout(() => {
                        if (window.opener !== null) {
                            if (window.opener && !window.opener.closed) {
                                window.opener.location.reload();
                            }
                            window.close();
                        } else {
                            window.location.href = 'dashboard.html';
                        }
                    }, 2000);
                } else {
                    showMessage(result.message || '구매에 실패했습니다', 'error');
                    this.disabled = false;
                    this.textContent = '구매하기';
                }
            } catch (error) {
                console.error('Purchase error:', error);
                showMessage('네트워크 오류가 발생했습니다', 'error');
                this.disabled = false;
                this.textContent = '구매하기';
            }
        });

        // 메시지 표시
        function showMessage(text, type) {
            const messageEl = document.getElementById('message');
            messageEl.textContent = text;
            messageEl.className = `alert alert-${type}`;
            messageEl.style.display = 'block';

            setTimeout(() => {
                messageEl.style.display = 'none';
            }, 5000);
        }

        // 로그아웃
        function logout() {
            localStorage.removeItem('authToken');
            sessionStorage.removeItem('authToken');
            window.location.href = 'login.html';
        }

        // 네트워크 선택
        let selectedNetwork = 'trc20';
        const networkData = {
            trc20: {
                name: 'USDT (TRC20)',
                address: '',  // 동적 로드
                warning: '⚠️ 반드시 TRC20 네트워크를 사용하여 USDT를 입금해주세요.<br>다른 네트워크로 입금 시 자산을 잃을 수 있습니다.',
                paymentLabel: '결제 금액 (USDT - TRC20)',
                txidLabel: '트랜잭션 TXID (TRC20)',
                txidPlaceholder: 'TRC20 트랜잭션 해시 입력 (64자리)',
                txidHint: '💡 TRC20 트랜잭션 해시는 64자리 16진수입니다'
            },
            bsc: {
                name: 'USDT (BNB Smart Chain)',
                address: '',  // 동적 로드
                warning: '⚠️ 반드시 BNB Smart Chain (BEP20) 네트워크를 사용하여 USDT를 입금해주세요.<br>다른 네트워크로 입금 시 자산을 잃을 수 있습니다.',
                paymentLabel: '결제 금액 (USDT - BEP20)',
                txidLabel: '트랜잭션 Hash (BSC)',
                txidPlaceholder: 'BSC 트랜잭션 해시 입력 (0x...)',
                txidHint: '💡 BSC 트랜잭션 해시는 0x로 시작하는 66자리입니다'
            }
        };

        function selectNetwork(network) {
            selectedNetwork = network;

            // 버튼 상태 변경
            document.querySelectorAll('.network-button').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`[data-network="${network}"]`).classList.add('active');

            // 네트워크 정보 업데이트
            const data = networkData[network];
            document.getElementById('networkName').textContent = data.name;
            document.getElementById('depositAddress').value = data.address;
            document.getElementById('warningText').innerHTML = data.warning;

            // 결제 금액 라벨 업데이트
            document.getElementById('paymentAmountLabel').textContent = data.paymentLabel;

            // TXID 관련 필드 업데이트
            document.getElementById('txidLabel').textContent = data.txidLabel;
            document.getElementById('transactionId').placeholder = data.txidPlaceholder;
            document.getElementById('txidHint').textContent = data.txidHint;

            // TXID 입력 필드 초기화
            document.getElementById('transactionId').value = '';
            const txidResult = document.getElementById('txidResult');
            txidResult.style.display = 'none';
            isTxidVerified = false;
            verifiedTxid = null;
            updatePurchaseButton();
        }

        // TXID 입력 시 자동 포맷팅
        document.getElementById('transactionId').addEventListener('input', (e) => {
            const value = e.target.value.toLowerCase();

            if (value === 'demo' || value === 'test' ||
                'demo'.startsWith(value) || 'test'.startsWith(value)) {
                e.target.value = value;
            } else {
                e.target.value = value.replace(/[^a-f0-9]/g, '');
            }
        });

        // 지갑 주소 불러오기
        async function loadWalletAddresses() {
            try {
                const response = await fetch('../api/public/wallet-addresses.php');
                const data = await response.json();

                if (data.success) {
                    // 지갑 주소 설정
                    networkData.trc20.address = data.data.trc20_usdt_address || 'THafBjzPmaPQdQcLS1Fmp6sh7dYgYY1bq4';
                    networkData.bsc.address = data.data.bsc_usdt_address || '0x5f4b1ad7b0b55998f84e4fae5f589bde43cff3f3';

                    // 현재 선택된 네트워크 주소 업데이트
                    const currentData = networkData[selectedNetwork];
                    document.getElementById('depositAddress').value = currentData.address;
                }
            } catch (error) {
                console.error('지갑 주소 로드 오류:', error);
                // 기본값 사용
                networkData.trc20.address = 'THafBjzPmaPQdQcLS1Fmp6sh7dYgYY1bq4';
                networkData.bsc.address = '0x5f4b1ad7b0b55998f84e4fae5f589bde43cff3f3';
                document.getElementById('depositAddress').value = networkData[selectedNetwork].address;
            }
        }

        // 초기화
        window.addEventListener('DOMContentLoaded', async () => {
            createParticles();

            // 지갑 주소 로드
            await loadWalletAddresses();

            // URL 파라미터에서 memo 읽기
            const urlParams = new URLSearchParams(window.location.search);
            const memo = urlParams.get('memo');
            if (memo) {
                document.getElementById('note').value = memo;
            }

            // 패키지 자동 선택 (이미 HTML에서 selected 클래스로 선택됨)
            document.getElementById('paymentAmount').value = selectedPrice;
            updatePurchaseButton();
        });
    </script>
</body>
</html>
