<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>보너스 대시보드 - 품앗이</title>
    <link rel="stylesheet" href="../css/we1-theme.css">
    <style>
        body {
            background: var(--we1-bg-primary);
            color: var(--we1-text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 20px;
            min-height: 100vh;
        }

        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .page-title {
            font-size: 32px;
            font-weight: 700;
            color: var(--we1-gold);
            margin-bottom: 30px;
            text-align: center;
        }

        /* 보너스 요약 카드 */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .summary-card {
            background: var(--we1-bg-card);
            border: 2px solid rgba(212, 175, 55, 0.3);
            border-radius: 16px;
            padding: 24px;
            position: relative;
            overflow: hidden;
        }

        .summary-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--we1-gradient-primary);
        }

        .summary-label {
            font-size: 13px;
            color: var(--we1-text-secondary);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .summary-value {
            font-size: 28px;
            font-weight: 800;
            color: var(--we1-gold);
            margin-bottom: 4px;
        }

        .summary-count {
            font-size: 12px;
            color: var(--we1-text-muted);
        }

        /* 보너스 타입별 카드 */
        .bonus-types {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .bonus-type-card {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.05), rgba(16, 21, 62, 0.3));
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 12px;
            padding: 20px;
        }

        .bonus-type-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .bonus-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .bonus-icon.referral { background: linear-gradient(135deg, #10B981, #059669); }
        .bonus-icon.edge { background: linear-gradient(135deg, #3B82F6, #2563EB); }
        .bonus-icon.matching { background: linear-gradient(135deg, #8B5CF6, #7C3AED); }
        .bonus-icon.rollup { background: linear-gradient(135deg, #F59E0B, #D97706); }

        .bonus-type-name {
            font-size: 16px;
            font-weight: 600;
            color: var(--we1-text-primary);
        }

        .bonus-type-desc {
            font-size: 12px;
            color: var(--we1-text-secondary);
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .bonus-type-amount {
            font-size: 24px;
            font-weight: 700;
            color: var(--we1-gold);
        }

        .bonus-type-count {
            font-size: 11px;
            color: var(--we1-text-muted);
        }

        /* 보너스 내역 테이블 */
        .history-section {
            background: var(--we1-bg-card);
            border: 2px solid rgba(212, 175, 55, 0.2);
            border-radius: 16px;
            padding: 30px;
        }

        .history-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--we1-gold);
            margin-bottom: 20px;
        }

        .history-table {
            width: 100%;
            border-collapse: collapse;
        }

        .history-table th {
            background: rgba(212, 175, 55, 0.1);
            padding: 12px 16px;
            text-align: left;
            font-size: 12px;
            font-weight: 600;
            color: var(--we1-text-secondary);
            border-bottom: 2px solid rgba(212, 175, 55, 0.3);
        }

        .history-table td {
            padding: 16px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.1);
            font-size: 13px;
        }

        .history-table tr:hover {
            background: rgba(212, 175, 55, 0.05);
        }

        .bonus-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }

        .bonus-badge.referral {
            background: rgba(16, 185, 129, 0.2);
            color: #10B981;
        }

        .bonus-badge.edge {
            background: rgba(59, 130, 246, 0.2);
            color: #3B82F6;
        }

        .bonus-badge.matching {
            background: rgba(139, 92, 246, 0.2);
            color: #8B5CF6;
        }

        .bonus-badge.rollup {
            background: rgba(245, 158, 11, 0.2);
            color: #F59E0B;
        }

        .amount-positive {
            color: #10B981;
            font-weight: 600;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--we1-text-secondary);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        @media (max-width: 768px) {
            .history-table {
                font-size: 12px;
            }

            .history-table th,
            .history-table td {
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <h1 class="page-title">💰 보너스 대시보드</h1>

        <!-- 보너스 요약 -->
        <div class="summary-grid">
            <div class="summary-card">
                <div class="summary-label">💎 총 보너스</div>
                <div class="summary-value" id="totalBonus">$0</div>
                <div class="summary-count" id="totalCount">0건</div>
            </div>

            <div class="summary-card">
                <div class="summary-label">✅ 출금 가능 보너스</div>
                <div class="summary-value" id="availableBonus">$0</div>
                <div class="summary-count">즉시 출금 가능</div>
            </div>

            <div class="summary-card">
                <div class="summary-label">📅 최근 보너스</div>
                <div class="summary-value" style="font-size: 18px;" id="lastBonusAt">-</div>
                <div class="summary-count">마지막 수령일</div>
            </div>
        </div>

        <!-- 보너스 타입별 -->
        <div class="bonus-types">
            <div class="bonus-type-card">
                <div class="bonus-type-header">
                    <div class="bonus-icon referral">👥</div>
                    <div>
                        <div class="bonus-type-name">추천 보너스</div>
                        <div class="bonus-type-desc">직접 추천한 회원의 25%</div>
                    </div>
                </div>
                <div class="bonus-type-amount" id="referralAmount">$0</div>
                <div class="bonus-type-count" id="referralCount">0건</div>
            </div>

            <div class="bonus-type-card">
                <div class="bonus-type-header">
                    <div class="bonus-icon edge">⚡</div>
                    <div>
                        <div class="bonus-type-name">엣지 보너스</div>
                        <div class="bonus-type-desc">바이너리 트리 전환점 25%</div>
                    </div>
                </div>
                <div class="bonus-type-amount" id="edgeAmount">$0</div>
                <div class="bonus-type-count" id="edgeCount">0건</div>
            </div>

            <div class="bonus-type-card">
                <div class="bonus-type-header">
                    <div class="bonus-icon matching">🤝</div>
                    <div>
                        <div class="bonus-type-name">추천매칭 보너스</div>
                        <div class="bonus-type-desc">엣지 보너스 매칭 25%</div>
                    </div>
                </div>
                <div class="bonus-type-amount" id="matchingAmount">$0</div>
                <div class="bonus-type-count" id="matchingCount">0건</div>
            </div>

            <div class="bonus-type-card">
                <div class="bonus-type-header">
                    <div class="bonus-icon rollup">📊</div>
                    <div>
                        <div class="bonus-type-name">롤업 보너스</div>
                        <div class="bonus-type-desc">후원 계보 25단계 × 1%</div>
                    </div>
                </div>
                <div class="bonus-type-amount" id="rollupAmount">$0</div>
                <div class="bonus-type-count" id="rollupCount">0건</div>
            </div>
        </div>

        <!-- 보너스 내역 -->
        <div class="history-section">
            <h2 class="history-title">📜 보너스 내역</h2>

            <div id="historyContent">
                <div class="empty-state">
                    <div class="empty-state-icon">⏳</div>
                    <div>보너스 내역을 불러오는 중...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 보너스 데이터 로드
        async function loadBonusData() {
            try {
                const response = await fetch('../api/bonus/get-bonus-history.php');
                const result = await response.json();

                if (!result.success) {
                    showError(result.message);
                    return;
                }

                const { summary, history } = result.data;

                // 요약 데이터 표시
                if (summary) {
                    document.getElementById('totalBonus').textContent = '$' + parseFloat(summary.total_bonus || 0).toFixed(2);
                    document.getElementById('totalCount').textContent =
                        (parseInt(summary.referral_count || 0) +
                         parseInt(summary.edge_count || 0) +
                         parseInt(summary.matching_count || 0) +
                         parseInt(summary.rollup_count || 0)) + '건';

                    // 사용자 테이블에서 available_bonus 가져오기 (별도 API 필요)
                    document.getElementById('availableBonus').textContent = '$' + parseFloat(summary.total_bonus || 0).toFixed(2);

                    document.getElementById('lastBonusAt').textContent = summary.last_bonus_at
                        ? new Date(summary.last_bonus_at).toLocaleDateString('ko-KR')
                        : '-';

                    // 타입별 보너스
                    document.getElementById('referralAmount').textContent = '$' + parseFloat(summary.total_referral_bonus || 0).toFixed(2);
                    document.getElementById('referralCount').textContent = (summary.referral_count || 0) + '건';

                    document.getElementById('edgeAmount').textContent = '$' + parseFloat(summary.total_edge_bonus || 0).toFixed(2);
                    document.getElementById('edgeCount').textContent = (summary.edge_count || 0) + '건';

                    document.getElementById('matchingAmount').textContent = '$' + parseFloat(summary.total_matching_bonus || 0).toFixed(2);
                    document.getElementById('matchingCount').textContent = (summary.matching_count || 0) + '건';

                    document.getElementById('rollupAmount').textContent = '$' + parseFloat(summary.total_rollup_bonus || 0).toFixed(2);
                    document.getElementById('rollupCount').textContent = (summary.rollup_count || 0) + '건';
                }

                // 내역 테이블 생성
                displayHistory(history);

            } catch (error) {
                console.error('보너스 데이터 로드 오류:', error);
                showError('보너스 데이터를 불러올 수 없습니다.');
            }
        }

        // 보너스 내역 표시
        function displayHistory(history) {
            const contentDiv = document.getElementById('historyContent');

            if (!history || history.length === 0) {
                contentDiv.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <div>아직 보너스 내역이 없습니다.</div>
                    </div>
                `;
                return;
            }

            let tableHTML = `
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>날짜</th>
                            <th>보너스 종류</th>
                            <th>금액</th>
                            <th>발생 회원</th>
                            <th>상세</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            history.forEach(item => {
                const date = new Date(item.created_at).toLocaleDateString('ko-KR', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit'
                });

                tableHTML += `
                    <tr>
                        <td>${date}</td>
                        <td><span class="bonus-badge ${item.bonus_type}">${item.bonus_name}</span></td>
                        <td class="amount-positive">+$${parseFloat(item.amount).toFixed(2)}</td>
                        <td>${item.from_user_code || '-'}</td>
                        <td style="font-size: 11px; color: var(--we1-text-muted);">
                            ${item.description || '-'}
                            ${item.level ? ` (레벨 ${item.level})` : ''}
                            ${item.edge_position ? ` [${item.edge_position}]` : ''}
                        </td>
                    </tr>
                `;
            });

            tableHTML += `
                    </tbody>
                </table>
            `;

            contentDiv.innerHTML = tableHTML;
        }

        // 에러 표시
        function showError(message) {
            const contentDiv = document.getElementById('historyContent');
            contentDiv.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">❌</div>
                    <div>${message}</div>
                </div>
            `;
        }

        // 페이지 로드 시 데이터 가져오기
        loadBonusData();
    </script>
</body>
</html>
