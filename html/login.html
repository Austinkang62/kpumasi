<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - We One</title>
    <link rel="stylesheet" href="../css/k-pumasi-modern.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 500px;
        }

        .login-card {
            background: var(--we1-bg-card);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 60px 50px;
            box-shadow: var(--we1-shadow-gold);
            border: 2px solid rgba(212, 175, 55, 0.3);
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--we1-gradient-primary);
        }

        .logo-container {
            text-align: center;
            margin-bottom: 40px;
        }

        .kpumasi-logo-small {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            position: relative;
        }

        .brand-name {
            font-size: 36px;
            font-weight: 800;
            font-family: 'Playfair Display', serif;
            background: var(--we1-gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .brand-tagline {
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            color: var(--we1-text-secondary);
            letter-spacing: 0.5px;
        }

        .gold-line {
            width: 60px;
            height: 2px;
            background: var(--we1-gradient-primary);
            margin: 25px auto 35px;
            border-radius: 10px;
        }

        .form-title {
            font-size: 26px;
            font-weight: 700;
            font-family: 'Playfair Display', serif;
            color: var(--we1-text-primary);
            margin-bottom: 8px;
            text-align: center;
        }

        .form-subtitle {
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            color: var(--we1-text-secondary);
            margin-bottom: 35px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            color: var(--we1-text-primary);
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid rgba(212, 175, 55, 0.3);
            border-radius: 12px;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            transition: var(--we1-transition);
            background: rgba(255, 255, 255, 0.05);
            color: var(--we1-text-primary);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--we1-gold);
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.15);
            background: rgba(255, 255, 255, 0.08);
        }

        .form-input::placeholder {
            color: var(--we1-text-muted);
        }

        .form-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            font-size: 14px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--we1-text-secondary);
            font-family: 'Inter', sans-serif;
        }

        .remember-me input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--we1-gold);
        }

        .forgot-link {
            color: var(--we1-gold);
            text-decoration: none;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            transition: var(--we1-transition);
        }

        .forgot-link:hover {
            color: var(--we1-gold-light);
            text-decoration: underline;
        }

        .login-button {
            width: 100%;
            padding: 16px;
            background: var(--we1-gradient-primary);
            color: var(--we1-navy-deep);
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: var(--we1-transition);
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.3);
            position: relative;
            overflow: hidden;
        }

        .login-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.6s;
        }

        .login-button:hover::before {
            left: 100%;
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(212, 175, 55, 0.5);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .login-button:disabled {
            background: #4A4A4A;
            color: #8E8E93;
            cursor: not-allowed;
            box-shadow: none;
        }

        .divider {
            text-align: center;
            margin: 35px 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 1px;
            background: rgba(212, 175, 55, 0.2);
        }

        .divider-text {
            position: relative;
            display: inline-block;
            padding: 0 16px;
            background: var(--we1-bg-card);
            color: var(--we1-text-muted);
            font-size: 13px;
            font-family: 'Inter', sans-serif;
        }

        .signup-link {
            text-align: center;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            color: var(--we1-text-secondary);
        }

        .signup-link a {
            color: var(--we1-gold);
            font-weight: 600;
            text-decoration: none;
            transition: var(--we1-transition);
        }

        .signup-link a:hover {
            color: var(--we1-gold-light);
            text-decoration: underline;
        }

        .home-link {
            position: absolute;
            top: 30px;
            left: 30px;
            z-index: 100;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: rgba(28, 28, 30, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 100px;
            color: var(--we1-text-primary);
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: var(--we1-transition);
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        .home-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.3);
            border-color: var(--we1-gold);
        }

        .alert {
            padding: 14px 18px;
            border-radius: 12px;
            margin-bottom: 24px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            display: none;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.15);
            color: #FCA5A5;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.15);
            color: #6EE7B7;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        @media (max-width: 768px) {
            .login-card {
                padding: 50px 35px;
            }

            .home-link {
                top: 20px;
                left: 20px;
            }

            .brand-name {
                font-size: 30px;
            }
        }
    </style>
</head>
<body>
    <!-- 배경 -->
    <div class="kpumasi-background">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div id="particles"></div>
    </div>

    <!-- 홈 링크 -->
    <a href="../index.html" class="home-link">
        ← 홈으로
    </a>

    <!-- 로그인 컨테이너 -->
    <div class="login-container fade-in-up">
        <div class="login-card">
            <!-- 로고 -->
            <div class="logo-container">
                <div class="kpumasi-logo kpumasi-logo-small">
                    <div class="logo-circle logo-circle-1"></div>
                    <div class="logo-circle logo-circle-2"></div>
                    <div class="logo-center" style="width: 40px; height: 40px; font-size: 18px;">W1</div>
                </div>
                <div class="brand-name">We One</div>
                <div class="brand-tagline">Premium Network Platform</div>
            </div>

            <div class="gold-line"></div>

            <!-- 알림 -->
            <div class="alert alert-error" id="alertMessage"></div>

            <!-- 폼 제목 -->
            <div>
                <h1 class="form-title">로그인</h1>
                <p class="form-subtitle">계정에 로그인하여 시작하세요</p>
            </div>

            <!-- 로그인 폼 -->
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="userId">회원코드</label>
                    <input
                        type="text"
                        id="userId"
                        name="userId"
                        class="form-input"
                        placeholder="회원코드를 입력하세요 (예: AAA12000)"
                        required
                        autocomplete="username"
                    >
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">비밀번호</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-input"
                        placeholder="비밀번호를 입력하세요"
                        required
                        autocomplete="current-password"
                    >
                </div>

                <div class="form-actions">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe" name="rememberMe">
                        <span>로그인 상태 유지</span>
                    </label>
                    <a href="#" class="forgot-link">비밀번호 찾기</a>
                </div>

                <button type="submit" class="login-button">
                    로그인
                </button>
            </form>

            <!-- 구분선 -->
            <div class="divider">
                <span class="divider-text">또는</span>
            </div>

            <!-- 회원가입 링크 -->
            <div class="signup-link">
                아직 계정이 없으신가요? <a href="signup.html">회원가입</a>
            </div>
        </div>
    </div>

    <script>
        // 파티클 생성
        function createParticles() {
            const container = document.getElementById('particles');
            if (!container) return;

            const particleCount = 25;
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 20 + 's';
                particle.style.animationDuration = (15 + Math.random() * 15) + 's';
                container.appendChild(particle);
            }
        }

        // 페이지 로드
        window.addEventListener('DOMContentLoaded', () => {
            createParticles();

            // URL 파라미터에서 아이디 읽기 (회원가입 후 자동 입력)
            const urlParams = new URLSearchParams(window.location.search);
            const userId = urlParams.get('id');

            if (userId) {
                const userIdInput = document.getElementById('userId');
                userIdInput.value = userId;

                // 스타일 강조 (자동 입력됨을 표시)
                userIdInput.style.background = 'rgba(212, 175, 55, 0.1)';
                userIdInput.style.borderColor = 'var(--we1-gold)';

                // 비밀번호 입력란에 포커스
                document.getElementById('password').focus();

                // 환영 메시지
                showAlert(`회원가입을 축하합니다! 🎉\n아이디가 자동으로 입력되었습니다.`, 'success');
            }
        });

        // 로그인 폼 제출
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const userId = document.getElementById('userId').value;
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;

            // 로딩 상태
            const button = e.target.querySelector('button[type="submit"]');
            const originalText = button.textContent;
            button.textContent = '로그인 중...';
            button.disabled = true;

            try {
                console.log('로그인 시도:', { user_id: userId, remember_me: rememberMe });

                const response = await fetch('../api/auth/login.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({
                        user_id: userId,
                        password: password,
                        remember_me: rememberMe
                    })
                });

                console.log('응답 상태:', response.status, response.statusText);

                // 응답 텍스트 먼저 확인
                const responseText = await response.text();
                console.log('응답 텍스트:', responseText);

                // JSON 파싱 시도
                let data;
                try {
                    data = JSON.parse(responseText);
                    console.log('응답 데이터 원본:', data);
                } catch (parseError) {
                    console.error('JSON 파싱 에러:', parseError);
                    console.error('받은 응답:', responseText.substring(0, 500));
                    throw new Error('서버 응답이 올바른 JSON 형식이 아닙니다.');
                }

                // 디버깅: 응답 데이터 확인
                console.log('=== 로그인 응답 ===');
                console.log('Success:', data.success);
                console.log('Token:', data.token);
                console.log('User:', data.user);
                console.log('==================');

                if (data.success) {
                    // 토큰 및 사용자 정보 저장
                    localStorage.setItem('session_token', data.token);
                    localStorage.setItem('neural_user', JSON.stringify(data.user));

                    // 저장 확인
                    console.log('저장된 Token:', localStorage.getItem('session_token'));
                    console.log('저장된 User:', localStorage.getItem('neural_user'));

                    // 성공 메시지
                    showAlert('로그인 성공! 대시보드로 이동합니다...', 'success');

                    // 대시보드로 리다이렉트
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                } else {
                    showAlert(data.message || '로그인에 실패했습니다.', 'error');
                    button.textContent = originalText;
                    button.disabled = false;
                }
            } catch (error) {
                console.error('Login error:', error);
                showAlert('네트워크 오류가 발생했습니다.', 'error');
                button.textContent = originalText;
                button.disabled = false;
            }
        });

        // 알림 표시
        function showAlert(message, type) {
            const alert = document.getElementById('alertMessage');
            alert.textContent = message;
            alert.className = 'alert alert-' + type;
            alert.style.display = 'block';

            if (type === 'success') {
                setTimeout(() => {
                    alert.style.display = 'none';
                }, 3000);
            }
        }
    </script>
</body>
</html>
